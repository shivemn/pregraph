# Enterprise systems: SAP, IBM mainframes and robotic process automation.
# Big companies and Indian IT services hire freshers into all three.

- id: business-processes
  title: Business processes (order to cash, procure to pay)
  area: enterprise
  summary: How a company buys, makes and sells, step by step, and the documents each step creates. Every ERP consultant's job is mapping these onto software.
  hours: 12
  recommends: [accounting]
  covers:
    - topic: Order to cash
      detail: From a customer's order to money in the bank.
    - topic: Procure to pay
      detail: From a purchase request to paying the supplier.
    - topic: Record to report
      detail: Closing the books and financial reporting.
    - topic: Hire to retire
      detail: The employee lifecycle in HR.
    - topic: Documents and controls
      detail: Purchase orders, invoices, approvals and audit trails.
    - topic: Mapping processes
      detail: Flowcharts and swimlanes.
  resources:
    - resource: sap-erp-processes
      locator: "The whole learning journey"
      why: "SAP's own beginner course on procure-to-pay, plan-to-produce and order-to-cash."
      verified: true

- id: sap-basics
  title: SAP S/4HANA basics
  area: enterprise
  kind: tool
  summary: Finding your way around SAP, its modules (finance, materials, sales, production) and how one transaction feeds the next.
  hours: 25
  requires: [business-processes]
  covers:
    - topic: What ERP is
      detail: One system for finance, sales, purchasing and more.
    - topic: SAP S/4HANA
      detail: Modules, the HANA database and Fiori apps.
    - topic: Organisational structure
      detail: Company codes, plants and sales organisations.
    - topic: Master data
      detail: Customers, suppliers and materials.
    - topic: Navigating SAP
      detail: Transactions, Fiori launchpad and reports.
    - topic: Implementation projects
      detail: SAP Activate phases and consultant roles.
  resources:
    - resource: sap-erp-processes
      locator: "The whole learning journey, hands on"
      verified: true
    - resource: sap-s4-feature-scope
      locator: "Finance, Sourcing and Procurement, Sales and Manufacturing"
      verified: true

- id: sap-abap
  title: ABAP
  area: enterprise
  kind: tool
  summary: SAP's own programming language, for reports, extensions and interfaces. Modern ABAP is written for the cloud and the RESTful programming model.
  hours: 60
  requires: [programming-basics]
  recommends: [sql, sap-basics]
  covers:
    - topic: ABAP basics
      detail: Syntax, data types and internal tables.
    - topic: Data Dictionary
      detail: Tables, views and data elements.
    - topic: Open SQL
      detail: Reading and changing SAP data.
    - topic: Reports and ALV
      detail: Classic list reports.
    - topic: Modularisation
      detail: Function modules, classes and methods.
    - topic: Modern ABAP
      detail: CDS views and the RESTful programming model.
  resources:
    - resource: sap-abap-journey
      locator: "The whole learning journey"
      verified: true
    - resource: abap-keyword-docs
      locator: "ABAP for beginners, then the statements you meet"
      verified: true

- id: mainframe-zos
  title: Mainframes, z/OS and JCL
  area: enterprise
  summary: How banks and insurers still run their core systems. Data sets, TSO/ISPF, job control language (JCL) to run batch jobs, and reading a job's output.
  hours: 30
  covers:
    - topic: z/OS concepts
      detail: Address spaces, datasets and the master catalog.
    - topic: Datasets
      detail: Sequential, partitioned and VSAM datasets.
    - topic: JCL
      detail: Jobs, steps and DD statements.
    - topic: TSO and ISPF
      detail: The traditional interface for editing and submitting.
    - topic: Batch and online
      detail: Batch jobs, CICS and their roles.
    - topic: Modern tools
      detail: Zowe and VS Code for mainframe work.
  resources:
    - resource: ibm-z-xplore
      locator: "Fundamentals challenges"
      why: "A real mainframe account for free, with badges employers recognise."
      verified: true
    - resource: omp-cobol-course
      locator: "Course 1: data sets, JCL and TSO/ISPF chapters"
      verified: true

- id: cobol
  title: COBOL
  area: enterprise
  kind: tool
  summary: The language of most bank and insurance batch systems. Reading and changing existing COBOL is most of the job.
  hours: 40
  requires: [mainframe-zos]
  recommends: [programming-basics]
  covers:
    - topic: Program structure
      detail: Identification, environment, data and procedure divisions.
    - topic: Data definitions
      detail: PIC clauses, levels and records.
    - topic: File handling
      detail: Reading and writing sequential files.
    - topic: Control flow
      detail: PERFORM, IF and EVALUATE.
    - topic: Calculations
      detail: COMPUTE and decimal arithmetic.
    - topic: Embedded SQL
      detail: Working with Db2 from COBOL.
  resources:
    - resource: omp-cobol-course
      locator: "Courses 1 and 2"
      why: "Free, open and written with IBM; runs on a free mainframe account."
      verified: true
    - resource: ibm-z-xplore
      locator: "Advanced challenges: COBOL"
      role: alternative
      verified: true

- id: rpa-uipath
  title: RPA with UiPath
  area: enterprise
  kind: tool
  summary: Building software robots that click, type and read documents the way a person would, to automate repetitive office work.
  hours: 40
  recommends: [programming-basics, spreadsheets]
  covers:
    - topic: What RPA is
      detail: Software robots that use applications like people do.
    - topic: UiPath Studio
      detail: Sequences, flowcharts and activities.
    - topic: Selectors
      detail: Finding UI elements reliably.
    - topic: Data
      detail: Variables, Excel, email and PDFs.
    - topic: Error handling
      detail: Try-catch, retries and the REFramework.
    - topic: Orchestrator
      detail: Running and monitoring robots centrally.
  resources:
    - resource: uipath-academy
      locator: "The whole learning plan"
      why: "UiPath is the tool Indian RPA postings name most, and its training is free."
      verified: true
    - resource: uipath-studio-docs
      locator: "Introduction, Workflow design and Automation best practices"
      verified: true

- id: project-automation
  title: "Project: automate a real office task"
  area: enterprise
  kind: project
  summary: Pick something repetitive, like reading invoices from email into a spreadsheet, and build a robot that does it reliably, with error handling and a log.
  hours: 15
  requires: [rpa-uipath]
  brief:
    build: Find a repetitive task with real files, like reading invoice PDFs from email into Excel or filling a web form from a spreadsheet, and build a UiPath robot that does it end to end.
    shows:
    - A clear structure, such as the Robotic Enterprise Framework
    - 'Error handling: a bad file or a slow website doesn''t stop the run'
    - A log someone can read to see what happened to each item
    - Settings in a config file, not inside the workflow
    stretch:
    - Run it unattended from Orchestrator in the Community edition
    - A small report of time saved per run
    present: A recording of a run that includes a bad input, the project on GitHub, and a one-page process definition document like the ones clients sign off.
  resources:
    - resource: uipath-academy
      locator: "Use the practice exercises as a starting point"
      verified: true
    - resource: uipath-studio-docs
      locator: "Robotic Enterprise Framework and error handling"
      verified: true

- id: project-sap-process
  title: 'Project: map a business process end to end in SAP'
  area: enterprise
  kind: project
  summary: Order to cash or procure to pay, step by step, documented the way consultants hand it over.
  hours: 20
  requires: [sap-basics, business-processes]
  recommends: [accounting]
  brief:
    build: Take order to cash or procure to pay and follow it end to end with SAP's free learning journey, plus a trial or practice system if you can get one. Document each step as a consultant would for a client.
    shows:
    - Each step with its Fiori app or transaction, the document it creates and who does it
    - 'The setup behind it: organisational units and master data'
    - The accounting entry at each step
    - A test script someone else could follow
    stretch:
    - The fit-gap questions you'd ask a real client
    - A second process that connects to the first
    present: A process document with flow diagrams and a test script, like the ones handed over at the end of a project.
  resources:
    - resource: sap-s4-feature-scope
      locator: The Sales, and Sourcing and Procurement, sections for what each step does
      role: primary
      verified: true
    - resource: sap-erp-processes
      locator: All four units, as your map of procure-to-pay, plan-to-produce and order-to-cash
      role: alternative
      verified: true

- id: project-cobol-batch
  title: 'Project: write a COBOL batch job'
  area: enterprise
  kind: project
  summary: A batch program that reads, checks, updates and reports, run by JCL on a real mainframe.
  hours: 20
  requires: [cobol, mainframe-zos]
  recommends: [sql]
  brief:
    build: On the free IBM Z Xplore system, write a COBOL batch program that reads a file of records, such as bank transactions, checks them, updates a master file or table, and prints a report, all run by JCL.
    shows:
    - JCL that runs the steps in order and checks return codes
    - Bad records sent to an error file with a reason
    - A report with headings, totals and page breaks
    - Test data that covers the edge cases, with the expected output
    stretch:
    - Embedded SQL against Db2
    - Restart logic, so a failed run picks up where it stopped
    present: The code, JCL and test data in a repo, a README explaining the job flow, and the output listing.
  resources:
    - resource: omp-cobol-course
      locator: The labs, then grow the last one into your own job
      role: primary
      verified: true
    - resource: ibm-z-xplore
      locator: The free mainframe account to run it on
      role: alternative
      verified: true

- id: project-sap-fit-gap
  title: 'Project: a fit-gap and design for a mid-size company'
  area: enterprise
  kind: project
  summary: A realistic company's processes compared with standard SAP, with the gaps, the design and the configuration plan.
  hours: 50
  requires: [sap-basics, business-processes]
  recommends: [accounting, technical-writing]
  brief:
    build: Write up a realistic mid-size manufacturer or distributor, its order-to-cash and procure-to-pay processes, and compare them with SAP's standard processes. Produce the fit-gap and the design documents a consultant would.
    shows:
      - Current-state process maps
      - 'A fit-gap table: fits, gaps and how each gap is handled'
      - Organisational structure and master-data design
      - A configuration plan and test scenarios
    stretch:
      - A data migration plan
      - Change-management notes for users
    present: The document set and a ten-minute walk-through.
  resources:
    - resource: sap-s4-feature-scope
      locator: The sections for the processes you design
      role: primary
      verified: true
    - resource: sap-erp-processes
      locator: The whole journey
      role: alternative
      verified: true

- id: project-zxplore
  title: 'Project: finish the IBM Z Xplore fundamentals'
  area: enterprise
  kind: project
  summary: A real mainframe account used to edit datasets, submit JCL and run COBOL, with notes on each step.
  hours: 10
  requires: [mainframe-zos]
  recommends: [cobol]
  brief:
    build: Sign up for IBM Z Xplore's free mainframe access and work through the fundamentals challenges, keeping your own notes on datasets, JCL and the tools.
    shows:
      - The fundamentals challenges completed
      - Your own notes on datasets, JCL and job output
      - One small change of your own to a challenge program
      - The badge, if you earn it
    stretch:
      - Start the advanced challenges
      - Use VS Code with the Zowe extension for the work
    present: Your notes as a short guide and the badge.
  resources:
    - resource: ibm-z-xplore
      locator: The fundamentals challenges
      role: primary
      verified: true
    - resource: omp-cobol-course
      locator: The first labs, if you want more COBOL practice
      role: alternative
      verified: true

- id: project-mainframe-api
  title: 'Project: a COBOL system with a modern front'
  area: enterprise
  kind: project
  summary: A COBOL and Db2 batch system with restart and reports, driven from modern tools through Zowe and automated tests.
  hours: 50
  requires: [cobol, mainframe-zos]
  recommends: [rest-apis, sql, ci-cd]
  brief:
    build: 'Build a small batch system on the mainframe, such as end-of-day account processing with Db2, then drive and test it from outside: submit jobs and read results with the Zowe CLI, and run the tests automatically from a pipeline.'
    shows:
      - COBOL programs with embedded SQL against Db2
      - JCL procedures with restart after failure
      - Jobs submitted and checked from the Zowe CLI
      - Automated tests run from a pipeline
    stretch:
      - A small web page that shows the report
      - Performance measured on a larger input
    present: The repo, a diagram of the job flow, and a recording of the pipeline running.
  resources:
    - resource: omp-cobol-course
      locator: The labs, as a base for your programs
      role: primary
      verified: true
    - resource: ibm-z-xplore
      locator: The advanced challenges
      role: alternative
      verified: true

- id: project-rpa-basic
  title: 'Project: automate a desktop task with UiPath'
  area: enterprise
  kind: project
  summary: A simple robot that reads a spreadsheet and fills a web form, built in UiPath Studio.
  hours: 8
  requires: [rpa-uipath]
  brief:
    build: 'Use UiPath Studio Community to automate a simple task: read rows from Excel and enter them into a practice web form, then save a confirmation for each.'
    shows:
      - Reads every row and fills the form
      - Handles a missing value without stopping
      - Saves a result for each row
      - Clear names for every activity
    stretch:
      - Email a summary when done
      - Run it from the UiPath Assistant
    present: A screen recording of a run and the exported project.
  resources:
    - resource: uipath-studio-docs
      locator: The getting-started sections
      role: primary
      verified: true
    - resource: uipath-academy
      locator: The developer foundation course
      role: alternative
      verified: true

- id: project-rpa-orchestrated
  title: 'Project: an orchestrated automation with queues'
  area: enterprise
  kind: project
  summary: 'A production-style automation: queues, the framework, document understanding, Orchestrator and an ROI report.'
  hours: 50
  requires: [rpa-uipath]
  recommends: [spreadsheets, business-processes]
  brief:
    build: 'Automate a realistic process end to end, such as invoice processing: read invoices from email, extract fields, validate them against a spreadsheet of purchase orders, and post them to a web app, using queues and Orchestrator in UiPath''s Community edition.'
    shows:
      - A dispatcher and performer with Orchestrator queues
      - Business and system exceptions handled differently
      - Document extraction with a human check for low-confidence fields
      - Logs and a report per run
      - Time saved worked out per month
    stretch:
      - Attended and unattended parts working together
      - Unit tests with UiPath's test tools
    present: A process definition and solution design document, a demo video and the project.
  resources:
    - resource: uipath-studio-docs
      locator: The REFramework pages and the activities for queues
      role: primary
      verified: true
    - resource: uipath-academy
      locator: The advanced developer courses
      role: alternative
      verified: true
