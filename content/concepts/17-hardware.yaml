# Hardware: chip design and verification, FPGAs and circuit boards.

- id: verilog
  title: Verilog and RTL design
  area: hardware
  kind: tool
  summary: Describing digital circuits in code, from adders to state machines, and simulating them before anything is built.
  hours: 40
  requires: [digital-logic]
  resources:
    - resource: hdlbits
      locator: "Every section, in order"
      why: "Hundreds of small problems, checked instantly in the browser. The usual first step for VLSI freshers."
      verified: true
    - resource: chipverify
      locator: "Verilog tutorial"
      role: alternative
      verified: true

- id: design-verification
  title: Design verification (SystemVerilog and UVM)
  area: hardware
  summary: Proving a chip design works before it's made. Testbenches, constrained random tests, assertions, coverage and UVM, the industry's standard framework.
  hours: 60
  requires: [verilog, oop-design]
  resources:
    - resource: chipverify
      locator: "SystemVerilog, then UVM tutorials"
      verified: true
    - resource: verification-academy
      locator: "UVM basic and advanced courses"
      verified: true
    - resource: eda-playground
      locator: "Run every example yourself"
      role: alternative
      verified: true

- id: asic-flow
  title: From RTL to chip (ASIC flow)
  area: hardware
  summary: Synthesis, timing analysis (STA), floorplanning, placement and routing, and the checks before a design goes to the factory.
  hours: 40
  requires: [verilog]
  recommends: [computer-architecture]
  resources:
    - resource: openroad-docs
      locator: "Getting started and the flow tutorial"
      why: "Free, open-source tools you can run the whole flow with on a laptop."
      verified: true

- id: pcb-design
  title: PCB design
  area: hardware
  kind: tool
  summary: Turning a circuit into a printed circuit board. Schematics, footprints, layout, design rules and the files a factory needs.
  hours: 25
  recommends: [microcontrollers]
  resources:
    - resource: kicad-getting-started
      locator: "The whole tutorial"
      verified: true

- id: project-chip-design
  title: "Project: a small design, verified"
  area: hardware
  kind: project
  summary: Design something real in Verilog (a UART, a FIFO, a small CPU), write a testbench that checks it properly, and put the code and coverage results on GitHub.
  hours: 30
  requires: [verilog]
  recommends: [design-verification]
  brief:
    build: Design a block small enough to finish and big enough to be interesting, such as a UART, a synchronous FIFO or a simple RISC-V core, in Verilog or SystemVerilog, and verify it with a self-checking testbench.
    shows:
    - 'A short spec first: ports, timing and what each mode does'
    - A testbench that checks results by itself, not by eye on a waveform
    - Random tests as well as directed ones, and the corner cases you covered (full, empty, reset mid-transfer)
    - Coverage numbers, and what still isn't covered
    stretch:
    - Run it through the open-source OpenLane flow for area and timing
    - Rewrite the testbench in UVM or cocotb
    present: A repo with the spec, the RTL, the testbench, waveforms of the interesting cases and the coverage report. Be ready to explain one bug your testbench caught.
  resources:
    - resource: eda-playground
      locator: "Simulate and share your design"
      verified: true
    - resource: chipverify
      locator: "Verilog examples: FIFO, UART and counters"
      verified: true

- id: project-pcb
  title: 'Project: design a circuit board and get it made'
  area: hardware
  kind: project
  summary: A schematic, a laid-out board, fabrication files sent to a maker, and a board that works when it comes back.
  hours: 25
  requires: [pcb-design]
  recommends: [microcontrollers, analog-electronics]
  brief:
    build: Design a small board with a real job, such as a breakout for a sensor, a USB-powered LED driver or a shield for your microcontroller project. Draw it in KiCad, lay it out, order a few from a low-cost maker and assemble one.
    shows:
    - A clean schematic with part values and footprints checked against datasheets
    - A layout that passes the design-rule check, with sensible power and ground routing
    - Gerber files and a bill of materials ready for a maker
    - The assembled board tested, and a list of what you'd change in revision two
    stretch:
    - A four-layer board, or one with a switching regulator laid out properly
    - Assembly by the maker, with a placement file
    present: The KiCad project in a repo with renders of the board, photos of the real one, and your test notes.
  resources:
    - resource: kicad-getting-started
      locator: The whole tutorial, then start your own board
      role: primary
      verified: true

- id: project-sensor-display
  title: 'Project: read a sensor and show it'
  area: hardware
  kind: project
  summary: A temperature or distance sensor read by a microcontroller and shown on a small display, first in a simulator.
  hours: 8
  requires: [microcontrollers]
  brief:
    build: In Wokwi, then on real hardware, connect a sensor such as a DHT22 or an ultrasonic sensor to an Arduino or ESP32 and show its readings on an OLED or LCD.
    shows:
      - Readings that match a reference you trust
      - A display that updates without flicker
      - A wiring diagram
      - Code split into setup, reading and display
    stretch:
      - Log readings to an SD card
      - Send them over Wi-Fi
    present: Photos, a short video and the code with the diagram.
  resources:
    - resource: wokwi
      locator: Simulate it first
      role: alternative
      verified: true
    - resource: arduino-docs
      locator: The built-in examples and the sensor libraries you use
      role: primary
      verified: true

- id: project-rtos-device
  title: 'Project: a connected device on an RTOS'
  area: hardware
  kind: project
  summary: A finished device with FreeRTOS tasks, low power, over-the-air updates and its own board.
  hours: 70
  requires: [rtos, embedded-protocols]
  recommends: [pcb-design, networking]
  brief:
    build: 'Build a device someone could use daily, such as an air-quality monitor or a water-tank level alarm, on an ESP32 with FreeRTOS: several tasks, Wi-Fi, low-power sleep, over-the-air updates and a custom PCB.'
    shows:
      - Separate tasks with queues between them, and why
      - Battery life measured and improved
      - Over-the-air updates that can roll back
      - A custom PCB, assembled and tested
      - 'Fault handling: sensor failure, Wi-Fi loss'
    stretch:
      - A small cloud dashboard
      - An enclosure you designed
    present: A project write-up with power measurements, the schematic and code, and a demo video.
  resources:
    - resource: freertos-book
      locator: The chapters on tasks, queues and software timers
      role: primary
      verified: true
    - resource: kicad-getting-started
      locator: For the board
      role: alternative
      verified: true

- id: project-verilog-basics
  title: 'Project: design and simulate an ALU and counters'
  area: hardware
  kind: project
  summary: Small digital blocks in Verilog, each with a testbench and waveforms.
  hours: 8
  requires: [verilog]
  recommends: [digital-logic]
  brief:
    build: Write an ALU, an up-down counter and a simple state machine (a traffic light) in Verilog, and test each with a testbench in a free simulator.
    shows:
      - Each block with a testbench
      - Waveforms that show it works
      - 'Synthesisable code: no simulation-only tricks in the design'
      - Clean module interfaces
    stretch:
      - Self-checking testbenches
      - Put one on an FPGA board
    present: The code and waveform screenshots in a repo.
  resources:
    - resource: hdlbits
      locator: The problems for the blocks you build
      role: alternative
      verified: true
    - resource: chipverify
      locator: The Verilog tutorial pages
      role: primary
      verified: true

- id: project-riscv-soc
  title: 'Project: a RISC-V core that runs C'
  area: hardware
  kind: project
  summary: A pipelined RISC-V core that runs compiled C programs, verified against a reference and taken through an open-source flow.
  hours: 80
  requires: [verilog, computer-architecture, design-verification]
  recommends: [asic-flow]
  brief:
    build: Design a five-stage pipelined RV32I core in Verilog or SystemVerilog with hazard handling, run compiled C programs on it, check it against a reference simulator, and take it through OpenLane to a layout.
    shows:
      - All RV32I instructions, passing a standard test suite
      - Forwarding and stalls for hazards, with tests
      - C programs compiled and run, with cycle counts
      - 'Synthesis and layout results: area and timing'
    stretch:
      - Branch prediction and its effect on cycles per instruction
      - Run it on an FPGA
    present: A detailed write-up, the repo, and the layout image.
  resources:
    - resource: nand2tetris
      locator: For the computer you are building, if you need a refresher
      role: alternative
      verified: true
    - resource: openroad-docs
      locator: The getting-started guide and the flow documentation
      role: primary
      verified: true
