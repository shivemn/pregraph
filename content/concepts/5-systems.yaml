- id: reliability-patterns
  title: Designing for failure
  area: systems
  summary: Timeouts, retries, idempotency, circuit breakers, graceful degradation, SLOs and disaster recovery.
  hours: 10
  requires: [web-http]
  recommends: [observability, distributed-systems]
  covers:
    - topic: Failure is normal
      detail: Disks, machines, networks and dependencies fail; design assuming they will.
    - topic: Timeouts
      detail: Every remote call needs one, set from measured latency.
    - topic: Retries with backoff and jitter
      detail: Retrying safely without causing a retry storm.
    - topic: Idempotency
      detail: Operations that can run twice with the same result, so retries are safe.
    - topic: Circuit breakers and load shedding
      detail: Failing fast when a dependency is down, and dropping work before overloading.
    - topic: Graceful degradation
      detail: Serving a simpler page or stale data instead of an error.
    - topic: Redundancy
      detail: 'No single points of failure: multiple instances, zones and regions.'
    - topic: Health checks
      detail: Liveness versus readiness, and checks that don't take the whole fleet down.
    - topic: SLIs, SLOs and error budgets
      detail: Measuring reliability as users feel it, and deciding how much risk to take.
    - topic: Disaster recovery
      detail: Backups you have restored, RPO and RTO, and failover drills.
    - topic: Cascading failures
      detail: How one overloaded service takes down others, and how queues and deadlines stop it.
  resources:
    - resource: builders-timeouts
      locator: The whole article
      role: primary
      verified: true
      why: The clearest explanation of why retries without jitter make outages worse.
    - resource: sre-book
      locator: Chapter 22, Addressing Cascading Failures, and chapter 4, Service Level Objectives
      role: primary
      verified: true
    - resource: microservices-io
