- id: distributed-systems
  title: Distributed systems
  area: systems
  summary: Replication, consensus with Raft, and staying correct when machines and networks fail.
  hours: 60
  requires: [concurrency, networking]
  recommends: [database-internals]
  covers:
    - topic: Why it's hard
      detail: Partial failure, unreliable networks and no shared clock.
    - topic: Time and ordering
      detail: Physical clocks and their drift, Lamport and vector clocks, and happens-before.
    - topic: Consistency models
      detail: Linearizability, sequential, causal and eventual consistency, and what each guarantees.
    - topic: CAP and PACELC
      detail: What you give up during a partition, and the latency–consistency trade-off the rest of the time.
    - topic: Replication and quorums
      detail: Copies of data, and R + W > N for overlapping reads and writes.
    - topic: Consensus
      detail: Agreeing on one value despite failures; Raft's leader election and log replication.
    - topic: Leader election and locks
      detail: Leases, fencing tokens, and why a distributed lock is harder than it looks.
    - topic: Distributed transactions
      detail: Two-phase commit and its blocking problem, and sagas.
    - topic: Gossip, Bloom filters and Merkle trees
      detail: Tools large systems use to spread state, test membership and compare replicas cheaply.
    - topic: MapReduce
      detail: Splitting a big computation across machines, and handling stragglers and failures.
    - topic: Build it
      detail: Implement Raft and a fault-tolerant key-value store in the MIT labs or Maelstrom.
  resources:
    - resource: kleppmann-distsys-notes
      locator: The whole set of notes, before or alongside the MIT course
      role: alternative
      verified: true
    - resource: raft-site
      locator: The visualisation, then the paper it links to
