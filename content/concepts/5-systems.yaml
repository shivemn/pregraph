- id: messaging
  title: Kafka and message queues
  area: systems
  summary: Decoupling services with queues and logs. Delivery guarantees, ordering and consumer groups.
  hours: 10
  kind: tool
  requires: [networking]
  recommends: [concurrency]
  covers:
    - topic: Why queues
      detail: Decoupling producers and consumers, smoothing spikes and doing slow work later.
    - topic: Queues versus logs
      detail: RabbitMQ-style queues that delete messages, and Kafka-style logs you can replay.
    - topic: Kafka's model
      detail: Topics, partitions, offsets, brokers and replication.
    - topic: Consumer groups
      detail: Sharing partitions across consumers, and rebalancing.
    - topic: Ordering
      detail: Ordering within a partition only, and choosing keys to keep related events together.
    - topic: Delivery guarantees
      detail: At-most-once, at-least-once and exactly-once, and what each really means.
    - topic: Idempotent consumers
      detail: Handling duplicates safely, because at-least-once delivery will send some.
    - topic: Retries and dead-letter queues
      detail: Parking messages that keep failing so they don't block the rest.
    - topic: Event-driven design
      detail: Publishing events instead of calling services, and the change-data-capture pattern.
  resources:
    - resource: kafka-docs
      locator: "Introduction, then Design"
      verified: true

