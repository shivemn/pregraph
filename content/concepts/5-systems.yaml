    - topic: Locks
      detail: Mutexes, spin locks and lock granularity.
    - topic: Condition variables and semaphores
      detail: Waiting for a condition, and the producer-consumer problem.
    - topic: Deadlock
      detail: The four conditions, and avoiding it with lock ordering.
    - topic: Atomic operations
      detail: Compare-and-swap and lock-free counters.
    - topic: Higher-level tools
      detail: Thread pools, futures and concurrent queues in Java or Python.
