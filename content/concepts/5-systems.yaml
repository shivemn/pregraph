- id: project-embedded
  title: "Project: build a working device"
  area: systems
  summary: A sensor or controller that reads real input, does something useful with it and runs on its own.
  hours: 30
  kind: project
  requires: [microcontrollers, embedded-protocols]
  brief:
    build: Build a device that reads something real and acts on it by itself, such as a plant waterer, a room monitor that logs temperature and sends alerts, or a fan controller. Prototype it in Wokwi, then build it on an ESP32 or Arduino.
    shows:
    - A sensor read over I2C, SPI or UART, with values checked against something you trust
    - It starts on power-up and recovers from a sensor error
    - A circuit diagram and a parts list
    - Power use thought about, if it runs on a battery
    stretch:
    - FreeRTOS tasks instead of one loop
    - A small PCB designed in KiCad
    present: Photos, a short video, the schematic and the code on GitHub, with a README that says how you tested it.
  resources:
    - resource: arduino-docs
      locator: "Start from a sensor tutorial and extend it"
      verified: true
    - resource: wokwi
      locator: "Prototype the whole project in the simulator first"
      role: alternative
      verified: true
