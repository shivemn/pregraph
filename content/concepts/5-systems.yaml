- id: partitioning-replication
  title: Replication and sharding
  area: systems
  summary: Copying data for safety and speed, splitting it across machines, and what breaks when you do.
  hours: 15
  requires: [sql, hash-tables]
  recommends: [database-internals]
  covers:
    - topic: Why replicate
      detail: Surviving failures, serving more reads and putting data near users.
    - topic: Leader-follower replication
      detail: One writer, many readers; synchronous versus asynchronous copies.
    - topic: Replication lag
      detail: Reading your own writes, monotonic reads, and the bugs lag causes.
    - topic: Multi-leader and leaderless
      detail: Writes in several places, conflicts, and quorum reads and writes (Dynamo, Cassandra).
    - topic: Partitioning (sharding)
      detail: Splitting data by key range or by hash, and choosing a shard key.
    - topic: Consistent hashing
      detail: Adding and removing nodes without moving most of the data.
    - topic: Hot spots and rebalancing
      detail: Skewed keys such as a celebrity's posts, and moving partitions safely.
    - topic: Secondary indexes and cross-shard queries
      detail: Local versus global indexes, and why joins across shards are expensive.
    - topic: Picking a store
      detail: SQL, document, key-value and wide-column databases, by how the data is read and written.
