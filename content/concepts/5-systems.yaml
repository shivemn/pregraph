- id: caching
  title: Caching
  area: systems
  summary: 'Keeping hot data close: where caches go, the main patterns, expiry, invalidation and the failures caches cause.'
  hours: 8
  requires: [web-http, hash-tables]
  recommends: [redis]
  covers:
    - topic: Why cache
      detail: 'Cutting latency and load by keeping hot data close, and the cost: stale data.'
    - topic: Where caches live
      detail: Browser, CDN, application memory, a shared cache like Redis, and the database's own cache.
    - topic: Cache-aside
      detail: Read from the cache, fall back to the database, then fill the cache; the most common pattern.
    - topic: Read-through, write-through and write-behind
      detail: Who writes to the cache and when, and what each risks.
    - topic: Expiry and eviction
      detail: TTLs, LRU and LFU, and sizing a cache.
    - topic: Invalidation
      detail: Deleting or updating entries on writes, and why it's one of the hard problems.
    - topic: Stampedes and hot keys
      detail: Many requests missing at once, request coalescing, jittered TTLs and spreading hot keys.
    - topic: CDNs
      detail: Caching static files and API responses at the edge, cache headers and purging.
  resources:
