  hours: 40
  requires: [computer-architecture, c-and-memory]
  recommends: [concurrency, cpp]
  covers:
    - topic: Why parallelism
      detail: 'Why clock speeds stalled, and the kinds of parallelism: multi-core, SIMD, multi-threading and GPUs.'
    - topic: Speed-up limits
      detail: Amdahl's law, work and span, and why some programs don't scale.
    - topic: Shared-memory programming
      detail: Threads and OpenMP loops on a multi-core CPU, and avoiding data races.
    - topic: SIMD and vectorisation
      detail: Doing the same operation on many values at once, and helping the compiler do it.
    - topic: GPU architecture
      detail: Thousands of simple cores, warps, and the memory hierarchy from registers to global memory.
    - topic: CUDA basics
      detail: Kernels, threads, blocks and grids; write and launch a kernel that adds two vectors.
    - topic: Memory performance
      detail: Coalesced access, shared memory and why moving data costs more than computing.
    - topic: Reductions and matrix multiply
      detail: Two classic kernels, and how tiling speeds up matrix multiplication.
    - topic: Profiling
      detail: Measuring where time goes with a profiler before optimising anything.
    - topic: Distributed basics
      detail: Message passing (MPI) and splitting work across machines.
  resources:
