- id: matlab
  title: MATLAB
  area: electrical
  kind: tool
  summary: The numerical computing environment used across ECE and EEE for signals, control and simulation. Octave is a free alternative that runs most of the same code.
  hours: 10
  requires: [linear-algebra]
  recommends: [signals-and-systems, control-systems]
  covers:
    - topic: Arrays and matrices
      detail: Creating, indexing and operating on whole arrays at once.
    - topic: Scripts and functions
      detail: Writing reusable code in .m files.
    - topic: Plotting
      detail: Line, scatter and subplot figures, with labels.
    - topic: Signals
      detail: FFTs and filtering with the Signal Processing Toolbox.
    - topic: Control and simulation
      detail: Transfer functions, step responses and Simulink models.
    - topic: Octave
      detail: Running the same work for free.
  resources:
    - resource: matlab-onramp
      locator: The whole course
      role: primary
      verified: true
    - resource: octave-docs
      locator: The getting-started chapters, if you use Octave
      role: alternative
      verified: true
