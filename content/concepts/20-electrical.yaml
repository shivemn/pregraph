# Electronics and electrical engineering: the core subjects of ECE and EEE
# degrees and of the GATE EC and EE papers, and the jobs built on them.

- id: circuit-analysis
  title: Circuit analysis
  area: electrical
  summary: Ohm's and Kirchhoff's laws, Thevenin and Norton equivalents, RC and RL transients, and AC circuits with phasors.
  hours: 35
  recommends: [calculus]
  covers:
    - topic: Circuit laws
      detail: Ohm's law and Kirchhoff's laws.
    - topic: Analysis methods
      detail: Nodal and mesh analysis.
    - topic: Theorems
      detail: Thevenin, Norton and superposition.
    - topic: Capacitors and inductors
      detail: Energy storage and transient response.
    - topic: AC circuits
      detail: Phasors, impedance and power.
    - topic: Frequency response
      detail: Filters and resonance.
  resources:
    - resource: lessons-electric-circuits
      locator: "Volume I (DC) and Volume II (AC)"
      verified: true
    - resource: mit-6002
      locator: "Lectures 1–7, 13–16"
      verified: true

- id: analog-electronics
  title: Analog electronics
  area: electrical
  summary: Diodes, BJTs and MOSFETs, biasing and small-signal amplifiers, op-amps, filters and oscillators.
  hours: 45
  requires: [circuit-analysis]
  covers:
    - topic: Diodes
      detail: Rectifiers, clippers and regulators.
    - topic: Transistors
      detail: BJT and MOSFET operation and biasing.
    - topic: Amplifiers
      detail: Gain, input and output impedance.
    - topic: Op-amps
      detail: Inverting, non-inverting and integrator circuits.
    - topic: Feedback
      detail: Stability and bandwidth.
    - topic: Filters and oscillators
      detail: Active filters and generating signals.
  resources:
    - resource: lessons-electric-circuits
      locator: "Volume III (Semiconductors)"
      verified: true
    - resource: mit-6002
      locator: "Lectures 8–12, 17–25"
      verified: true

- id: signals-and-systems
  title: Signals and systems
  area: electrical
  summary: Linear time-invariant systems, convolution, Fourier, Laplace and z-transforms, sampling, and filters.
  hours: 40
  requires: [calculus]
  recommends: [complex-analysis]
  covers:
    - topic: Signals
      detail: Continuous and discrete signals and their properties.
    - topic: LTI systems
      detail: Linearity, time invariance and convolution.
    - topic: Fourier series and transforms
      detail: Signals as sums of frequencies.
    - topic: Laplace and z-transforms
      detail: Analysing systems with transforms.
    - topic: Sampling
      detail: The sampling theorem and aliasing.
    - topic: Filters
      detail: Designing systems that change frequency content.
  resources:
    - resource: mit-6003
      locator: "All lectures"
      verified: true
    - resource: pysdr
      locator: "Frequency domain, sampling and filters chapters"
      verified: true

- id: control-systems
  title: Control systems
  area: electrical
  summary: Feedback, transfer functions, stability, root locus and Bode plots, PID controllers and state-space models.
  hours: 40
  requires: [signals-and-systems]
  recommends: [ordinary-differential-equations]
  covers:
    - topic: Modelling
      detail: Transfer functions and block diagrams.
    - topic: Time response
      detail: Step response, overshoot and settling time.
    - topic: Stability
      detail: Poles, Routh–Hurwitz and root locus.
    - topic: Frequency methods
      detail: Bode and Nyquist plots, gain and phase margins.
    - topic: PID control
      detail: Tuning proportional, integral and derivative terms.
    - topic: State space
      detail: Modern control with state equations.
  resources:
    - resource: feedback-systems-book
      locator: "Chapters 1–3, 6–8, 10–12"
      verified: true
    - resource: mit-res6010
      locator: "Lectures 1–12"
      verified: true

- id: communication-systems
  title: Communication systems
  area: electrical
  summary: Modulation, noise, channel capacity, digital modulation (PSK, QAM), error-correcting codes and how wireless links work.
  hours: 40
  requires: [signals-and-systems, probability]
  covers:
    - topic: Signals and noise
      detail: Bandwidth, SNR and channel capacity.
    - topic: Analog modulation
      detail: AM and FM.
    - topic: Digital modulation
      detail: ASK, FSK, PSK and QAM.
    - topic: Error performance
      detail: Bit error rate and noise.
    - topic: Coding
      detail: Source and channel coding basics.
    - topic: Wireless systems
      detail: Multipath, fading and cellular basics.
  resources:
    - resource: mit-602
      locator: "Lecture notes and problem sets"
      verified: true
    - resource: pysdr
      locator: "Digital modulation, noise and link budgets chapters"
      verified: true

- id: electromagnetics
  title: Electromagnetics
  area: electrical
  summary: Maxwell's equations, plane waves, transmission lines and the Smith chart, waveguides and antennas.
  hours: 40
  requires: [multivariable-calculus]
  covers:
    - topic: Electrostatics
      detail: Charges, fields and potential.
    - topic: Magnetostatics
      detail: Currents and magnetic fields.
    - topic: Maxwell's equations
      detail: The four laws in one picture.
    - topic: Waves
      detail: Propagation, reflection and polarisation.
    - topic: Transmission lines
      detail: Impedance, matching and standing waves.
    - topic: Antennas
      detail: Radiation basics.
  resources:
    - resource: ellingson-em
      locator: "Chapters 1–3 and 9; then Volume 2 for waveguides and antennas"
      verified: true

- id: electrical-machines
  title: Electrical machines
  area: electrical
  summary: Transformers, DC machines, induction and synchronous motors and generators, and how they're tested.
  hours: 35
  requires: [circuit-analysis]
  covers:
    - topic: Magnetic circuits
      detail: Flux, reluctance and transformers' basis.
    - topic: Transformers
      detail: Equivalent circuits, tests and efficiency.
    - topic: DC machines
      detail: Motors and generators.
    - topic: Induction motors
      detail: How they work and their torque-speed curves.
    - topic: Synchronous machines
      detail: Alternators and motors.
    - topic: Motor control basics
      detail: Starting and speed control.
  resources:
    - resource: mit-6685
      locator: "Course notes, chapters 1–7"
      verified: true

- id: power-systems
  title: Power systems
  area: electrical
  summary: Generation, transmission and distribution, per-unit analysis, load flow, faults and protection.
  hours: 35
  requires: [circuit-analysis]
  recommends: [electrical-machines]
  covers:
    - topic: Generation, transmission and distribution
      detail: How electricity reaches you.
    - topic: Per-unit system
      detail: Simplifying calculations.
    - topic: Load flow
      detail: Voltages and power flows in a network.
    - topic: Faults
      detail: Short-circuit calculations.
    - topic: Protection
      detail: Relays, circuit breakers and coordination.
    - topic: Stability and economics
      detail: Keeping the grid stable, and economic dispatch.
  resources:
    - resource: mit-6061
      locator: "The course textbook and problem sets"
      verified: true

- id: power-electronics
  title: Power electronics
  area: electrical
  summary: Converters and inverters, switching devices, PWM, and the circuits inside chargers, solar inverters, EVs and motor drives.
  hours: 40
  requires: [analog-electronics]
  recommends: [control-systems]
  covers:
    - topic: Switching devices
      detail: Diodes, MOSFETs, IGBTs and thyristors.
    - topic: Rectifiers
      detail: AC to DC, controlled and uncontrolled.
    - topic: DC-DC converters
      detail: Buck, boost and buck-boost.
    - topic: Inverters
      detail: DC to AC and PWM.
    - topic: Losses and thermal design
      detail: Switching and conduction losses, and heat sinks.
    - topic: Control
      detail: Closing the loop on converters.
  resources:
    - resource: mit-6334
      locator: "Lecture notes and problem sets"
      verified: true

- id: plc-scada
  title: PLCs and SCADA
  area: electrical
  kind: tool
  summary: Programming the controllers that run factory machines in ladder logic, and the SCADA screens that monitor whole plants.
  hours: 30
  recommends: [digital-logic, electrical-machines]
  covers:
    - topic: PLC hardware
      detail: CPUs, I/O modules and scan cycles.
    - topic: Ladder logic
      detail: Contacts, coils and rungs.
    - topic: Timers and counters
      detail: Timed and counted operations.
    - topic: Other languages
      detail: Function block diagrams and structured text (IEC 61131-3).
    - topic: HMI and SCADA
      detail: Operator screens, alarms and trends.
    - topic: Industrial networks
      detail: Modbus, Profibus and EtherNet/IP.
  resources:
    - resource: control-com-openplc
      locator: "The whole article"
      verified: true
    - resource: openplc-getting-started
      locator: "Getting started, then your first project"
      verified: true

- id: robotics
  title: Robotics fundamentals
  area: electrical
  summary: How robots move and sense. Kinematics, dynamics, motion planning, sensors and control.
  hours: 50
  requires: [linear-algebra]
  recommends: [control-systems]
  covers:
    - topic: Kinematics
      detail: Positions and orientations, and forward and inverse kinematics.
    - topic: Dynamics
      detail: Forces and motion of robot arms.
    - topic: Sensors
      detail: Encoders, IMUs, lidar and cameras.
    - topic: Control
      detail: Joint control and trajectory following.
    - topic: Motion planning
      detail: Finding collision-free paths.
    - topic: Localisation and mapping
      detail: Knowing where the robot is.
  resources:
    - resource: modern-robotics
      locator: "Chapters 2–6, 10 and 11, with the videos"
      verified: true

- id: ros
  title: ROS 2
  area: electrical
  kind: tool
  summary: The Robot Operating System that most robotics companies build on. Nodes, topics, services, launch files and simulation.
  hours: 30
  requires: [programming-basics]
  recommends: [linux-admin, cpp]
  covers:
    - topic: Nodes and topics
      detail: Programs that publish and subscribe to messages.
    - topic: Services and actions
      detail: Request-response and long-running goals.
    - topic: Launch files
      detail: Starting a system with one command.
    - topic: Simulation
      detail: Gazebo and visualising with RViz.
    - topic: Transforms
      detail: tf2 for coordinate frames.
    - topic: Navigation
      detail: The Nav2 stack.
  resources:
    - resource: ros2-tutorials
      locator: "Beginner: CLI tools and Beginner: client libraries"
      verified: true

- id: project-robot
  title: "Project: a robot that does one job"
  area: electrical
  kind: project
  summary: A small robot, real or simulated in ROS 2, that does one thing well, such as following a line or mapping a room. Show the code, a video and what you'd fix.
  hours: 30
  requires: [ros]
  brief:
    build: Build one robot that does one job well, either real (a line follower or obstacle avoider) or simulated in ROS 2 with Gazebo (one that maps a room and drives to a point).
    shows:
    - Sensor readings filtered, not used raw
    - A controller you tuned, with behaviour before and after
    - 'For ROS: nodes, topics and a launch file someone else can run'
    - What fails, and what you would fix next
    stretch:
    - Navigation with the Nav2 stack
    - A real robot and a simulation of it that behave alike
    present: A one-minute video of it working (and one of it failing), the code with setup steps, and a diagram of the nodes or circuit.
  resources:
    - resource: ros2-tutorials
      locator: "Intermediate tutorials and the simulation section"
      verified: true

- id: project-analog-circuit
  title: 'Project: design, simulate and build an amplifier'
  area: electrical
  kind: project
  summary: An analog circuit taken from spec to hand calculation, simulation, breadboard and measurement.
  hours: 25
  requires: [analog-electronics]
  recommends: [pcb-design, signals-and-systems]
  brief:
    build: Design a small analog circuit to a spec, such as an audio preamp, an active filter or a sensor front end with an op-amp. Simulate it in LTspice, build it on a breadboard and measure it.
    shows:
    - 'The spec first: gain, bandwidth, noise and supply'
    - Hand calculation, simulation and measurement, side by side
    - The measured frequency response, plotted
    - Why the measurement differs from the simulation
    stretch:
    - A PCB in KiCad, built and measured
    - A Monte Carlo run for component tolerances
    present: A report with the schematic, the three sets of results, photos of the build and scope screenshots.
  resources:
    - resource: lessons-electric-circuits
      locator: Volume III, Operational Amplifiers, then Volume VI, Experiments, as a model for building and measuring
      role: primary
      verified: true
    - resource: mit-6002
      locator: The lectures on amplifiers and op-amps
      role: alternative
      verified: true

- id: project-plc-line
  title: 'Project: automate a small process with a PLC'
  area: electrical
  kind: project
  summary: Ladder logic for a real sequence, with interlocks, an emergency stop and an HMI screen.
  hours: 20
  requires: [plc-scada]
  recommends: [control-systems]
  brief:
    build: Automate a small process in ladder logic, such as a traffic junction, a tank that fills and mixes, or a conveyor that sorts by size, using OpenPLC on a PC or an Arduino, with a simple HMI.
    shows:
    - An I/O list with addresses
    - Ladder logic with interlocks and an emergency stop
    - Timers, counters and a sequence that recovers from a fault
    - An HMI or SCADA screen showing the state
    stretch:
    - PID control of a level or temperature
    - Modbus communication with another device
    present: A video of it running, the exported ladder logic, the I/O list and a short functional description like the ones written for real panels.
  resources:
    - resource: control-com-openplc
      locator: The whole article, then build on its setup
      role: primary
      verified: true
    - resource: openplc-getting-started
      locator: Install the runtime and editor, then follow the first project
      role: alternative
      verified: true

- id: project-comms-link
  title: 'Project: simulate a digital radio link'
  area: electrical
  kind: project
  summary: Bits to radio waves and back in Python, with bit error rates checked against theory.
  hours: 25
  requires: [communication-systems]
  recommends: [signals-and-systems, programming-basics]
  brief:
    build: 'In Python, build a digital link end to end: bits to symbols, a modulated signal, a noisy channel and a receiver that recovers the bits. If you can borrow an RTL-SDR or a PlutoSDR, receive a real signal too.'
    shows:
    - BPSK or QPSK modulation and demodulation, with constellation plots
    - Bit error rate against signal-to-noise ratio, compared with theory
    - Pulse shaping and what it does to bandwidth
    - A link budget for a real case, such as a satellite or a mobile cell
    stretch:
    - Timing and frequency synchronisation
    - Channel coding, and the gain it gives
    present: A notebook with plots and a plain explanation of each stage.
  resources:
    - resource: pysdr
      locator: Digital Modulation, Noise and dB, Link Budgets and Synchronization chapters
      role: primary
      verified: true

- id: project-power-converter
  title: 'Project: design and build a DC-DC converter'
  area: electrical
  kind: project
  summary: A buck or boost converter designed, simulated, built and measured for efficiency and ripple.
  hours: 30
  requires: [power-electronics]
  recommends: [pcb-design, microcontrollers, control-systems]
  brief:
    build: Design a buck or boost converter to a spec, say 12 V in and 5 V at 2 A out. Simulate it, build it, and measure its efficiency and ripple.
    shows:
    - 'Component choices worked out: inductor, capacitor, switch and diode'
    - Simulation of steady state and a load step
    - Efficiency measured across the load range, and output ripple on a scope
    - What gets hot, and how hot
    stretch:
    - Closed-loop control from a microcontroller
    - A PCB laid out with a tight switching loop
    present: A design report with calculations, simulation and measurements side by side, and photos. Stay at low voltage; anything on mains needs supervision.
  resources:
    - resource: mit-6334
      locator: The lecture notes on dc/dc converters and their control
      role: primary
      verified: true
    - resource: kicad-getting-started
      locator: If you lay out a board
      role: alternative
      verified: true

- id: project-electrical-design
  title: 'Project: design a building''s electrical installation'
  area: electrical
  kind: project
  summary: Loads, distribution, cable sizes and protection for a real floor plan, as a drawing set and a design report.
  hours: 25
  requires: [power-systems, circuit-analysis]
  recommends: [spreadsheets]
  brief:
    build: 'Take the floor plan of a real small building, such as a house, a clinic or a workshop, and design its low-voltage installation: loads, distribution, cables and protection.'
    shows:
    - A load schedule and the maximum demand
    - A single-line diagram from the supply to each distribution board
    - Cable sizes with voltage-drop and short-circuit checks
    - 'Protection and earthing: breaker and RCD ratings'
    stretch:
    - A rooftop solar system sized for the building
    - Lighting design for one room in a free tool
    present: A drawing set (layout and single-line diagram) and a design report with the calculations, as you would submit for approval. Say which code you followed; in India that's the National Electrical Code and IS 732.
  resources:
    - resource: schneider-eig
      locator: The Sizing and protection of conductors chapter, and the chapters on LV distribution and protection around it
      role: primary
      verified: true

- id: project-circuit-sim
  title: 'Project: simulate classic circuits'
  area: electrical
  kind: project
  summary: RC filters, a rectifier and a transistor switch simulated and checked against hand calculation.
  hours: 8
  requires: [circuit-analysis]
  recommends: [analog-electronics]
  brief:
    build: 'In LTspice or another free simulator, build and simulate four classic circuits: an RC low-pass filter, a full-wave rectifier, a transistor switch and a voltage divider with a load. Compare each with your hand calculation.'
    shows:
      - Hand calculations first
      - Simulation results with plots
      - Where they differ, and why
      - Clean schematics
    stretch:
      - Build one on a breadboard and measure it
      - A Bode plot of the filter
    present: A short report with schematics, calculations and plots.
  resources:
    - resource: lessons-electric-circuits
      locator: Volumes I and II, the chapters for each circuit
      role: primary
      verified: true

- id: project-mixed-signal
  title: 'Project: a sensor front end with an ADC'
  area: electrical
  kind: project
  summary: A complete signal chain from sensor to digital data on your own PCB, with noise analysed and measured.
  hours: 60
  requires: [analog-electronics, pcb-design]
  recommends: [signals-and-systems, microcontrollers]
  brief:
    build: 'Design the front end for a real sensor, such as a load cell or ECG electrodes (powered by battery only, for safety): amplification, filtering, an ADC and a microcontroller, on a PCB you lay out. Analyse and measure the noise.'
    shows:
      - A noise budget for the chain
      - Filter design matched to the signal and sampling rate
      - A PCB with proper grounding and layout
      - Measured noise and accuracy against your budget
    stretch:
      - Calibration against a known reference
      - Digital filtering on the microcontroller
    present: A design report with calculations, simulation, layout and measurements.
  resources:
    - resource: lessons-electric-circuits
      locator: Volume III on op-amps, and the chapters on filters
      role: primary
      verified: true
    - resource: kicad-getting-started
      locator: For the board
      role: alternative
      verified: true

- id: project-line-follower
  title: 'Project: a line-following robot'
  area: electrical
  kind: project
  summary: A small robot that follows a line using sensors and a tuned controller.
  hours: 12
  requires: [microcontrollers]
  recommends: [control-systems]
  brief:
    build: Build a line-following robot with an Arduino, IR sensors, a motor driver and two motors, then tune it from bang-bang control to PID.
    shows:
      - Sensors calibrated for your track
      - Bang-bang control first, then PID
      - Speed and smoothness compared
      - A wiring diagram and the code
    stretch:
      - Handle junctions and sharp turns
      - Log sensor data and plot it
    present: A video of the run and the repo.
  resources:
    - resource: arduino-docs
      locator: The motor and sensor examples
      role: primary
      verified: true
    - resource: feedback-systems-book
      locator: The chapter on PID control
      role: alternative
      verified: true

- id: project-autonomous-nav
  title: 'Project: autonomous navigation with ROS 2'
  area: electrical
  kind: project
  summary: A robot that maps an unknown space, localises itself and navigates to goals, in simulation and on hardware.
  hours: 70
  requires: [ros, robotics]
  recommends: [computer-vision, control-systems]
  brief:
    build: With ROS 2, build a robot (in Gazebo, then on a real base if you can) that maps a room with SLAM, localises itself, and navigates to goals around obstacles using Nav2.
    shows:
      - SLAM producing a usable map
      - Localisation and navigation to goals with Nav2
      - Obstacle avoidance, including moving obstacles
      - Measured success rate over many runs
    stretch:
      - Add a camera and detect objects
      - Run it on a real robot base
    present: A video, the launch files and a write-up of tuning and failure cases.
  resources:
    - resource: ros2-tutorials
      locator: The beginner and intermediate tutorials, then the Nav2 docs they link to
      role: alternative
      verified: true
    - resource: modern-robotics
      locator: The chapters on motion planning
      role: primary
      verified: true

- id: project-ladder-basics
  title: 'Project: five classic ladder-logic exercises'
  area: electrical
  kind: project
  summary: Start-stop, interlocks, timers, counters and a sequence, each written and tested in OpenPLC.
  hours: 8
  requires: [plc-scada]
  brief:
    build: 'In OpenPLC, write five classic programs: a motor start-stop circuit, forward-reverse with an interlock, a timer-based light, a counter for a packing line, and a simple sequence.'
    shows:
      - Each program tested in simulation
      - Interlocks that make unsafe states impossible
      - An I/O list for each
      - Comments on every rung
    stretch:
      - Run one on an Arduino with real switches
      - Rewrite one in structured text
    present: The exported programs and screenshots.
  resources:
    - resource: openplc-getting-started
      locator: Install the editor and runtime, then the first project
      role: alternative
      verified: true
    - resource: control-com-openplc
      locator: The whole article
      role: primary
      verified: true

- id: project-scada-system
  title: 'Project: a SCADA system for a small plant'
  area: electrical
  kind: project
  summary: A small plant simulated with PLCs, Modbus, an HMI, alarms and a historian.
  hours: 60
  requires: [plc-scada]
  recommends: [networking, control-systems]
  brief:
    build: Simulate a small plant, such as a water treatment stage with pumps, tanks and valves. Control it with OpenPLC, connect over Modbus TCP to an open-source SCADA or HMI, and add alarms, trends and a historian.
    shows:
      - Control logic with interlocks and an emergency stop
      - Modbus communication you can show in Wireshark
      - HMI screens, alarms with priorities and trends
      - A historian storing data
      - 'Basic security: network separation and passwords changed'
    stretch:
      - Redundant PLCs or a failover
      - PID loops tuned on the simulated process
    present: A demo video, the system architecture diagram and a functional design specification.
  resources:
    - resource: openplc-getting-started
      locator: The runtime, the editor and Modbus setup
      role: primary
      verified: true
    - resource: wireshark-guide
      locator: For looking at the Modbus traffic
      role: alternative
      verified: true

- id: project-signal-analysis
  title: 'Project: analyse real signals with the FFT'
  area: electrical
  kind: project
  summary: 'Audio and sensor recordings analysed in Python: spectra, filtering and sampling effects.'
  hours: 8
  requires: [signals-and-systems]
  recommends: [programming-basics]
  brief:
    build: 'Record a few real signals, such as your voice, a musical note and a phone''s accelerometer, and analyse them in Python: spectra with the FFT, a filter that removes noise, and what happens when you sample too slowly.'
    shows:
      - Spectra with correct frequency axes
      - A filter designed and its effect shown
      - Aliasing demonstrated
      - Clear plots with labels
    stretch:
      - A spectrogram of speech
      - Real-time analysis from the microphone
    present: A notebook with plots and short explanations.
  resources:
    - resource: pysdr
      locator: The Frequency Domain and Filters chapters
      role: primary
      verified: true
    - resource: mit-6003
      locator: The lectures on Fourier transforms and sampling
      role: alternative
      verified: true

- id: project-sdr-receiver
  title: 'Project: receive and decode real radio signals'
  area: electrical
  kind: project
  summary: An RTL-SDR used to receive FM radio and decode aircraft ADS-B or weather-satellite signals, with your own processing code.
  hours: 50
  requires: [communication-systems]
  recommends: [signals-and-systems, programming-basics]
  brief:
    build: 'With an inexpensive RTL-SDR dongle, receive and decode real signals in Python: demodulate FM broadcast audio, then decode aircraft ADS-B messages or NOAA weather-satellite images.'
    shows:
      - FM demodulation written yourself, with plots of each stage
      - ADS-B messages decoded and aircraft plotted on a map, or a satellite image received
      - Your own code for the key steps, compared with an existing decoder
      - Antenna and gain choices explained
    stretch:
      - Build a simple antenna and measure the improvement
      - Transmit on a licence-free band with a suitable device
    present: A write-up with plots, the decoded output and the code.
  resources:
    - resource: pysdr
      locator: The RTL-SDR, Frequency Domain and Synchronization chapters
      role: primary
      verified: true

- id: project-power-sim
  title: 'Project: simulate rectifiers and a buck converter'
  area: electrical
  kind: project
  summary: A rectifier and a buck converter simulated, with waveforms compared against theory.
  hours: 8
  requires: [power-electronics]
  recommends: [circuit-analysis]
  brief:
    build: In LTspice, simulate a single-phase bridge rectifier with a filter capacitor, and an open-loop buck converter. Compare the waveforms and ripple with what theory predicts.
    shows:
      - Ripple and average voltages against hand calculations
      - Inductor current in continuous and discontinuous mode
      - Losses in the switch and diode estimated
      - Clear waveform plots
    stretch:
      - Add closed-loop control to the buck
      - Compare a diode with a synchronous switch
    present: A short report with plots and calculations.
  resources:
    - resource: mit-6334
