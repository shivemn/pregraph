  requires: [power-electronics, control-systems]
  recommends: [electrical-machines, microcontrollers, pcb-design]
  brief:
    build: Build a low-voltage (under 48 V) H-bridge inverter or DC motor drive, controlled by a microcontroller with PWM, with current sensing, closed-loop speed or voltage control, and protection.
