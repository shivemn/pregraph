- id: automata
  title: Automata and formal languages
  area: theory
  summary: Finite automata, regular expressions and context-free grammars. The maths behind every parser.
  hours: 20
  requires: [discrete-math]
  covers:
    - topic: Finite automata
      detail: DFAs and NFAs, and converting between them.
    - topic: Regular expressions
      detail: Their equivalence with finite automata.
    - topic: Non-regular languages
      detail: The pumping lemma.
    - topic: Context-free grammars
      detail: Derivations, parse trees and ambiguity.
    - topic: Pushdown automata
      detail: Machines with a stack, and their link to grammars.
  resources:
    - resource: mit-18404
      locator: "Lectures 1–5"
      verified: true
    - resource: erickson-models
      locator: "Chapters on strings, regular languages and finite automata"
      verified: true
    - resource: nptel-toc
      locator: "The lectures on finite automata and context-free grammars"
      role: alternative
      verified: true

- id: computability
  title: Computability and complexity
  area: theory
  summary: Turing machines, problems no program can solve, and what P versus NP actually asks.
  hours: 30
  requires: [automata, complexity-analysis]
  covers:
    - topic: Turing machines
      detail: A precise model of what computers can do.
    - topic: Decidability
      detail: Problems with algorithms and problems without.
    - topic: The halting problem
      detail: Why some questions about programs can't be answered.
    - topic: Reductions
      detail: Showing one problem is as hard as another.
    - topic: Complexity classes
      detail: P, NP, NP-completeness and what a reduction proves.
  resources:
    - resource: mit-18404
      locator: "Lecture 6 onwards"
      verified: true
    - resource: erickson-models
      locator: "Chapters on Turing machines and undecidability"
      verified: true

- id: interpreters
  title: Building an interpreter
  area: theory
  summary: Scanning, parsing into a tree and evaluating it. How a programming language actually runs.
  hours: 50
  requires: [recursion, hash-tables]
  recommends: [automata, oop-design]
  covers:
    - topic: Scanning
      detail: Turning source text into tokens.
    - topic: Parsing
      detail: Recursive descent and building a syntax tree.
    - topic: Evaluation
      detail: Walking the tree to run the program.
    - topic: Environments and scope
      detail: Variables, closures and functions.
    - topic: Classes
      detail: Objects and inheritance in your own language.
    - topic: Bytecode virtual machines
      detail: Compiling to bytecode and running it faster.
  resources:
    - resource: crafting-interpreters
      locator: "Part II, A Tree-Walk Interpreter"
      verified: true
    - resource: nptel-compilers
      locator: "The lectures on lexical analysis and parsing"
      role: alternative
      verified: true
    - resource: build-your-own-x
      locator: "The “Programming Language” section"
      verified: true

- id: compilers
  title: Compilers and virtual machines
  area: theory
  summary: Compiling to bytecode, a stack-based virtual machine and garbage collection.
  hours: 50
  requires: [interpreters, c-and-memory]
  recommends: [computer-architecture]
  covers:
    - topic: The pipeline
      detail: Lexing, parsing, semantic analysis, code generation.
    - topic: Type checking
      detail: Catching errors before running.
    - topic: Intermediate representations
      detail: Three-address code and SSA.
    - topic: Optimisation
      detail: Constant folding, dead code elimination and loop optimisations.
    - topic: Code generation
      detail: Instruction selection and register allocation.
    - topic: Runtime
      detail: Calling conventions, the stack and garbage collection.
  resources:
    - resource: crafting-interpreters
      locator: "Part III, A Bytecode Virtual Machine"
      verified: true
    - resource: nptel-compilers
      locator: "The full course"
      verified: true
    - resource: nand2tetris-projects
      locator: "Projects 7–11: the VM translator, then the Jack compiler"
      verified: true

- id: cryptography
  title: Cryptography
  area: theory
  summary: Ciphers, hashing, signatures and key exchange, with proofs of what they do and don't guarantee.
  hours: 40
  requires: [probability, discrete-math]
  recommends: [complexity-analysis]
  covers:
    - topic: Symmetric encryption
      detail: Block ciphers like AES and modes like GCM.
    - topic: Hash functions
      detail: SHA-256, collision resistance and password hashing.
    - topic: Message authentication
      detail: MACs and HMAC.
    - topic: Public-key cryptography
      detail: RSA, Diffie–Hellman and elliptic curves.
    - topic: Digital signatures and certificates
      detail: Proving who sent something, and how TLS uses it.
    - topic: Common mistakes
      detail: Rolling your own crypto, reused nonces and weak randomness.
  resources:
    - resource: cryptobook
      locator: "Part I, Secret key cryptography"
      verified: true
    - resource: crypto-boneh
      locator: "The whole course"
      why: "The standard introduction, from the co-author of the book."
      verified: true
    - resource: cryptopals
      locator: "Sets 1–6"
      why: "Break real constructions yourself. Little maths needed to start."
      verified: true
