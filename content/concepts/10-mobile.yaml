- id: kotlin
  title: Kotlin
  area: mobile
  summary: The main language for Android. Concise, null-safe and easy to pick up after Python or Java.
  hours: 20
  requires: [programming-basics]
  covers:
    - topic: Syntax
      detail: val and var, functions, classes and string templates.
    - topic: Null safety
      detail: 'Nullable types, ?. and ?: and why NullPointerExceptions mostly disappear.'
    - topic: Data classes and sealed classes
      detail: Concise models and closed hierarchies.
    - topic: Collections and lambdas
      detail: map, filter and friends.
    - topic: Extension functions
      detail: Adding behaviour to existing types.
    - topic: Coroutines
      detail: Suspend functions, scopes and structured concurrency.
    - topic: Java interop
      detail: Using Java libraries from Kotlin.
  resources:
    - resource: kotlin-docs
      locator: "Getting started, then Basics and Concepts"
      verified: true
    - resource: exercism
      locator: "Kotlin track"
      verified: true

- id: android
  title: Android development
  area: mobile
  summary: Building Android apps with Jetpack Compose. Screens, state, navigation, data and background work.
  hours: 50
  kind: tool
  requires: [kotlin]
  recommends: [oop-design]
  covers:
    - topic: Project structure
      detail: Gradle, the manifest, resources and Android Studio.
    - topic: Jetpack Compose
      detail: Composable functions, state and recomposition.
    - topic: Activity and lifecycle
      detail: What happens when apps pause, stop and get killed.
    - topic: Navigation
      detail: Moving between screens and passing data.
    - topic: Architecture
      detail: ViewModel, repositories and unidirectional data flow.
    - topic: Data
      detail: Room for databases, DataStore for settings, Retrofit for APIs.
    - topic: Background work
      detail: WorkManager and coroutines for work that outlives a screen.
    - topic: Releasing
      detail: Signing, testing on devices and publishing to the Play Store.
  resources:
    - resource: android-courses
      locator: "Android Basics with Compose, all units"
      verified: true

- id: project-android-app
  title: "Project: ship an Android app"
  area: mobile
  summary: An app that solves a small real problem, published on the Play Store or as a signed APK.
  hours: 40
  kind: project
  requires: [android]
  recommends: [rest-apis, git]
  brief:
    build: Pick a small problem you or people around you actually have, like splitting a mess bill, tracking a bus pass or a shop's daily stock, and build an Android app for it in Kotlin with Jetpack Compose. Keep the first version to three or four screens.
    shows:
    - Data that survives a restart, in Room or DataStore
    - A call to a real API, with a loading state and a sensible message when the network is off
    - A layout that works on a small phone and in dark mode
    - A signed release build someone else can install
    stretch:
    - Publish it on the Play Store (there's a one-time developer fee)
    - Unit tests for the logic and one UI test
    present: A README with screenshots, a one-minute screen recording, the APK or Play Store link, and a short list of what you'd do next.
  resources:
    - resource: android-courses
      locator: "Use the later units on data and networking as you build"
      verified: true

- id: project-mobile-starter
  title: 'Project: a small single-purpose app'
  area: mobile
  kind: project
  summary: A one or two screen app that does one thing well, on your own phone.
  hours: 10
  requires: []
  recommends: [android, swift, flutter]
  brief:
    build: 'Build a small app for one job: a unit converter, a tip splitter, a habit tick-list or a flashcard deck. Use Kotlin, Swift or Flutter, and run it on a real phone.'
    shows:
      - One clear job, done well
      - Data that's still there after the app restarts
      - A layout that works on a small and a large phone
      - Runs on a real device, not just the emulator
    stretch:
      - An app icon and a splash screen
      - A second language, such as Hindi
    present: A screen recording and the repo with screenshots in the README.
  resources:
    - resource: android-courses
      locator: The first units of Android Basics with Compose, if you build for Android
      role: primary
      verified: true
    - resource: flutter-learn
      locator: The first Flutter codelab, if you build with Flutter
      role: alternative
      verified: true

- id: project-mobile-advanced
  title: 'Project: an offline-first app that syncs'
  area: mobile
  kind: project
  summary: An app that works without a network, syncs when it's back, and is released to real users.
  hours: 70
  requires: [rest-apis]
  recommends: [android, swift, flutter, testing-debugging]
  brief:
    build: Build an app that keeps working offline, such as a field-survey app, a shared shopping list or a shop's order book, and syncs to a backend when the network returns. Release it through the Play Store or TestFlight.
    shows:
      - A local database as the source of truth, with sync in the background
      - Conflict handling when two devices edit the same thing
      - Tests for the sync logic and the main screens
      - Crash reporting and a release build in users' hands
    stretch:
      - Push notifications
      - A tablet layout
    present: The store link or a test invite, a diagram of the sync design, and how you tested conflicts.
  resources:
    - resource: android-courses
      locator: The units on data persistence and background work
      role: primary
      verified: true
    - resource: ddia
      locator: The chapter on replication, for conflict resolution
      role: deep-dive
      verified: true
