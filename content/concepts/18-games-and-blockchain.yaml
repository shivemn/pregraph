- id: project-game
  title: "Project: a small finished game"
  area: games
  kind: project
  summary: A short game someone can actually play, with a start screen, a goal and an ending. Publish it on itch.io and link the code.
  hours: 30
  requires: [game-engines]
  brief:
    build: 'Make a game in Godot or Unity that someone can finish in five minutes: one mechanic done well, a start screen, a goal and an ending. Scope it to about four weekends.'
    shows:
    - 'A full loop: start, play, win or lose, play again'
    - Code split into scenes or components, not one giant script
    - Sound and feedback when the player does something
    - A build people can play in the browser or download
    stretch:
    - Enter a game jam on itch.io and finish inside its deadline
    - Saved progress or a high-score table
    present: Publish it on itch.io with a GIF and a short description, link the code, and write a short post about one problem you solved.
  resources:
    - resource: cs50-games
      locator: "Use any game from the course as a starting point"
      verified: true
    - resource: game-programming-patterns
      locator: "Game Loop, Update Method and State chapters"
      verified: true

