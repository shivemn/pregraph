- id: html-css
  title: HTML and CSS
  area: web
  summary: Structuring a page so it means something, then laying it out and styling it so it works on any screen.
  hours: 30
  covers:
    - topic: Semantic HTML
      detail: Headings, landmarks, lists, forms and links that mean what they say.
    - topic: Forms
      detail: Inputs, labels, validation and submitting data.
    - topic: The box model
      detail: Margin, border, padding, and box-sizing.
    - topic: Selectors and the cascade
      detail: Specificity, inheritance and why a style didn't apply.
    - topic: Layout
      detail: Flexbox for one dimension, Grid for two.
    - topic: Responsive design
      detail: Media queries, fluid sizes and designing for phones first.
    - topic: Typography and colour
      detail: Readable text sizes, line lengths and contrast.
  resources:
    - resource: mdn-learn
      locator: "Structuring content with HTML, CSS styling basics, CSS layout"
      verified: true
    - resource: odin
      locator: "Foundations course, HTML and CSS sections"
      role: alternative
      verified: true
    - resource: cs50-web
      locator: "Lecture 0, HTML and CSS"
      verified: true
    - resource: fcc-rwd
      locator: "The whole course, including its certification projects"
      verified: true
    - resource: frontend-mentor
      locator: "Newbie challenges"
      role: alternative
      verified: true

- id: javascript
  title: JavaScript
  area: web
  summary: The language of the browser. Functions, objects, the event loop, promises and async code.
  hours: 40
  recommends: [programming-basics, html-css]
  covers:
    - topic: Language basics
      detail: let and const, types, functions, objects and arrays.
    - topic: Scope and closures
      detail: How variables are found, and functions that remember them.
    - topic: this and prototypes
      detail: How objects share behaviour, and what classes compile to.
    - topic: The DOM
      detail: Selecting elements, changing them and handling events.
    - topic: Asynchronous JavaScript
      detail: The event loop, promises, async/await and fetch.
    - topic: Modules
      detail: import and export, and how bundlers use them.
    - topic: Modern syntax
      detail: Destructuring, spread, optional chaining and template literals.
    - topic: Error handling and debugging
      detail: try/catch, the browser devtools and reading stack traces.
  resources:
    - resource: javascript-info
      locator: "Part 1, The JavaScript language"
      verified: true
    - resource: fullstackopen
      locator: "Part 1"
      role: alternative
      verified: true
    - resource: cs50-web
      locator: "Lecture 5, JavaScript"
      verified: true
    - resource: exercism
      locator: "JavaScript track"
      verified: true

- id: typescript
  title: TypeScript
  area: web
  summary: JavaScript with types. Catches a whole class of bugs before the code runs.
  hours: 10
  requires: [javascript]
  covers:
    - topic: Basic types
      detail: Annotations, inference, arrays, tuples and enums.
    - topic: Interfaces and type aliases
      detail: Describing object shapes.
    - topic: Unions and narrowing
      detail: Values that can be several types, and checks that narrow them.
    - topic: Generics
      detail: Reusable typed functions and components.
    - topic: Utility types
      detail: Partial, Pick, Omit, Record and friends.
    - topic: Configuration
      detail: tsconfig, strict mode and typing third-party libraries.
  resources:
    - resource: ts-handbook
      locator: "The Basics through Narrowing, then Object Types"
      verified: true
    - resource: exercism
      locator: "TypeScript track"
      verified: true
    - resource: fcc-typescript
      locator: "The whole video"
      verified: true
    - resource: type-challenges
      locator: "Warm-up and easy, then medium"
      verified: true

- id: react
  title: React
  area: web
  summary: Building interfaces out of components, state and effects. The most asked-for frontend library.
  hours: 30
  kind: tool
  requires: [javascript, html-css]
  covers:
    - topic: Components and JSX
      detail: Building UIs from small pieces.
    - topic: Props and state
      detail: Passing data down and keeping state where it belongs.
    - topic: Rendering lists and conditions
      detail: Keys, conditional rendering and lifting state up.
    - topic: Hooks
      detail: useState, useEffect, useRef, useMemo and when you don't need an effect.
    - topic: Forms
      detail: Controlled inputs and validation.
    - topic: Data fetching
      detail: Loading and error states, and libraries such as TanStack Query.
    - topic: Routing
      detail: Pages and navigation with a router or a framework.
    - topic: Performance
      detail: Avoiding unnecessary re-renders and measuring with the profiler.
  resources:
    - resource: react-docs
      locator: "Describing the UI, Adding interactivity, Managing state"
      verified: true
    - resource: fullstackopen
      locator: "Parts 1–2"
      role: alternative
      verified: true
    - resource: cs50-web
      locator: "Lecture 6, User interfaces"
      verified: true
    - resource: frontend-mentor
      locator: "Junior and intermediate challenges, built in React"
      verified: true

- id: web-accessibility
  title: Accessibility
  area: web
  summary: Making pages work with keyboards, screen readers and zoom. Often a legal requirement, always good practice.
  hours: 8
  requires: [html-css]
  covers:
    - topic: Why it matters
      detail: Users with screen readers, keyboards, low vision or slow connections, and the law.
    - topic: WCAG
      detail: The four principles and the A and AA criteria most sites aim for.
    - topic: Semantic structure
      detail: Headings, landmarks and lists that assistive technology can navigate.
    - topic: Keyboard access
      detail: Focus order, visible focus and no keyboard traps.
    - topic: Forms and errors
      detail: Labels, instructions and error messages linked to fields.
    - topic: ARIA
      detail: When to use it, and why native HTML comes first.
    - topic: Testing
      detail: Automated checkers, plus testing with a keyboard and a screen reader.
  resources:
    - resource: wai-intro
      locator: "Introduction, then the linked WCAG overview"
      verified: true

- id: web-performance
  title: Web performance
  area: web
  summary: Why pages are slow and how to measure it. Loading, rendering and the Core Web Vitals.
  hours: 10
  requires: [javascript, web-http]
  covers:
    - topic: Core Web Vitals
      detail: Largest contentful paint, interaction to next paint and layout shift.
    - topic: Measuring
      detail: Lighthouse, the devtools performance panel and real-user data.
    - topic: Loading
      detail: Caching, compression, code splitting and lazy loading.
    - topic: Images and fonts
      detail: Right sizes, modern formats and font loading.
    - topic: Rendering
      detail: The critical path, reflows and expensive JavaScript.
    - topic: Budgets
      detail: Setting limits for page weight and checking them in CI.
  resources:
    - resource: webdev-perf
      locator: "The whole course"
      verified: true

- id: rest-apis
  title: Designing HTTP APIs
  area: web
  summary: Resources, methods, status codes, versioning and errors. What a good API feels like to the person calling it.
  hours: 8
  requires: [web-http]
  covers:
    - topic: Resources and URLs
      detail: Nouns in paths, collections and items.
    - topic: Methods
      detail: GET, POST, PUT, PATCH and DELETE, and which are safe or idempotent.
    - topic: Status codes
      detail: 2xx, 4xx and 5xx, and choosing the right one.
    - topic: Request and response bodies
      detail: JSON, validation and consistent error formats.
    - topic: Pagination, filtering and sorting
      detail: Query parameters and cursor-based pages.
    - topic: Versioning
      detail: Changing an API without breaking existing clients.
    - topic: Documentation
      detail: OpenAPI specs and examples people can try.
  resources:
    - resource: zalando-api
      locator: "General guidelines, REST basics, JSON guidelines"
      verified: true
    - resource: fullstackopen
      locator: "Part 3"
      role: alternative
      verified: true
    - resource: fcc-backend
      locator: "From Introduction to Express to the Timestamp Microservice project"
      verified: true

- id: backend-framework
  title: A backend framework
  area: web
  summary: Routing, data access, validation and configuration in a real framework, so you're not rebuilding them by hand.
  hours: 35
  kind: tool
  requires: [rest-apis, sql]
  recommends: [java]
  covers:
    - topic: Routing and controllers
      detail: Mapping URLs to code.
    - topic: Data access
      detail: An ORM or query builder, migrations and transactions.
    - topic: Validation
      detail: Checking input at the edge and returning clear errors.
    - topic: Configuration
      detail: Environment-specific settings and secrets kept out of code.
    - topic: Authentication
      detail: Sessions or tokens, and protecting routes.
    - topic: Testing
      detail: Unit and integration tests against a test database.
    - topic: Running it
      detail: Logging, health checks and packaging for deployment.
  resources:
    - resource: spring-guides
      locator: "Building a RESTful Web Service, Accessing Data with JPA, Building REST services with Spring"
      verified: true
    - resource: django-tutorial
      locator: "Parts 1–8"
      role: alternative
      verified: true
    - resource: fullstackopen
      locator: "Parts 3–4, Node.js and Express"
      role: alternative
      verified: true
    - resource: cs50-web
      locator: "Lectures 3–4, Django, SQL, models and migrations"
      verified: true

- id: web-security
  title: Web security
  area: web
  summary: Injection, broken access control, XSS and the other usual ways web apps get broken into.
  hours: 12
  requires: [web-http]
  recommends: [sql]
  covers:
    - topic: The OWASP Top 10
      detail: The most common classes of web vulnerability.
    - topic: Injection
      detail: SQL and command injection, and prepared statements.
    - topic: Cross-site scripting
      detail: Escaping output and Content Security Policy.
    - topic: Cross-site request forgery
      detail: SameSite cookies and CSRF tokens.
    - topic: Authentication and sessions
      detail: Password hashing, secure cookies, session fixation and MFA.
    - topic: Access control
      detail: Checking authorisation on every request, not just hiding buttons.
    - topic: Server-side request forgery
      detail: Why fetching user-supplied URLs is dangerous.
    - topic: Secure defaults
      detail: HTTPS everywhere, security headers and keeping dependencies patched.
  resources:
    - resource: owasp-top10
      locator: "Each of the ten categories"
      verified: true
    - resource: cs50-web
      locator: "Lecture 8, Scalability and security"
      verified: true
    - resource: portswigger-academy
      locator: "The apprentice-level labs for each topic"
      verified: true

- id: project-web-app
  title: "Project: build and ship a web app"
  area: web
  summary: A small but real app with a few screens, data from an API and a public URL you can put on your CV.
  hours: 40
  kind: project
  requires: [react]
  recommends: [rest-apis, git]
  brief:
    build: Build a small app people could use, such as an expense splitter, a club's event sign-up or a tiffin order board, in React with a backend or a hosted database, and deploy it.
    shows:
    - Three or more screens with routing
    - Data from an API or database, with loading and error states
    - Log-in, if the app needs to know who you are
    - Works on a phone and passes a basic accessibility check
    stretch:
    - Tests for the main flow
    - Live updates without a refresh
    present: A public URL, a README with screenshots and the stack, and a note on the hardest bug you fixed.
  resources:
    - resource: odin
      locator: "Full Stack JavaScript path, project lessons"
      verified: true
    - resource: fullstackopen
      locator: "Exercises in parts 1–5"
      role: alternative
      verified: true

- id: project-portfolio-api
  title: "Project: build and deploy a REST API"
  area: web
  summary: An API with a database, tests and authentication, deployed somewhere people can call it.
  hours: 40
  kind: project
  requires: [backend-framework, git]
  recommends: [docker, testing-debugging]
  brief:
    build: Build the backend for something real, such as a library, a clinic's appointments or a hostel complaint tracker, in Spring Boot, Django, FastAPI or Express, with a real database, and deploy it.
    shows:
    - Clean REST endpoints with validation and the right status codes
    - Authentication, and at least two roles that can do different things
    - Tests for the main endpoints
    - API docs, such as an OpenAPI page
    stretch:
    - Pagination, filtering and rate limiting
    - Docker and a pipeline that deploys on push
    present: A live base URL, the API docs, the repo, and a diagram of the data model.
  resources:
    - resource: spring-guides
      locator: "Building REST services with Spring, then Securing a Web Application"
      verified: true

- id: spring-boot
  title: Spring Boot
  area: web
  kind: tool
  summary: The usual way to build Java backends. Web APIs, data access with JPA, security and tests, with little setup.
  hours: 30
  requires: [java, rest-apis]
  recommends: [sql]
  covers:
    - topic: Dependency injection
      detail: Beans, components and how Spring wires them.
    - topic: REST controllers
      detail: Mapping requests, validation and error handling.
    - topic: Spring Data JPA
      detail: Entities, repositories and transactions.
    - topic: Configuration
      detail: application.yml, profiles and externalised config.
    - topic: Security
      detail: Spring Security for authentication and authorisation.
    - topic: Testing
      detail: Unit tests, @SpringBootTest and test slices.
    - topic: Production features
      detail: Actuator health checks and metrics.
  resources:
    - resource: spring-guides
      locator: "Building an Application with Spring Boot, Building a RESTful Web Service, Accessing Data with JPA, Testing the Web Layer, then Building REST services with Spring"
      verified: true
    - resource: telusko-spring
      locator: "The whole video"
      verified: true

- id: nodejs
  title: Node.js and Express
  area: web
  kind: tool
  summary: Running JavaScript on the server, and Express, the small framework most Node APIs start from.
  hours: 20
  requires: [javascript, rest-apis]
  covers:
    - topic: The event loop
      detail: Non-blocking I/O, and what blocks it.
    - topic: Modules and npm
      detail: CommonJS and ES modules, package.json and scripts.
    - topic: Async patterns
      detail: Callbacks, promises and async/await.
    - topic: HTTP servers
      detail: 'Express or Fastify: routes, middleware and error handling.'
    - topic: Working with data
      detail: Connecting to databases and validating input.
    - topic: Streams
      detail: Processing large files and responses piece by piece.
  resources:
    - resource: nodejs-learn
      locator: "From Introduction to Node.js to Don't Block the Event Loop"
      verified: true
    - resource: fcc-node
      locator: "The whole video"
      verified: true
    - resource: fcc-backend
      locator: "The whole course and its five projects"
      verified: true

- id: api-styles
  title: 'API styles: REST, GraphQL, gRPC and real-time'
  area: web
  summary: 'Choosing how services and clients talk: REST in depth, GraphQL, gRPC, WebSockets and webhooks, plus authentication with OAuth 2.0 and JWTs.'
  hours: 10
  requires: [rest-apis]
  recommends: [web-security]
  covers:
    - topic: REST in depth
      detail: Resources, idempotent methods, status codes, pagination, filtering and versioning.
    - topic: Idempotency keys
      detail: Making a retried POST safe, which payments depend on.
    - topic: GraphQL
      detail: Schemas, queries and mutations, letting the client choose fields, and the N+1 problem.
    - topic: gRPC
      detail: Protocol Buffers, generated clients, streaming, and why services use it internally.
    - topic: Real-time
      detail: Polling, long polling, server-sent events and WebSockets, and when each fits.
    - topic: Webhooks
      detail: Calling the customer's server on events, with signatures and retries.
    - topic: Authentication and authorisation
      detail: API keys, sessions, OAuth 2.0 flows and JWTs, and their pitfalls.
    - topic: Documentation and contracts
      detail: OpenAPI specs, and keeping old clients working when the API changes.
  resources:
    - resource: graphql-learn
      locator: Introduction through Mutations, then Pagination and Authorization
      role: primary
      verified: true
    - resource: grpc-intro
      locator: The introduction, then the core concepts page it links to
      role: primary
      verified: true
    - resource: mdn-websockets
      locator: The WebSockets API overview and its guide to writing a client
      role: alternative
      verified: true

- id: project-url-shortener
  title: 'Project: a URL shortener'
  area: web
  kind: project
  summary: 'The classic first backend: short links, redirects, click counts, and the design questions behind them.'
  hours: 12
  requires: [rest-apis, sql]
  recommends: [backend-framework, caching]
  brief:
    build: Build a service that turns a long URL into a short code, redirects visitors, and counts clicks. Use any backend framework and a real database, and deploy it on a free host.
    shows:
      - Short codes that don't collide, and the reason for your scheme (random, hash or counter)
      - Redirects with the right status code (301 or 302) and why
      - Click counts by day
      - Input validation and a limit on how fast one user can create links
    stretch:
      - A cache in front of the database for popular links
      - Custom aliases and expiry dates
    present: A live link, the repo, and a half-page note on how it would change for a billion links.
  resources:
    - resource: sd-primer
      locator: The Pastebin solution in the system design exercises, which covers the same problem
      role: primary
      verified: true
    - resource: fastapi-tutorial
      locator: If you build it in Python
      role: alternative
      verified: true

- id: project-chat-system
  title: 'Project: a real-time chat service that scales'
  area: web
  kind: project
  summary: Group chat over WebSockets that keeps working with several servers, with delivery receipts, history and a load test.
  hours: 60
  requires: [api-styles, sql, redis]
  recommends: [messaging, caching, docker, reliability-patterns]
  brief:
    build: Build a chat backend with rooms, message history and online status, using WebSockets. Then run two or more server instances behind a load balancer and make messages reach people connected to a different instance, using Redis pub/sub or Kafka.
    shows:
      - Messages delivered in order within a room, even across server instances
      - Message history stored and paged
      - Sent, delivered and read receipts
      - Reconnects that don't lose or repeat messages
      - 'A load test with numbers: connections held and messages per second'
    stretch:
      - Push notifications for offline users
      - End-to-end encryption for direct messages
    present: An architecture diagram, the load-test results, and a write-up of what broke first under load and how you fixed it.
  resources:
    - resource: mdn-websockets
      locator: The WebSocket API and writing a client
      role: primary
      verified: true
    - resource: hello-interview-sd
      locator: The WhatsApp breakdown, for the design questions
      role: alternative
      verified: true
    - resource: redis-data-types
      locator: Streams
      role: deep-dive
      verified: true

- id: project-static-site
  title: 'Project: a personal site from scratch'
  area: web
  kind: project
  summary: A responsive, accessible personal site in plain HTML and CSS, live on a free host.
  hours: 10
  requires: [html-css]
  recommends: [javascript, web-accessibility]
  brief:
    build: 'Build your own site with no framework: an about page, your projects and a way to contact you. Make it work on a phone first, then on a big screen, and put it online with GitHub Pages or Cloudflare Pages.'
    shows:
      - A layout that works from a small phone to a wide screen, with Flexbox or Grid
      - 'Semantic HTML: headings, nav, main and alt text'
      - A Lighthouse score of 90 or more for accessibility and performance
      - Live on a real URL
    stretch:
      - A dark mode that follows the system setting
      - A small piece of JavaScript, like a project filter
    present: The live link and the repo. Recruiters do open these, so keep it up to date.
  resources:
    - resource: mdn-learn
      locator: The CSS layout and accessibility modules
      role: primary
      verified: true
    - resource: fcc-rwd
      locator: The projects in the Responsive Web Design course
      role: alternative
      verified: true

- id: project-component-library
  title: 'Project: a UI component library'
  area: web
  kind: project
  summary: Accessible, typed and documented components that another project actually uses.
  hours: 50
  requires: [react, typescript, web-accessibility]
  recommends: [testing-debugging, web-performance]
  brief:
    build: 'Build a small library of components for real use: button, input, select, dialog, tabs, toast and a data table. Write them in TypeScript, make each one keyboard and screen-reader friendly, document them, and use them in one of your apps.'
    shows:
      - Keyboard support and ARIA roles that follow the WAI-ARIA patterns
      - Tests for behaviour, including keyboard use
      - Theming through design tokens, with a dark theme
      - A docs site with live examples, such as Storybook
      - Published to npm with versioning
    stretch:
      - Visual regression tests
      - A bundle-size budget checked in CI
    present: The docs site, the npm package, and a page on one accessibility problem you solved.
  resources:
    - resource: aria-apg
      locator: The pattern for each component you build
      role: primary
      verified: true
    - resource: react-docs
      locator: Reusing logic with custom hooks, and passing data deeply with context
      role: alternative
      verified: true

- id: project-saas
  title: 'Project: a small SaaS product'
  area: web
  kind: project
  summary: A product with sign-up, teams, a payment sandbox, background jobs and real users.
  hours: 80
  requires: [react, backend-framework, sql]
  recommends: [api-styles, docker, ci-cd, web-security]
  brief:
    build: Build a small product people could pay for, such as appointment booking for clinics, invoicing for freelancers or a feedback board. Include accounts and teams, a payment flow in a provider's test mode, emails, and background jobs.
    shows:
      - Authentication with roles, and each team's data kept separate
      - A payment flow in test mode, with webhooks handled safely
      - Background jobs for emails and reports
      - Tests, CI and automatic deploys
      - Ten real people who tried it, and what you changed for them
    stretch:
      - Usage analytics and a simple admin dashboard
      - Rate limits and audit logs
    present: A live product, a short demo video, and a write-up of the architecture and the hardest trade-off.
  resources:
    - resource: fullstackopen
      locator: Part 4, testing Express servers and user administration, then the later parts as you need them
      role: primary
      verified: true
    - resource: owasp-top10
      locator: As the security checklist before you launch
      role: alternative
      verified: true
