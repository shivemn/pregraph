- id: project-support-runbook
  title: "Project: break an app and write the runbook"
  area: infra
  summary: Run a small app, break it in five different ways, and write the runbook someone on call would need to fix each one.
  hours: 15
  kind: project
  requires: [incident-management, log-analysis]
  recommends: [observability, query-performance]
  brief:
    build: Run a small app with a database on a server or in Docker, then break it five ways (full disk, bad config, database down, slow query, expired certificate) and fix each one.
    shows:
    - 'For each failure: what a user would see, how you found the cause, and the fix'
    - The commands and log lines that pointed to the cause
    - Monitoring or an alert that would have caught it sooner
    - A blameless incident note for one of them
    stretch:
    - Automate one fix with a script
    - A dashboard of the app's health
    present: The runbook as a clean document, and a short video of you diagnosing one failure live.
  resources:
    - resource: sre-book
      locator: "Use chapter 12 as the method for each failure"
      verified: true

- id: project-homelab
  title: 'Project: run a small server properly'
  area: infra
  kind: project
  summary: 'One Linux server, run for a month the way a team would run it: secured, backed up and watched.'
  hours: 20
  requires: [linux-admin, networking]
  recommends: [nginx, shell-tools, log-analysis]
  brief:
    build: 'Rent the cheapest cloud VM or use an old laptop, and run it like a real server for a month: a website behind Nginx, a database, backups and monitoring.'
    shows:
    - SSH with keys only, a firewall and automatic security updates
    - Nginx serving a site over HTTPS with a free certificate
    - Nightly backups, and a restore you have actually tested
    - An alert when disk or memory runs low
    stretch:
    - Rebuild the whole server from scratch with an Ansible playbook
    - A second user with limited sudo rights
    present: A write-up of the setup with the config files in a repo (no secrets), and a log of one problem you hit and how you fixed it.
  resources:
    - resource: linux-upskill
      locator: All 20 days, on a server you keep running
      role: primary
      verified: true
    - resource: nginx-guide
      locator: Serving static content, then setting up a simple proxy server
      role: alternative
      verified: true

- id: project-database-ops
  title: 'Project: run a database like it''s production'
  area: data
  kind: project
  summary: Backups you've restored, slow queries you've fixed, and a replica you've failed over to.
  hours: 25
  requires: [sql, query-performance, linux-admin]
  recommends: [database-internals, shell-tools]
  brief:
    build: Install PostgreSQL or MySQL on a Linux VM, load a sample database with a few million rows, and run it as a DBA would.
    shows:
    - Users and roles with least privilege
    - Scheduled backups, and a point-in-time restore you've rehearsed
    - Three slow queries found in the logs and fixed, with timings and query plans before and after
    - A replica, and what happens when the primary fails
    stretch:
    - Monitoring with Prometheus and Grafana
    - A written plan for upgrading to the next major version, then do it
    present: A runbook-style write-up with the commands, the timings and the query plans.
  resources:
    - resource: pg-backup
      locator: 'The whole chapter: SQL dumps, file-system backups, and continuous archiving with point-in-time recovery'
      role: primary
      verified: true
    - resource: use-the-index
      locator: The Where Clause and The Join Operation chapters, as the method for fixing slow queries
      role: alternative
      verified: true

- id: project-architecture-doc
  title: 'Project: design a system and defend it'
  area: infra
  kind: project
  summary: 'The architecture document you''d hand a client: numbers, diagrams, trade-offs and a cost estimate.'
  hours: 20
  requires: [cloud-architecture, system-design]
  recommends: [infrastructure-as-code]
  brief:
    build: Pick a realistic brief, such as food delivery for a tier-2 city or an exam results portal that gets a huge spike on one day, and write the architecture document you'd give the client.
    shows:
    - 'Requirements with numbers: users, requests per second, data size'
    - A diagram of the services, data stores and networks
    - Choices with their alternatives and trade-offs, under each Well-Architected pillar
    - A monthly cost estimate from the provider's pricing calculator
    stretch:
    - Build the riskiest part as a proof of concept
    - A disaster recovery plan with recovery time targets
    present: A 6–10 page document with diagrams, and a 10-minute walk-through as if to the client.
  resources:
    - resource: aws-well-architected
      locator: The six pillars, as the headings for your trade-offs
      role: primary
      verified: true
    - resource: sd-primer
      locator: How to approach a system design interview question
      role: alternative
      verified: true
