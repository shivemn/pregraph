- id: project-cloud-app
  title: "Project: run a three-tier app on the cloud"
  area: infra
  summary: A web front end, an API and a database, deployed with infrastructure as code, with sensible networking and permissions.
  hours: 30
  kind: project
  requires: [cloud-networking, cloud-iam, infrastructure-as-code]
  recommends: [docker]
  brief:
    build: Deploy a three-tier app (web front end, API and database) on AWS, Azure or Google Cloud with all the infrastructure in Terraform. Set a billing alert first and stay inside the free tier.
    shows:
    - Public and private subnets, with the database unreachable from the internet
    - Least-privilege roles, not admin keys
    - Everything created and destroyed by Terraform
    - An estimate of the monthly cost
    stretch:
    - Autoscaling behind a load balancer
    - Logs and alarms in the cloud's monitoring service
    present: An architecture diagram, the Terraform code, and a short write-up of each design choice and its trade-off.
  resources:
    - resource: terraform-tutorials
      locator: "Build the app's infrastructure step by step"
      verified: true

