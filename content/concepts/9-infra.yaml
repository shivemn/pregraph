- id: project-deploy-pipeline
  title: "Project: containerise an app and deploy it with CI"
  area: infra
  summary: Take any small app, put it in a container, and have every push to main test it and deploy it to the cloud.
  hours: 25
  kind: project
  requires: [docker, ci-cd, cloud-basics]
  brief:
    build: Take any small app with tests, write a Dockerfile for it, and set up a pipeline so every push to main builds, tests and deploys it to a cloud service.
    shows:
    - A small, multi-stage Docker image
    - A pipeline that stops when tests fail
    - Secrets kept in the CI's secret store, never in the repo
    - A way to roll back to the last good version
    stretch:
    - A staging environment with a manual approval before production
    - Deploy to Kubernetes with a Helm chart
    present: The repo with a pipeline badge, a diagram of the flow, and a screen recording of a push going live.
  resources:
    - resource: docker-docs
      locator: "Use the guides on sharing and deploying images"
      verified: true
    - resource: gh-actions
      locator: "Deployment section"
      role: alternative
      verified: true

