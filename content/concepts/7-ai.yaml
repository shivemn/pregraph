      locator: "Intro to Deep Learning"
      verified: true

- id: mlops
  title: Putting models into production
  area: ai
  summary: Versioning data and models, testing them, serving them, and noticing when they go stale.
  hours: 30
  requires: [machine-learning, git]
  recommends: [docker, ci-cd]
  covers:
    - topic: The ML lifecycle
      detail: Data, training, evaluation, deployment and monitoring as one loop, not a notebook.
    - topic: Versioning
      detail: Code in Git, data with DVC or similar, models in a registry, so any result can be rebuilt.
    - topic: Experiment tracking
      detail: MLflow or Weights & Biases to compare runs and record what produced a model.
    - topic: Pipelines
      detail: Training steps as repeatable jobs, scheduled or triggered, not run by hand.
    - topic: Testing ML systems
      detail: Tests for data, features and model behaviour, not only for code.
    - topic: Serving
      detail: Batch versus online prediction, REST endpoints, containers and model servers.
    - topic: CI/CD for models
      detail: Retrain, evaluate against a baseline, and deploy only if the new model is better.
    - topic: Monitoring
      detail: Data drift, prediction drift, latency and cost, and when to retrain.
    - topic: LLMOps
      detail: Prompt and model versioning, tracing calls with tools like Langfuse, and tracking token cost.
  resources:
    - resource: madewithml
      locator: "The whole course"
      verified: true
    - resource: mlops-zoomcamp
      locator: "All modules"
      verified: true

- id: project-ml-service
  title: "Project: train, evaluate and serve a model"
  area: ai
  summary: A model trained on real data, evaluated honestly, and served behind an API someone can call.
  hours: 35
  kind: project
  requires: [machine-learning, pandas]
  recommends: [mlops, docker]
  brief:
    build: Train a model on a real dataset, evaluate it properly, and serve it behind an API with FastAPI and Docker so anyone can send it a request.
    shows:
    - A held-out test set and the metric that matters for this problem
    - Experiments tracked, so you can say why you picked this model
    - An API with input validation and a health check
    - A Docker image that runs the same anywhere
    stretch:
    - Log predictions and watch for drift
    - CI that re-tests the model on every push
    present: A repo with a README showing a curl request and its response, the evaluation numbers, and a diagram of how a request flows.
  resources:
    - resource: madewithml
      locator: "Follow the course with your own dataset"
      verified: true

- id: llm-basics
  title: How large language models work
  area: ai
  summary: Tokens, embeddings, attention and the transformer, pretraining and fine-tuning. Enough to reason about what a model can and can't do.
  hours: 15
  requires: [programming-basics]
  recommends: [linear-algebra, probability, transformers]
  covers:
    - topic: What a language model does
      detail: Predict the next token, repeatedly; everything else is built on that.
    - topic: Tokens and tokenisation
      detail: How text becomes token IDs, why counts differ by language, and how tokens drive cost and limits.
    - topic: Embeddings and attention
      detail: Tokens become vectors, and attention lets each one draw on the others.
    - topic: Context windows
      detail: How much the model can see at once, and what happens to information beyond it.
    - topic: Pretraining and post-training
      detail: Learning from huge text, then instruction tuning and preference tuning (RLHF, DPO) to make an assistant.
    - topic: Sampling
      detail: Temperature, top-p and top-k, and why the same prompt can give different answers.
    - topic: Model families
      detail: Open-weight versus closed models, parameter counts, and what size buys you.
    - topic: Limits
      detail: Hallucination, knowledge cut-offs, arithmetic and why models need tools and retrieval.
  resources:
    - resource: illustrated-transformer
      locator: "The whole post"
      why: "The clearest picture of attention there is."
      verified: true
    - resource: karpathy-zero-to-hero
      locator: "Let's build GPT, then Intro to large language models"
      verified: true
    - resource: hf-llm-course
      locator: "Chapters 1–2"
      role: alternative
      verified: true

- id: llm-apis
  title: Prompting and LLM APIs
  area: ai
  summary: Calling a model from code, writing prompts that hold up, structured output and tool calls.
  hours: 10
  requires: [llm-basics, web-http]
  covers:
    - topic: Calling a model
      detail: Send messages to OpenAI, Anthropic or Gemini APIs, with keys kept out of code.
    - topic: Roles and system prompts
      detail: System, user and assistant messages, and what belongs in each.
    - topic: Prompting techniques
      detail: Clear instructions, examples (few-shot), asking for reasoning, and breaking a task into steps.
    - topic: Structured output
      detail: Get JSON that matches a schema, and validate it with Pydantic before using it.
    - topic: Tool calling
      detail: Describe functions, let the model choose one, run it, and return the result.
    - topic: Streaming
      detail: Show tokens as they arrive, and handle partial output.
    - topic: Errors, retries and rate limits
      detail: Timeouts, backoff, 429s and fallbacks to another model.
    - topic: Cost and tokens
      detail: Count tokens, estimate cost per request, and use prompt caching where offered.
    - topic: Context management
      detail: Choose what goes into the prompt, trim history, and keep the important parts near the instructions.
    - topic: Prompt versioning
      detail: Keep prompts in files under version control, and test before changing them.
  resources:
    - resource: anthropic-prompting
      locator: The overview, then each technique page it links to
      role: alternative
      verified: true
    - resource: prompting-guide
      locator: "Introduction, Techniques, then Applications"
      verified: true
    - resource: deeplearning-ai-prompting
      locator: "The whole course"
      verified: true

- id: embeddings
  title: Embeddings and vector search
  area: ai
  summary: Representing text as vectors, measuring similarity, and searching millions of them quickly.
  hours: 10
  requires: [llm-basics]
  recommends: [linear-algebra]
  covers:
    - topic: What an embedding is
      detail: Text mapped to a vector so that similar meaning sits close together.
    - topic: Embedding models
      detail: Choosing one by language, dimension, cost and benchmark (MTEB), including multilingual models for Indian languages.
    - topic: Similarity
      detail: Cosine similarity, dot product and Euclidean distance, and normalising vectors.
    - topic: Semantic search
      detail: Embed documents once, embed the query, and return the nearest ones.
    - topic: Approximate nearest neighbours
      detail: Why exact search is too slow at scale, and how HNSW and IVF indexes trade accuracy for speed.
    - topic: Vector databases
      detail: pgvector, Qdrant, Weaviate, Milvus, Pinecone and Chroma; when Postgres is enough.
    - topic: Dense, sparse and hybrid
      detail: Keyword search (BM25) alongside vectors, and combining their scores.
    - topic: Metadata filtering
      detail: Restricting search by date, source or user, and why it matters for permissions.
  resources:
    - resource: boykis-embeddings
      locator: "The whole book"
      why: "Short, careful and free. Covers the history as well as the how."
      verified: true

- id: rag
  title: Retrieval-augmented generation
  area: ai
  summary: Giving a model the right documents at the right time. Chunking, retrieval, reranking and citing sources.
  hours: 15
  requires: [embeddings, llm-apis]
  covers:
    - topic: Why retrieval
      detail: Giving a model your documents at question time instead of retraining it.
    - topic: Ingestion and parsing
      detail: Getting clean text out of PDFs, HTML and tables, and keeping the source for citations.
    - topic: Chunking
      detail: Fixed, recursive and structure-aware chunks, overlap, and how chunk size changes answers.
    - topic: Retrieval
      detail: Top-k vector search, hybrid search with BM25, and metadata filters.
    - topic: Query transformation
      detail: Rewriting the question, splitting it into several queries, or generating a hypothetical answer to search with.
    - topic: Reranking
      detail: A cross-encoder to re-order the candidates before they reach the model.
    - topic: Grounded generation
      detail: Prompting the model to answer only from the context and cite the passages it used.
    - topic: Advanced patterns
      detail: Parent-child chunks, contextual retrieval, graph RAG and agentic RAG, and when each is worth it.
    - topic: Evaluating RAG
      detail: Retrieval recall, answer faithfulness and relevance, measured on a fixed question set.
  resources:
    - resource: hf-cookbook
      locator: "The RAG recipes"
      verified: true

- id: llm-evaluation
  title: Evaluating LLM systems
  area: ai
  summary: Knowing whether a change made your AI feature better or worse. Test sets, graders and reading lots of outputs.
  hours: 8
  requires: [llm-apis]
  recommends: [statistics]
  covers:
    - topic: Why evals
      detail: You can't tell if a prompt or model change helped without a fixed test set.
    - topic: Error analysis
      detail: Read many real outputs, label the failures, and count them before building anything.
    - topic: Golden datasets
      detail: A set of inputs with expected outputs or criteria, grown from real failures.
    - topic: Code-based checks
      detail: Assertions for format, length, required facts and forbidden content.
    - topic: LLM-as-a-judge
      detail: Using a model to grade outputs, writing clear rubrics, and checking the judge against human labels.
    - topic: RAG and agent metrics
      detail: Faithfulness, context precision and recall for RAG; task success and step-level checks for agents.
    - topic: Regression testing
      detail: Run the eval set in CI so a change that breaks things doesn't ship.
    - topic: Online evaluation
      detail: User feedback, A/B tests and tracing in production.
  resources:
    - resource: hamel-evals
      locator: "The whole post, then the follow-ups it links"
      verified: true

- id: project-llm-app
  title: "Project: build an LLM app with retrieval and evals"
  area: ai
  summary: A small assistant over a real set of documents, with citations and an evaluation set that shows it works.
  hours: 30
  kind: project
  requires: [rag, llm-evaluation]
  recommends: [rest-apis, docker]
  brief:
    build: Build an assistant over documents you know well, such as your college's regulations, a product's docs or a set of RBI circulars, that answers questions and cites its sources.
    shows:
    - Chunking and retrieval choices you can explain
    - Answers that cite the passages they came from
    - An evaluation set of at least 30 questions with expected answers, and your scores
    - What it does when the answer isn't in the documents
    stretch:
    - Compare two retrieval setups on your evaluation set
    - Defences against instructions hidden in the documents
    present: A live demo or video, the repo, and a table of evaluation results before and after your best improvement.
  resources:
    - resource: hf-cookbook
      locator: "Start from a RAG recipe and make it your own"
      verified: true

- id: pytorch
  title: PyTorch
  area: ai
  kind: tool
  summary: The library most deep learning is written in. Tensors, automatic gradients, training loops and ready-made models.
  hours: 30
  requires: [machine-learning]
  recommends: [deep-learning]
  covers:
    - topic: Tensors
      detail: Create, index and reshape tensors, broadcasting, and moving them between CPU and GPU.
    - topic: Autograd
      detail: requires_grad, backward(), and how PyTorch builds the graph as you compute.
    - topic: nn.Module
      detail: Define layers and models, and inspect their parameters.
    - topic: Datasets and DataLoaders
      detail: Batching, shuffling and custom datasets for your own files.
    - topic: The training loop
      detail: Forward pass, loss, backward, optimiser step and zero_grad, written out by hand.
    - topic: Saving and loading
      detail: state_dict checkpoints and resuming training.
    - topic: GPU training
      detail: Mixed precision with autocast, and reading memory with torch.cuda tools.
    - topic: Ecosystem
      detail: torchvision, torchaudio and how Hugging Face models are PyTorch modules underneath.
  resources:
    - resource: learnpytorch
      locator: "Chapters 00–06"
