- id: machine-learning
  title: Machine learning
  area: ai
  summary: Regression, classification, resampling, trees and model selection, with honest attention to what can go wrong.
  hours: 60
  requires: [linear-algebra, probability, programming-basics]
  recommends: [git, sql]
  resources:
    - resource: islp
      locator: "Chapters 2–9"
    - resource: mml-book
      locator: "Part I, if your linear algebra or probability is rusty"
      role: deep-dive
    - resource: nptel-ml
      locator: "The full course"
      why: "A rigorous IIT Madras course that suits a maths background."
    - resource: ng-ml
      locator: "All three courses"
      role: alternative
    - resource: kaggle-learn
      locator: "Intro to Machine Learning, then Intermediate Machine Learning"

- id: neural-networks
  title: Neural networks and backpropagation
  area: ai
  summary: Layers, activations, losses, gradient descent and backpropagation, and why training goes wrong.
  hours: 25
  requires: [machine-learning]
  resources:
    - resource: d2l
      locator: "Chapters 3–6: linear networks, multilayer perceptrons, the builders' guide"
      verified: true
    - resource: tbob-nn
      locator: "The whole series"
      why: "The clearest picture of what backpropagation is actually doing."
      verified: true
    - resource: karpathy-zero-to-hero
      locator: "The first lecture, building micrograd"
      role: alternative
    - resource: udl-notebooks
      locator: "Notebooks for chapters 3–9"
      verified: true

- id: cnns
  title: Convolutional networks
  area: ai
  summary: Convolutions, pooling, residual connections, and the architectures from LeNet to ResNet.
  hours: 20
  requires: [neural-networks]
  resources:
    - resource: d2l
      locator: "Chapters 7–8"
      verified: true
    - resource: cs231n
      locator: "The lectures on CNNs and architectures"
      verified: true
    - resource: udl-notebooks
      locator: "Notebooks for chapters 10–11"
      verified: true

- id: rnns
  title: Recurrent networks and LSTMs
  area: ai
  summary: Modelling sequences with recurrence, why gradients vanish, and how LSTMs and GRUs fix it.
  hours: 15
  requires: [neural-networks]
  resources:
    - resource: d2l
      locator: "Chapters 9–10"
      verified: true
    - resource: cs224n
      locator: "The lectures on language models and RNNs"
      verified: true

- id: transformers
  title: Attention and transformers
  area: ai
  summary: Attention, self-attention, multi-head attention and the transformer, the architecture behind every modern LLM.
  hours: 20
  requires: [neural-networks]
  recommends: [rnns]
  resources:
    - resource: d2l
      locator: "Chapter 11"
      verified: true
    - resource: karpathy-zero-to-hero
      locator: "Let's build GPT, from scratch"
      why: "You write a working transformer yourself, line by line."
    - resource: illustrated-transformer
      locator: "The whole post"
      role: alternative
    - resource: udl-notebooks
      locator: "Notebooks for chapter 12"
      verified: true

- id: computer-vision
  title: Computer vision
  area: ai
  summary: Classification, detection and segmentation, data augmentation and transfer learning for images.
  hours: 25
  requires: [cnns]
  resources:
    - resource: d2l
      locator: "Chapter 14"
      verified: true
    - resource: cs231n
      locator: "The whole course"
      verified: true
    - resource: kaggle-learn
      locator: "Computer Vision"

- id: nlp
  title: Natural language processing
  area: ai
  summary: Word vectors, pretraining, fine-tuning, and the tasks language models are used for.
  hours: 30
  requires: [transformers]
  recommends: [rnns]
  resources:
    - resource: d2l
      locator: "Chapters 15–16"
      verified: true
    - resource: cs224n
      locator: "The whole course"
      verified: true
    - resource: hf-llm-course
      locator: "Chapters 1–4, then the fine-tuning chapters"
      role: alternative

- id: generative-models
  title: Generative models
  area: ai
  summary: VAEs, GANs, normalising flows and diffusion models, and how each one learns a distribution.
  hours: 30
  requires: [neural-networks]
  recommends: [probability, transformers]
  resources:
    - resource: udl-book
      locator: "Chapters 14–18"
      why: "The clearest free treatment of diffusion models, with all four families side by side."
      verified: true
    - resource: cs236
      locator: "The whole course"
      verified: true
    - resource: udl-notebooks
      locator: "Notebooks for chapters 15–18"
      verified: true

- id: reinforcement-learning
  title: Reinforcement learning
  area: ai
  summary: Agents learning from reward. Markov decision processes, dynamic programming, Q-learning and policy gradients.
  hours: 40
  requires: [probability, programming-basics]
  recommends: [neural-networks]
  resources:
    - resource: sutton-barto
      locator: "Part I (chapters 2–8), then chapter 13 on policy gradients"
      why: "The standard textbook, free from the authors."
      verified: true
    - resource: silver-rl
      locator: "The whole course"
      verified: true
    - resource: udl-notebooks
      locator: "Notebooks for chapter 19"
      verified: true

- id: deep-learning
  title: Deep learning in practice
  area: ai
  summary: Training real models end to end. Transfer learning, tuning, debugging a training run and shipping the result.
  hours: 25
  requires: [neural-networks, cnns]
  recommends: [transformers, pytorch]
  resources:
    - resource: fastai-course
      locator: "Part 1, all lessons"
      why: "Top-down: you train useful models in lesson one and learn why later."
      verified: true
    - resource: mit-6s191
      locator: "The whole series"
      verified: true
    - resource: d2l
      locator: "Chapters 12–13 on optimisation and performance"
      role: alternative
      verified: true
    - resource: kaggle-learn
      locator: "Intro to Deep Learning"

- id: mlops
  title: Putting models into production
  area: ai
  summary: Versioning data and models, testing them, serving them, and noticing when they go stale.
  hours: 30
  requires: [machine-learning, git]
  recommends: [docker, ci-cd]
  resources:
    - resource: madewithml
      locator: "The whole course"
    - resource: mlops-zoomcamp
      locator: "All modules"

- id: project-ml-service
  title: "Project: train, evaluate and serve a model"
  area: ai
  summary: A model trained on real data, evaluated honestly, and served behind an API someone can call.
  hours: 35
  kind: project
  requires: [machine-learning, pandas]
  recommends: [mlops, docker]
  resources:
    - resource: madewithml
      locator: "Follow the course with your own dataset"

- id: llm-basics
  title: How large language models work
  area: ai
  summary: Tokens, embeddings, attention and the transformer, pretraining and fine-tuning. Enough to reason about what a model can and can't do.
  hours: 15
  requires: [programming-basics]
  recommends: [linear-algebra, probability, transformers]
  resources:
    - resource: illustrated-transformer
      locator: "The whole post"
      why: "The clearest picture of attention there is."
    - resource: karpathy-zero-to-hero
      locator: "Let's build GPT, then Intro to large language models"
    - resource: hf-llm-course
      locator: "Chapters 1–2"
      role: alternative

- id: llm-apis
  title: Prompting and LLM APIs
  area: ai
  summary: Calling a model from code, writing prompts that hold up, structured output and tool calls.
  hours: 10
  requires: [llm-basics, web-http]
  resources:
    - resource: prompting-guide
      locator: "Introduction, Techniques, then Applications"
    - resource: deeplearning-ai-prompting
      locator: "The whole course"

- id: embeddings
  title: Embeddings and vector search
  area: ai
  summary: Representing text as vectors, measuring similarity, and searching millions of them quickly.
  hours: 10
  requires: [llm-basics]
  recommends: [linear-algebra]
  resources:
    - resource: boykis-embeddings
      locator: "The whole book"
      why: "Short, careful and free. Covers the history as well as the how."

- id: rag
  title: Retrieval-augmented generation
  area: ai
  summary: Giving a model the right documents at the right time. Chunking, retrieval, reranking and citing sources.
  hours: 15
  requires: [embeddings, llm-apis]
  resources:
    - resource: hf-cookbook
      locator: "The RAG recipes"

- id: llm-evaluation
  title: Evaluating LLM systems
  area: ai
  summary: Knowing whether a change made your AI feature better or worse. Test sets, graders and reading lots of outputs.
  hours: 8
  requires: [llm-apis]
  recommends: [statistics]
  resources:
    - resource: hamel-evals
      locator: "The whole post, then the follow-ups it links"

- id: project-llm-app
  title: "Project: build an LLM app with retrieval and evals"
  area: ai
  summary: A small assistant over a real set of documents, with citations and an evaluation set that shows it works.
  hours: 30
  kind: project
  requires: [rag, llm-evaluation]
  recommends: [rest-apis, docker]
  resources:
    - resource: hf-cookbook
      locator: "Start from a RAG recipe and make it your own"

- id: pytorch
  title: PyTorch
  area: ai
  kind: tool
  summary: The library most deep learning is written in. Tensors, automatic gradients, training loops and ready-made models.
  hours: 30
  requires: [machine-learning]
  recommends: [deep-learning]
  resources:
    - resource: learnpytorch
      locator: "Chapters 00–06"
      verified: true
    - resource: bourke-pytorch
      locator: "The whole video, alongside the book"
      why: "The same author and the same notebooks as the book."
      verified: true
    - resource: learnpytorch-exercises
      locator: "The exercises at the end of chapters 00–06"
