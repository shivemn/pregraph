- id: ai-agents
  title: AI agents and tool use
  area: ai
  summary: Models that call tools in a loop to finish a task. When a fixed workflow is better, how to design tools, memory, MCP, and keeping agents reliable.
  hours: 20
  requires: [llm-apis]
  recommends: [python-depth, llm-evaluation]
  covers:
    - topic: What an agent is
      detail: A model in a loop that chooses tools and acts until a task is done, and how that differs from a fixed workflow.
    - topic: Workflows first
      detail: Prompt chaining, routing, parallel calls, orchestrator-workers and evaluator-optimizer, and when they beat a free-running agent.
    - topic: Tool design
      detail: Clear tool names, descriptions and argument schemas; tools the model can't misuse easily.
    - topic: The agent loop
      detail: Plan, call a tool, read the result, decide the next step, and stop conditions.
    - topic: Memory and state
      detail: Short-term conversation state, long-term memory in a store, and keeping context small.
    - topic: Model Context Protocol
      detail: Exposing tools and data to any agent through MCP servers, and using existing ones.
    - topic: Frameworks
      detail: LangGraph, LlamaIndex, smolagents or Pydantic AI; learn one, and know what it hides.
    - topic: Multi-agent systems
      detail: Several specialised agents with a coordinator, and the cost and failure modes that come with them.
    - topic: Human in the loop
      detail: Approval steps before actions that spend money, send messages or change data.
    - topic: Reliability
      detail: Retries, timeouts, checkpoints so long tasks survive crashes, and budgets on steps and tokens.
    - topic: Evaluating agents
      detail: Task success rates, and checking each step of a trajectory, not just the final answer.
  resources:
    - resource: anthropic-effective-agents
      locator: 'The whole post: the workflow patterns, then agents, then Appendix 2 on designing tools'
      role: primary
      verified: true
