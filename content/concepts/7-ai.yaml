- id: machine-learning
  title: Machine learning
  area: ai
  summary: Regression, classification, resampling, trees and model selection, with honest attention to what can go wrong.
  hours: 60
  requires: [linear-algebra, probability, programming-basics]
  recommends: [git, sql]
  covers:
    - topic: The learning problem
      detail: Features, labels and a loss; supervised versus unsupervised; why the goal is doing well on data you haven't seen.
    - topic: Train, validation and test splits
      detail: Hold data back honestly, use cross-validation when data is small, and never tune on the test set.
    - topic: Linear and logistic regression
      detail: Fit them, read the coefficients, and know what the loss and the gradient look like for each.
    - topic: Bias, variance and regularisation
      detail: Spot overfitting and underfitting from learning curves, and control them with L1, L2 and simpler models.
    - topic: Gradient descent
      detail: Batch, mini-batch and stochastic versions, learning rates, and why feature scaling matters.
    - topic: Decision trees and ensembles
      detail: How a tree splits, and why random forests and gradient boosting (XGBoost, LightGBM) win on tabular data.
    - topic: Distance and margin methods
      detail: k-nearest neighbours and support vector machines, and when each is a sensible baseline.
    - topic: Unsupervised learning
      detail: k-means, hierarchical clustering and PCA; choosing k and reading what the clusters mean.
    - topic: Evaluation metrics
      detail: Accuracy, precision, recall, F1, ROC-AUC, log loss, RMSE and MAE, and picking the one the problem actually needs.
    - topic: Imbalanced data and leakage
      detail: Class weights, resampling, threshold choice, and the leaks that make a model look better than it is.
    - topic: Feature work
      detail: Encoding categories, scaling, missing values, and building pipelines so the same steps run in training and in use.
    - topic: Model selection
      detail: Hyperparameter search, comparing models fairly, and explaining a choice with numbers.
  resources:
    - resource: cs229-videos
      locator: The whole course, if you want the maths behind every method
      role: deep-dive
      verified: true
    - resource: islp
      locator: "Chapters 2–9"
      verified: true
    - resource: mml-book
      locator: "Part I, if your linear algebra or probability is rusty"
      role: deep-dive
      verified: true
    - resource: nptel-ml
      locator: "The full course"
      why: "A rigorous IIT Madras course that suits a maths background."
      verified: true
    - resource: ng-ml
      locator: "All three courses"
      role: alternative
      verified: true
    - resource: kaggle-learn
      locator: "Intro to Machine Learning, then Intermediate Machine Learning"
      verified: true
    - resource: kaggle-competitions
      locator: "The Getting Started competitions"
      role: alternative
      verified: true

- id: neural-networks
  title: Neural networks and backpropagation
  area: ai
  summary: Layers, activations, losses, gradient descent and backpropagation, and why training goes wrong.
  hours: 25
  requires: [machine-learning]
  covers:
    - topic: Perceptrons and layers
      detail: How a neuron computes a weighted sum, and how stacking layers with non-linearities builds a function.
    - topic: Activation functions
      detail: ReLU, GELU, sigmoid, tanh and softmax, and why the choice affects training.
    - topic: Loss functions
      detail: Mean squared error for regression, cross-entropy for classification, and what the numbers mean.
    - topic: Backpropagation
      detail: The chain rule applied through a computation graph; compute gradients for a small network by hand.
    - topic: Optimisers
      detail: SGD with momentum, RMSProp and Adam, learning-rate schedules and warm-up.
    - topic: Initialisation and normalisation
      detail: Why weights start small and random (Xavier, He), and what batch norm and layer norm fix.
    - topic: Regularisation
      detail: Weight decay, dropout, early stopping and data augmentation.
    - topic: Debugging training
      detail: Overfit one batch first, watch the loss curve, and recognise vanishing or exploding gradients.
  resources:
    - resource: d2l
      locator: "Chapters 3–6: linear networks, multilayer perceptrons, the builders' guide"
      verified: true
    - resource: tbob-nn
      locator: "The whole series"
      why: "The clearest picture of what backpropagation is actually doing."
      verified: true
    - resource: karpathy-zero-to-hero
      locator: "The first lecture, building micrograd"
      role: alternative
      verified: true
    - resource: udl-notebooks
      locator: "Notebooks for chapters 3–9"
      verified: true

- id: cnns
  title: Convolutional networks
  area: ai
  summary: Convolutions, pooling, residual connections, and the architectures from LeNet to ResNet.
  hours: 20
  requires: [neural-networks]
  covers:
    - topic: Convolution
      detail: Kernels, stride, padding and channels; compute an output shape and a parameter count.
    - topic: Pooling and receptive fields
      detail: How deeper layers see more of the image, and what pooling trades away.
    - topic: Classic architectures
      detail: LeNet, AlexNet, VGG and what each one changed.
    - topic: Residual networks
      detail: Skip connections, and why they let networks go hundreds of layers deep.
    - topic: Efficient networks
      detail: Depthwise separable convolutions and MobileNet-style models for phones and edge devices.
    - topic: Transfer learning
      detail: Start from ImageNet weights, freeze, then fine-tune, and know when it helps.
  resources:
    - resource: d2l
      locator: "Chapters 7–8"
      verified: true
    - resource: cs231n
      locator: "The lectures on CNNs and architectures"
      verified: true
    - resource: udl-notebooks
      locator: "Notebooks for chapters 10–11"
      verified: true

- id: rnns
  title: Recurrent networks and LSTMs
  area: ai
  summary: Modelling sequences with recurrence, why gradients vanish, and how LSTMs and GRUs fix it.
  hours: 15
  requires: [neural-networks]
  covers:
    - topic: Sequences and recurrence
      detail: A hidden state carried step to step, and unrolling the network through time.
    - topic: Backpropagation through time
      detail: How gradients flow back along a sequence, and why they vanish or explode.
    - topic: LSTMs and GRUs
      detail: Gates that decide what to keep and forget, and why they train better than plain RNNs.
    - topic: Sequence to sequence
      detail: Encoder-decoder models for translation, and the bottleneck that attention was invented to remove.
    - topic: Where RNNs still fit
      detail: Small streaming and time-series problems, and why transformers replaced them for language.
  resources:
    - resource: d2l
      locator: "Chapters 9–10"
      verified: true
    - resource: cs224n
      locator: "The lectures on language models and RNNs"
      verified: true

- id: transformers
  title: Attention and transformers
  area: ai
  summary: Attention, self-attention, multi-head attention and the transformer, the architecture behind every modern LLM.
  hours: 20
  requires: [neural-networks]
  recommends: [rnns]
  covers:
    - topic: Attention
      detail: Queries, keys and values; compute scaled dot-product attention for a tiny example.
    - topic: Self-attention and multi-head attention
      detail: Every token attending to every other, several heads in parallel, and the quadratic cost in sequence length.
    - topic: Positional information
      detail: Sinusoidal and learned positions, and rotary embeddings (RoPE) used by most current LLMs.
    - topic: The transformer block
      detail: Attention, feed-forward layer, residual connections and layer norm, and pre-norm versus post-norm.
    - topic: Encoder, decoder and both
      detail: BERT-style encoders, GPT-style decoders with causal masks, and T5-style encoder-decoders.
    - topic: Training objectives
      detail: Masked language modelling versus next-token prediction, and what each model is good for.
    - topic: Build one
      detail: Write a small GPT from scratch and train it on a text file until it produces plausible text.
  resources:
    - resource: d2l
      locator: "Chapter 11"
      verified: true
    - resource: karpathy-zero-to-hero
      locator: "Let's build GPT, from scratch"
      why: "You write a working transformer yourself, line by line."
      verified: true
    - resource: illustrated-transformer
      locator: "The whole post"
      role: alternative
      verified: true
    - resource: udl-notebooks
      locator: "Notebooks for chapter 12"
      verified: true

- id: computer-vision
  title: Computer vision
  area: ai
  summary: Classification, detection and segmentation, data augmentation and transfer learning for images.
  hours: 25
  requires: [cnns]
  covers:
    - topic: Image data
      detail: Pixels, channels, resizing and normalisation, and augmentations that don't change the label.
    - topic: Classification
      detail: Fine-tune a pretrained backbone and read a confusion matrix.
    - topic: Object detection
      detail: Bounding boxes, anchors, IoU and non-max suppression; one-stage (YOLO) versus two-stage (Faster R-CNN).
    - topic: Segmentation
      detail: Semantic versus instance segmentation, U-Net and Mask R-CNN.
    - topic: Vision transformers
      detail: Images cut into patches and fed to a transformer, and when ViTs beat CNNs.
    - topic: Evaluation
      detail: Top-1 accuracy, mAP for detection, IoU and Dice for segmentation.
    - topic: Classical tools
      detail: OpenCV for reading, transforming and pre-processing images and video.
  resources:
    - resource: d2l
      locator: "Chapter 14"
      verified: true
    - resource: cs231n
      locator: "The whole course"
      verified: true
    - resource: kaggle-learn
      locator: "Computer Vision"
      verified: true

- id: nlp
  title: Natural language processing
  area: ai
  summary: Word vectors, pretraining, fine-tuning, and the tasks language models are used for.
  hours: 30
  requires: [transformers]
  recommends: [rnns]
  covers:
    - topic: Text preprocessing
      detail: Normalisation, tokenisation, and why subword tokenisers (BPE, WordPiece) took over.
    - topic: Word vectors
      detail: 'word2vec and GloVe: words as vectors whose distances mean something.'
    - topic: Pretrained language models
      detail: BERT for understanding tasks and GPT-style models for generation.
    - topic: Fine-tuning for tasks
      detail: Classification, named-entity recognition, question answering and summarisation with a pretrained model.
    - topic: Evaluation
      detail: Accuracy and F1 for classification; BLEU, ROUGE and their limits for generation.
    - topic: Indian languages
      detail: Script, code-mixing (Hinglish) and tokenisation costs, and models like IndicBERT built for them.
  resources:
    - resource: d2l
      locator: "Chapters 15–16"
      verified: true
    - resource: cs224n
      locator: "The whole course"
      verified: true
    - resource: hf-llm-course
      locator: "Chapters 1–4, then the fine-tuning chapters"
      role: alternative
      verified: true

- id: generative-models
  title: Generative models
  area: ai
  summary: VAEs, GANs, normalising flows and diffusion models, and how each one learns a distribution.
  hours: 30
  requires: [neural-networks]
  recommends: [probability, transformers]
  covers:
    - topic: What generative means
      detail: Learning a distribution you can sample from, not just a label.
    - topic: Autoencoders and VAEs
      detail: An encoder, a latent space and a decoder, and the reparameterisation trick.
    - topic: GANs
      detail: A generator and a discriminator in a game, and why training is unstable (mode collapse).
    - topic: Normalising flows
      detail: Invertible transforms that give exact likelihoods.
    - topic: Diffusion models
      detail: Adding noise step by step and learning to remove it; the model behind Stable Diffusion.
    - topic: Conditioning and guidance
      detail: Steering generation with text or class labels, and classifier-free guidance.
    - topic: Evaluation
      detail: FID and why judging generated samples is hard.
  resources:
    - resource: udl-book
      locator: "Chapters 14–18"
      why: "The clearest free treatment of diffusion models, with all four families side by side."
      verified: true
    - resource: cs236
      locator: "The whole course"
      verified: true
    - resource: udl-notebooks
      locator: "Notebooks for chapters 15–18"
      verified: true

- id: reinforcement-learning
  title: Reinforcement learning
  area: ai
  summary: Agents learning from reward. Markov decision processes, dynamic programming, Q-learning and policy gradients.
  hours: 40
  requires: [probability, programming-basics]
  recommends: [neural-networks]
  covers:
    - topic: Markov decision processes
      detail: States, actions, rewards, transitions and discounting.
    - topic: Value functions and Bellman equations
      detail: What V and Q mean, and solving small problems with value and policy iteration.
    - topic: Monte Carlo and temporal difference
      detail: Learning from experience instead of a model, and the bias–variance trade-off between them.
    - topic: Q-learning and SARSA
      detail: Off-policy versus on-policy control, and exploration with epsilon-greedy.
    - topic: Deep Q-networks
      detail: Q-learning with a neural network, replay buffers and target networks.
    - topic: Policy gradients
      detail: REINFORCE, baselines and actor-critic methods, leading to PPO.
    - topic: RL for language models
      detail: How RLHF and newer reward-based training use these ideas to tune LLMs.
  resources:
    - resource: cs285
      locator: The lectures and homeworks, after Part I of Sutton and Barto
      role: deep-dive
      verified: true
    - resource: sutton-barto
      locator: "Part I (chapters 2–8), then chapter 13 on policy gradients"
      why: "The standard textbook, free from the authors."
      verified: true
    - resource: silver-rl
      locator: "The whole course"
      verified: true
    - resource: udl-notebooks
      locator: "Notebooks for chapter 19"
      verified: true

- id: deep-learning
  title: Deep learning in practice
  area: ai
  summary: Training real models end to end. Transfer learning, tuning, debugging a training run and shipping the result.
  hours: 25
  requires: [neural-networks, cnns]
  recommends: [transformers, pytorch]
  covers:
    - topic: A full training loop
      detail: Data loading, model, loss, optimiser, evaluation and checkpoints, written yourself.
    - topic: Transfer learning in practice
      detail: Pick a pretrained model, adapt the head, and fine-tune with discriminative learning rates.
    - topic: Tuning
      detail: Learning-rate finders, batch size, schedules and early stopping.
    - topic: Training on GPUs
      detail: Moving data and models to the GPU, mixed precision, and reading GPU memory use.
    - topic: Diagnosing a bad run
      detail: Loss not falling, overfitting, data bugs and label noise, and how to tell them apart.
    - topic: Experiment tracking
      detail: Logging runs, metrics and configs so results can be repeated.
    - topic: Shipping the model
      detail: Exporting weights, running inference, and checking it behaves the same outside the notebook.
  resources:
    - resource: fastai-course
      locator: "Part 1, all lessons"
      why: "Top-down: you train useful models in lesson one and learn why later."
