    - topic: The shape of an LLM app
      detail: Client, API, orchestration, model calls, retrieval and storage, drawn as one diagram.
    - topic: Model gateway and routing
      detail: One internal API in front of many models, routing by task difficulty, with fallbacks.
    - topic: Caching
      detail: Exact and semantic caches for answers, and provider prompt caching for long shared prompts.
    - topic: Context and retrieval design
      detail: Where documents live, how indexes are updated, and per-user access control.
    - topic: Guardrails in the request path
      detail: Checks before and after the model call, and their latency cost.
    - topic: Async and long jobs
      detail: Queues and workers for slow tasks, and streaming partial results to the user.
    - topic: Multi-tenancy
      detail: Isolating each customer's data, keys, limits and costs.
    - topic: Cost and latency budgets
      detail: Estimating tokens per request and per user, and where to cut.
    - topic: Observability
      detail: Tracing each request through retrieval, prompts and tools, with cost and quality per step.
    - topic: Feedback loops
