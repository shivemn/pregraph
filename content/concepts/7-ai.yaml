- id: inference-serving
  title: Serving LLMs fast and cheaply
  area: ai
  summary: 'What happens when a model generates text, and how serving engines make it fast: the KV cache, batching, quantisation and engines like vLLM.'
  hours: 15
  requires: [transformers]
  recommends: [pytorch, parallel-computing, docker]
  covers:
    - topic: Prefill and decode
      detail: Why reading the prompt is fast and parallel, while generating tokens is slow and one at a time.
    - topic: The KV cache
      detail: Storing past keys and values so each new token doesn't recompute them, and how much memory it takes.
    - topic: Latency metrics
      detail: Time to first token, time per output token, throughput, and how they trade off.
    - topic: Batching
      detail: Static versus continuous batching, and why serving engines can handle many users per GPU.
    - topic: PagedAttention
      detail: Managing the KV cache in pages to waste less memory, the idea behind vLLM.
    - topic: Quantisation
      detail: Running weights in 8 or 4 bits (GPTQ, AWQ, GGUF), and measuring the quality cost.
    - topic: Faster decoding
      detail: Speculative decoding, distillation into smaller models, and FlashAttention.
    - topic: Serving engines
      detail: vLLM, SGLang, TensorRT-LLM and llama.cpp/Ollama, and which fits which job.
    - topic: GPU memory sums
      detail: Estimate memory from parameter count, precision, context length and batch size.
    - topic: Cost
      detail: Cost per million tokens self-hosted versus an API, and when each wins.
  resources:
    - resource: hf-llm-optimisation
      locator: 'The whole page: lower precision, Flash Attention and the key-value cache'
      role: primary
      verified: true
    - resource: vllm-pagedattention
      locator: The whole post, for PagedAttention and continuous batching
      role: alternative
      verified: true
    - resource: weng-inference
      locator: Quantization, pruning and distillation
      role: deep-dive
      verified: true
    - resource: vllm-docs
      locator: 'The quickstart: serve an open model behind an OpenAI-compatible API'
      role: primary
      verified: true

- id: ai-security
  title: Securing AI systems
  area: ai
  summary: Prompt injection, data leaks, over-powered agents and poisoned documents, and the defences that actually help.
  hours: 10
  requires: [llm-apis]
  recommends: [web-security, ai-agents]
  covers:
    - topic: Prompt injection
      detail: Direct and indirect injection, and why instructions hidden in documents or web pages are the hard case.
    - topic: Jailbreaks
      detail: How safety instructions get bypassed, and why prompts alone can't prevent it.
    - topic: Sensitive data
      detail: Keeping secrets and personal data out of prompts, logs and training data, and redacting PII.
    - topic: Excessive agency
      detail: Giving agents only the tools and permissions they need, and confirming risky actions.
    - topic: Insecure output handling
      detail: 'Treating model output as untrusted input: escaping it, validating it, never running it blindly.'
    - topic: Sandboxing
      detail: Running model-written code in isolated containers with no secrets and limited network.
    - topic: Supply chain
      detail: Risks in downloaded models and datasets, unsafe pickle files, and preferring safetensors.
    - topic: Poisoning and RAG weaknesses
      detail: Malicious documents in your index, and access control on what gets retrieved.
    - topic: Guardrails and red-teaming
      detail: Input and output filters, attacking your own system, and tracking what you found.
  resources:
    - resource: owasp-llm-top10
      locator: All ten 2025 risks, with their mitigations
