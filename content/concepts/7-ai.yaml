- id: machine-learning
  title: Machine learning
  area: ai
  summary: Regression, classification, resampling, trees and model selection, with honest attention to what can go wrong.
  hours: 60
  requires: [linear-algebra, probability, programming-basics]
  recommends: [git, sql]
  resources:
    - resource: islp
      locator: "Chapters 2–9"
    - resource: mml-book
      locator: "Part I, if your linear algebra or probability is rusty"
      role: deep-dive

- id: deep-learning
  title: Deep learning
  area: ai
  summary: Neural networks from linear layers up to convolutions, recurrence and transformers.
  hours: 60
  requires: [machine-learning]
  recommends: [linear-structures]
  resources:
    - resource: d2l
      locator: "Chapters 1–11"

- id: mlops
  title: Putting models into production
  area: ai
  summary: Versioning data and models, testing them, serving them, and noticing when they go stale.
  hours: 30
  requires: [machine-learning, git]
  recommends: [docker, ci-cd]
  resources:
    - resource: madewithml
      locator: "The whole course"

- id: project-ml-service
  title: "Project: train, evaluate and serve a model"
  area: ai
  summary: A model trained on real data, evaluated honestly, and served behind an API someone can call.
  hours: 35
  kind: project
  requires: [machine-learning, pandas]
  recommends: [mlops, docker]
  resources:
    - resource: madewithml
      locator: "Follow the course with your own dataset"
