- id: project-ios-app
  title: 'Project: ship an iPhone app'
  area: mobile
  kind: project
  summary: An iPhone app in SwiftUI that solves a small real problem, running on a real phone.
  hours: 40
  requires: [swift]
  recommends: [rest-apis, git]
  brief:
    build: Build an iPhone app in SwiftUI for a small real problem, with a few screens, saved data and one network call. You need a Mac with Xcode; a free Apple account is enough to run it on your own phone.
    shows:
    - Several screens with navigation
    - Data saved with SwiftData or to a file, surviving a restart
    - A network call with async/await, and loading and error states
    - Support for larger text sizes and dark mode
    stretch:
    - A TestFlight beta (this needs the paid developer programme)
    - Unit tests for the logic
    present: A README with screenshots, a screen recording, and the code on GitHub.
  resources:
    - resource: apple-develop-in-swift
      locator: Work through the chapters up to lists and data, then start your own app
      role: primary
      verified: true

- id: project-platform-app
  title: 'Project: automate a process on Salesforce or ServiceNow'
  area: workplace
  kind: project
  summary: 'A small business app on a free developer org: data model, automation, access rules and a report.'
  hours: 20
  requires: []
  recommends: [salesforce, servicenow]
  brief:
    build: In a free Salesforce Developer Edition org or a ServiceNow Personal Developer Instance, build a small app for a real process, such as leave requests, a college's placement drives or IT asset tracking.
    shows:
    - 'A data model: custom objects or tables with relationships'
    - 'Automation: a Flow, or a business rule with a workflow'
    - Two roles that see and can do different things
    - A report or dashboard someone would check every week
    stretch:
    - 'Some code: an Apex trigger with tests, or a ServiceNow script include'
    - An integration that calls an outside REST API
    present: A short demo video, screenshots of the data model and automation, and the exported metadata or update set in a repo.
  resources:
    - resource: trailhead-admin
      locator: The Data Modeling and Reports & Dashboards modules, done in your own free Developer Edition org
      role: primary
      verified: true
    - resource: servicenow-dev
      locator: Request a free Personal Developer Instance, then build in it
      role: alternative
      verified: true
