# Tools people come to learn on their own, from many areas. Each one sits on a
# shelf in tool-groups.yaml. Every pick here was opened and checked before it
# went in.

# Languages

- id: csharp
  title: C#
  area: programming
  kind: tool
  summary: Microsoft's typed, object-oriented language, behind .NET backends, Windows apps and Unity games.
  hours: 30
  requires: [programming-basics]
  recommends: [oop-design]
  covers:
    - topic: Syntax and types
      detail: Value and reference types, classes, structs and records.
    - topic: LINQ
      detail: Querying collections and data in a readable way.
    - topic: async and await
      detail: Asynchronous code with tasks.
    - topic: Generics and interfaces
      detail: Reusable, type-safe code.
    - topic: Exceptions and nullability
      detail: Handling errors and nullable reference types.
    - topic: .NET tooling
      detail: The dotnet CLI, NuGet and project files.
  resources:
    - resource: ms-csharp
      locator: "A tour of C#, then the tutorials it links to"
      verified: true
    - resource: fcc-csharp
      locator: "The whole video"
      verified: true
    - resource: exercism
      locator: "C# track"
      verified: true

- id: php
  title: PHP
  area: web
  kind: tool
  summary: The server-side language behind WordPress and Laravel, and still behind a large share of the web.
  hours: 25
  requires: [programming-basics]
  recommends: [html-css, web-http]
  covers:
    - topic: Syntax
      detail: Variables, arrays, functions and including files.
    - topic: Forms and requests
      detail: Handling GET and POST, sessions and cookies.
    - topic: Databases
      detail: PDO with prepared statements to avoid SQL injection.
    - topic: Object-oriented PHP
      detail: Classes, interfaces, namespaces and Composer autoloading.
    - topic: A framework
      detail: Routing, controllers and ORM in Laravel or Symfony.
    - topic: Security basics
      detail: Escaping output, password hashing and CSRF tokens.
  resources:
    - resource: php-manual
      locator: "Language Reference, from Basic syntax to Classes and Objects"
      verified: true
    - resource: fcc-php
      locator: "The whole video"
      verified: true
    - resource: harry-php
      locator: "The whole video"
      role: alternative
      verified: true
    - resource: exercism
      locator: "PHP track"
      verified: true

- id: swift
  title: Swift and iOS
  area: mobile
  kind: tool
  summary: Apple's language for iPhone, iPad and Mac apps, usually with SwiftUI for the interface.
  hours: 40
  requires: [programming-basics]
  recommends: [oop-design]
  covers:
    - topic: Syntax
      detail: let and var, optionals, functions and closures.
    - topic: Types
      detail: Structs versus classes, enums with associated values and protocols.
    - topic: Optionals
      detail: Unwrapping safely with if let, guard and ??.
    - topic: Error handling
      detail: throws, do-catch and Result.
    - topic: Concurrency
      detail: async/await, tasks and actors.
    - topic: SwiftUI basics
      detail: Views, state and bindings.
  resources:
    - resource: swift-book
      locator: "A Swift Tour, then the Language Guide"
      verified: true
    - resource: allen-swift
      locator: "The whole video"
      verified: true
    - resource: exercism
      locator: "Swift track"
      verified: true

- id: r-lang
  title: R
  area: data
  kind: tool
  summary: The statistics language. Data cleaning, models and charts, with the tidyverse doing most of the work.
  hours: 20
  recommends: [statistics]
  covers:
    - topic: Basics
      detail: Vectors, data frames, factors and functions.
    - topic: The tidyverse
      detail: dplyr for transforming data and tidyr for reshaping it.
    - topic: ggplot2
      detail: Building charts layer by layer.
    - topic: Importing data
      detail: CSV, Excel and databases into data frames.
    - topic: Statistics in R
      detail: t-tests, regression with lm and reading model output.
    - topic: Reports
      detail: Quarto or R Markdown documents that mix code and results.
  resources:
    - resource: posit-cheatsheets
      locator: The dplyr, tidyr and ggplot2 sheets
      role: alternative
      verified: true
    - resource: r4ds
      locator: "The Whole game, then Transform, Import and Visualize"
      why: "Free, current, and written by the people who made the tools it teaches."
      verified: true
    - resource: fcc-r
      locator: "The whole video"
      verified: true

