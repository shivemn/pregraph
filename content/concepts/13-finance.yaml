# Economics and finance: the concepts behind finance, economics, statistics
# and quant roles. Picks were opened and checked before they went in.

- id: microeconomics
  title: Microeconomics
  area: finance
  summary: How people and firms choose, how markets set prices, and where markets fail.
  hours: 30
  resources:
    - resource: core-econ
      locator: "The Economy 2.0: Microeconomics"
      why: "Free, current and built around real data rather than only diagrams."
      verified: true
    - resource: mit-1401
      locator: "The whole course"
      verified: true

- id: macroeconomics
  title: Macroeconomics
  area: finance
  summary: Growth, unemployment, inflation, interest rates, and what central banks and governments can do about them.
  hours: 30
  recommends: [microeconomics]
  resources:
    - resource: core-econ
      locator: "The Economy 2.0: Macroeconomics"
      verified: true
    - resource: mit-1402
      locator: "The whole course"
      verified: true

- id: econometrics
  title: Econometrics
  area: finance
  summary: Regression with real economic data. Causality, instruments, panels, and the ways regressions mislead.
  hours: 30
  requires: [statistics]
  recommends: [r-lang, linear-algebra]
  resources:
    - resource: econometrics-r
      locator: "Chapters 4–12"
      verified: true
    - resource: lambert-econometrics
      locator: "The whole playlist"
      verified: true

- id: financial-markets
  title: Financial markets
  area: finance
  summary: Stocks, bonds, exchanges, brokers and how prices move, with Indian markets as the running example.
  hours: 20
  resources:
    - resource: varsity
      locator: "Introduction to Stock Markets"
      why: "Written for Indian markets, and also available in Hindi."
      verified: true
    - resource: shiller-markets
      locator: "The whole course"
      verified: true

- id: accounting
  title: Accounting and financial statements
  area: finance
  summary: Double entry, the balance sheet, income statement and cash flow statement, and how to read a company's annual report.
  hours: 25
  resources:
    - resource: openstax-accounting
      locator: "Chapters 1–5"
      verified: true
    - resource: varsity
      locator: "Fundamental Analysis"
      role: alternative
      verified: true

- id: corporate-finance
  title: Corporate finance and valuation
  area: finance
  summary: Time value of money, cost of capital, discounted cash flows and what a business is actually worth.
  hours: 30
  requires: [accounting]
  recommends: [financial-markets, spreadsheets]
  resources:
    - resource: openstax-finance
      locator: "The chapters on time value of money, valuation and cost of capital"
      verified: true
    - resource: damodaran-valuation
      locator: "The whole class"
      why: "Aswath Damodaran's NYU course, the best-known valuation teaching there is, free."
      verified: true
    - resource: mit-15401
      locator: "The whole course"
      role: alternative
      verified: true

- id: derivatives
  title: Futures, options and derivatives pricing
  area: finance
  summary: Forwards, futures, options and the Greeks, then pricing them with Black-Scholes and risk-neutral valuation.
  hours: 30
  requires: [financial-markets, probability]
  recommends: [stochastic-calculus]
  resources:
    - resource: varsity
      locator: "Futures Trading, then Options Theory for Professional Trading"
      verified: true
    - resource: mit-18s096
      locator: "Lectures 19–20: Black-Scholes, risk-neutral valuation"
      verified: true

- id: portfolio-theory
  title: Portfolio theory and factor models
  area: finance
  summary: Risk and return, diversification, the efficient frontier, CAPM and factor models.
  hours: 20
  requires: [financial-markets, statistics]
  recommends: [optimization]
  resources:
    - resource: openstax-finance
      locator: "The chapters on risk, return and portfolios"
      verified: true
    - resource: mit-18s096
      locator: "Lectures 14–16: portfolio theory, factor modeling, portfolio management"
      verified: true

- id: risk-management
  title: Risk management
  area: finance
  summary: Measuring and limiting risk. Volatility, Value at Risk, stress tests, and market, credit and operational risk.
  hours: 20
  requires: [statistics, financial-markets]
  recommends: [derivatives, time-series]
  resources:
    - resource: varsity
      locator: "Risk Management and Trading Psychology"
      verified: true
    - resource: mit-18s096
      locator: "Lectures 7 and 9: Value at Risk, volatility modelling"
      verified: true

- id: project-financial-model
  title: "Project: model a listed company"
  area: finance
  kind: project
  summary: Build a three-statement model and a valuation for a real listed company from its annual reports, in a spreadsheet.
  hours: 20
  requires: [accounting, corporate-finance, spreadsheets]
  brief:
    build: Choose a listed Indian company in a business you understand, download five years of annual reports from its website or the exchange, and build a three-statement model and a DCF valuation in a spreadsheet.
    shows:
    - An income statement, balance sheet and cash flow that link and balance
    - Every assumption on one sheet, each with a reason
    - A DCF with a defensible discount rate, and a sensitivity table for growth and WACC
    - 'A one-page note: what the share is worth, and what would change your mind'
    stretch:
    - A comparison with three peers on multiples
    - A switch between base, bull and bear cases
    present: The spreadsheet and a two-page PDF. In the interview, expect to walk through how one change, say lower margins, flows through all three statements.
  resources:
    - resource: varsity
      locator: "Integrated Financial Modelling"
      verified: true

- id: project-backtest
  title: "Project: backtest a trading strategy"
  area: finance
  kind: project
  summary: Take a simple strategy, test it on years of real prices in Python, and report returns, drawdowns and costs without fooling yourself.
  hours: 25
  requires: [time-series, pandas, financial-markets]
  recommends: [risk-management]
  brief:
    build: Take one simple rule, such as a moving-average crossover or buying the strongest Nifty sectors each month, get ten years of daily prices, and test it in Python with pandas, counting brokerage, taxes and slippage.
    shows:
    - Returns, volatility, maximum drawdown and Sharpe ratio, against simply holding the index
    - Costs included, with your assumptions written down
    - A test on years you didn't look at while designing the rule
    - 'No look-ahead: each day''s decision uses only what was known that day'
    stretch:
    - Walk-forward testing over several windows
    - Results with and without costs, side by side
    present: A notebook or repo with the equity curve against the index, a table of results, and an honest paragraph on why it might not work live.
  resources:
    - resource: varsity
      locator: "Trading Systems"
      verified: true
    - resource: quantconnect
      locator: "The Learning Center, then backtest your own strategy"
      verified: true

- id: project-risk-report
  title: 'Project: measure the risk of a portfolio'
  area: finance
  kind: project
  summary: Value at Risk for a real portfolio, worked out three ways and checked against what actually happened.
  hours: 20
  requires: [risk-management, statistics, spreadsheets]
  recommends: [programming-basics, time-series]
  brief:
    build: Put together a portfolio of ten Nifty 50 shares, get five years of daily prices, and estimate its one-day Value at Risk and Expected Shortfall by historical simulation, the variance-covariance method and Monte Carlo.
    shows:
    - The correlation matrix and portfolio variance worked out step by step
    - VaR at 95% and 99% by each method, side by side
    - 'A backtest: how often real losses were worse than your VaR, and whether that''s acceptable'
    - A stress test on a bad stretch, such as March 2020
    stretch:
    - 'Credit risk instead: a simple scorecard on a public loan dataset'
    - Rebuild it in Python and compare
    present: The workbook or notebook and a one-page risk report, the kind a risk manager reads on Monday morning.
  resources:
    - resource: varsity
      locator: 'Risk Management and Trading Psychology: chapters 2 to 5 on variance and portfolio variance, then chapter 10, Value at Risk'
      role: primary
      verified: true

- id: project-empirical-study
  title: 'Project: answer a question with data and a model'
  area: finance
  kind: project
  summary: 'A small study on real Indian data: a clear question, a model, honest checks and a short paper.'
  hours: 30
  requires: [statistics, r-lang]
  recommends: [econometrics, experiments]
  brief:
    build: Ask one question data can answer, such as whether rainfall drives district crop yields or what explains state differences in women's work. Get public data from data.gov.in, the RBI's database or official surveys, fit a model in R and write it up like a short paper.
    shows:
    - The question and why it matters, in a paragraph
    - Sources, cleaning and summary statistics
    - A model chosen for a reason, with its assumptions checked
    - 'Threats to validity: what else could explain the result'
    - A conclusion that claims no more than the data shows
    stretch:
    - A causal design, such as difference-in-differences
    - A fully reproducible report in Quarto
    present: A 6–10 page PDF with tables and charts, and the R code in a repo that re-creates every number.
  resources:
    - resource: econometrics-r
      locator: Chapter 9, Assessing Studies Based on Multiple Regression, as the checklist for your own study
      role: primary
      verified: true
    - resource: r4ds
      locator: The Communicate part, for writing it up in Quarto
      role: alternative
      verified: true

- id: project-ratio-analysis
  title: 'Project: compare two companies'' financial health'
  area: finance
  kind: project
  summary: Two listed companies in the same industry compared on profitability, liquidity, debt and cash flow.
  hours: 10
  requires: [accounting]
  recommends: [spreadsheets, corporate-finance]
  brief:
    build: Pick two listed Indian companies in one industry, such as two paint makers or two banks, take three years of annual reports, and compare them with the standard ratios.
    shows:
      - Profitability, liquidity, leverage and efficiency ratios, worked out in a spreadsheet
      - What changed over three years, and why, from the annual reports
      - Cash flow compared with reported profit
      - 'A one-page conclusion: which is healthier, and the risks'
    stretch:
      - Add a third company or the industry average
      - Check your numbers against a data provider
    present: The workbook and a one-page note.
  resources:
    - resource: openstax-accounting
      locator: The chapter introducing financial statements, then the appendix on financial statement analysis
      role: primary
      verified: true
    - resource: varsity
      locator: Fundamental Analysis, the chapters on financial ratios
      role: alternative
      verified: true

- id: project-equity-report
  title: 'Project: a full equity research report'
  area: finance
  kind: project
  summary: An initiating-coverage style report with an industry view, a model, a valuation and a call, tracked over time.
  hours: 60
  requires: [corporate-finance, accounting]
  recommends: [financial-markets, statistics]
  brief:
    build: 'Write the kind of report a sell-side analyst publishes when starting coverage of a listed company: industry, business, management, a full model, valuation by more than one method, a target price, risks and a recommendation. Then track it for six months.'
    shows:
      - Industry analysis with sources
      - A three-statement model with explicit assumptions
      - Valuation by DCF and relative multiples, reconciled
      - Risks, with what would make you wrong
      - A tracking note after results come out
    stretch:
      - Talk to customers or distributors and use what you learn
      - Compare your call with published analyst views
    present: The report as a PDF, the model, and the tracking notes.
  resources:
    - resource: damodaran-valuation
      locator: The whole course
      role: alternative
      verified: true
    - resource: openstax-finance
      locator: The chapters on valuation and cost of capital
      role: primary
      verified: true

- id: project-credit-scorecard
  title: 'Project: build a credit scorecard'
  area: finance
  kind: project
  summary: A scorecard that predicts loan default, validated and documented the way banks' model-risk teams expect.
  hours: 40
  requires: [risk-management, machine-learning]
  recommends: [statistics, python-depth]
  brief:
    build: 'On a public loan dataset, build a credit scorecard with logistic regression: bin variables, use weight of evidence, check discrimination and stability, and turn it into points.'
    shows:
      - Variable binning and weight of evidence, with information value
      - Gini, KS and a stability check on a later sample
      - The points table and cut-offs
      - 'Model documentation: data, limits and monitoring plan'
    stretch:
      - Compare with a gradient-boosting model and discuss explainability
      - Reject inference
    present: A model document and the notebook.
  resources:
    - resource: islp
      locator: Chapter 4, Classification
      role: primary
      verified: true
    - resource: kaggle-datasets
      locator: Search for a credit or loan default dataset
      role: alternative
      verified: true

- id: project-returns-analysis
  title: 'Project: analyse stock returns and risk'
  area: finance
  kind: project
  summary: 'Ten years of Nifty stocks: returns, volatility, correlation and drawdowns, worked out and charted.'
  hours: 10
  requires: [statistics, pandas]
  recommends: [financial-markets]
  brief:
    build: Download daily prices for a handful of Nifty stocks and the index, compute returns and risk, and chart what you find.
    shows:
      - Daily and annual returns, volatility and maximum drawdown
      - A correlation matrix and what it means for diversification
      - Beta against the Nifty
      - Charts with clear titles
    stretch:
      - An efficient frontier for the stocks
      - Rolling volatility through crises
    present: A notebook with a short summary at the top.
  resources:
    - resource: varsity
      locator: Risk Management and Trading Psychology, chapters 2 to 5
      role: primary
      verified: true
    - resource: py4da
      locator: The chapter on time series
      role: alternative
      verified: true

- id: project-alpha-research
  title: 'Project: a factor research study'
  area: finance
  kind: project
  summary: 'A trading signal tested the way a research desk would: clean data, out-of-sample tests, costs, and honesty about overfitting.'
  hours: 60
  requires: [time-series, statistics, financial-markets]
  recommends: [machine-learning, econometrics]
  brief:
    build: Research one idea, such as momentum, value or low volatility in Indian stocks, on survivorship-free data if you can get it. Test it out of sample, with costs, and report what you found even if the answer is no.
    shows:
      - 'Data issues handled: survivorship, corporate actions, look-ahead'
      - In-sample and out-of-sample periods fixed before you look
      - Returns after costs, turnover and capacity
      - How many ideas you tried, and what that means for the result
    stretch:
      - Combine two factors and test the combination
      - Run it live on paper for three months
    present: A research note like a desk would circulate, and the code.
  resources:
    - resource: quantconnect
      locator: Use its data and backtester for the tests
      role: alternative
      verified: true
    - resource: fpp3
      locator: The chapters on time-series features and evaluation
      role: primary
      verified: true

- id: project-options-pricer
  title: 'Project: an options pricer in C++'
  area: finance
  kind: project
  summary: Black-Scholes, a binomial tree and Monte Carlo pricing in C++, checked against each other.
  hours: 15
  requires: [cpp, derivatives]
  recommends: [probability, testing-debugging]
  brief:
    build: Write an options pricing library in C++ that prices European options three ways, and American options with a tree, with tests.
    shows:
      - Black-Scholes prices and Greeks
      - A binomial tree that converges to Black-Scholes, with a plot
      - Monte Carlo with confidence intervals
      - Unit tests and a small benchmark
    stretch:
      - Implied volatility by root finding
      - Variance reduction for Monte Carlo
    present: The repo with a README of results and convergence plots.
  resources:
    - resource: learncpp
      locator: As a reference for classes and the standard library
      role: alternative
      verified: true
    - resource: mit-18s096
      locator: The lectures on Black-Scholes and option pricing
      role: primary
      verified: true

- id: project-low-latency
  title: 'Project: a low-latency market data system'
  area: finance
  kind: project
  summary: A feed handler and matching engine measured in microseconds, with the profiling that got it there.
  hours: 70
  requires: [cpp, concurrency, networking]
  recommends: [computer-architecture, parallel-computing]
  brief:
    build: Build a market data feed handler that reads a binary feed over UDP multicast (from a simulator you write), rebuilds the order book, and passes updates to a strategy thread. Measure and cut latency at every step.
    shows:
      - A binary protocol parser with no allocations on the hot path
      - A lock-free queue between threads, and why it's correct
      - Latency percentiles measured end to end
      - Profiling results, and three optimisations with before-and-after numbers
    stretch:
      - Kernel-bypass or busy-polling experiments
      - Replay a full day of messages
    present: A write-up of the latency budget and the optimisations, with the code.
  resources:
    - resource: learncpp
      locator: As a reference while you build
      role: alternative
      verified: true
    - resource: cs149
      locator: The lectures on memory and performance
      role: primary
      verified: true

- id: project-causal-study
  title: 'Project: replicate and extend a published study'
  area: finance
  kind: project
  summary: A published empirical paper reproduced from its data, then extended with a new test or new data.
  hours: 60
  requires: [econometrics, r-lang]
  recommends: [statistics, experiments]
  brief:
    build: 'Pick a published economics paper with public replication data, ideally on India, reproduce its main tables, then extend it: newer years, another state, or a robustness check the authors didn''t run.'
    shows:
      - The main results reproduced, with any differences explained
      - The identification strategy explained in plain words
      - One extension with its own results
      - Robustness checks and their effect
    stretch:
      - Contact the authors about anything you couldn't reproduce
      - A short policy note for a non-economist
    present: A paper-style write-up and a reproducible code repository.
  resources:
    - resource: causal-handbook
      locator: The chapters on the method the paper uses
      role: primary
      verified: true
    - resource: econometrics-r
      locator: The chapters on panel data and instrumental variables
      role: alternative
      verified: true
