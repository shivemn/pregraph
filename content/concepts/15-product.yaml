# Product, design and delivery: the non-coding half of building software.

- id: agile-scrum
  title: Agile and Scrum
  area: product
  summary: How most software teams plan and deliver. Sprints, backlogs, stand-ups, reviews and retrospectives, and why they exist.
  hours: 8
  covers:
    - topic: Agile values
      detail: Working software, collaboration and responding to change.
    - topic: Scrum roles
      detail: Product owner, scrum master and developers.
    - topic: Scrum events
      detail: Sprint planning, daily scrum, review and retrospective.
    - topic: Backlogs and stories
      detail: Writing and ordering user stories.
    - topic: Estimation
      detail: Story points and velocity, and their limits.
    - topic: Kanban
      detail: Flow, WIP limits and when it fits better.
  resources:
    - resource: scrum-guide
      locator: "The whole guide"
      why: "The official definition, and only about fifteen pages."
      verified: true
    - resource: scrum-20min
      locator: "The whole video"
      verified: true
    - resource: atlassian-agile
      locator: "Scrum, Kanban and the other Agile Coach guides"
      role: alternative
      verified: true

- id: product-management
  title: Product management
  area: product
  summary: Deciding what to build and why. Talking to users, writing specs, prioritising, shaping work and measuring whether it helped.
  hours: 25
  requires: [agile-scrum]
  recommends: [ux-design, experiments]
  covers:
    - topic: Discovering problems
      detail: Talking to users and finding what matters.
    - topic: Prioritisation
      detail: Frameworks like RICE, and saying no.
    - topic: Writing specs
      detail: PRDs, user stories and acceptance criteria.
    - topic: Metrics
      detail: North-star metrics, funnels and guardrails.
    - topic: Working with teams
      detail: Engineering, design and stakeholders.
    - topic: Launching
      detail: Rollouts, experiments and learning from results.
  resources:
    - resource: shape-up
      locator: "The whole book"
      why: "A free, concrete account of how one product team decides, shapes and ships work."
      verified: true

- id: ux-design
  title: UX and UI design
  area: product
  summary: Designing interfaces people can use. User research, information architecture, wireframes, visual hierarchy and usability testing.
  hours: 30
  recommends: [figma]
  covers:
    - topic: User research
      detail: Interviews, surveys and observation.
    - topic: Personas and journeys
      detail: Making research usable.
    - topic: Information architecture
      detail: Organising content and navigation.
    - topic: Wireframes and prototypes
      detail: From sketches to clickable flows.
    - topic: Usability testing
      detail: Watching people use your design.
    - topic: Visual design basics
      detail: Hierarchy, spacing, type and colour.
    - topic: Accessibility
      detail: Designing for everyone from the start.
  resources:
    - resource: nngroup
      locator: "The articles on usability heuristics, user research and information architecture"
      verified: true
    - resource: letsuncover-ux
      locator: "The whole video"
      verified: true
    - resource: laws-of-ux
      locator: "Every law, with its examples"
      role: alternative
      verified: true
    - resource: daily-ui
      locator: "The 100-day challenge, one small design a day"
      verified: true

- id: technical-writing
  title: Technical writing
  area: product
  summary: Writing documentation people can follow. Clear sentences, structure, audience, and docs for APIs and code.
  hours: 10
  covers:
    - topic: Audience
      detail: Writing for what the reader already knows.
    - topic: Clear sentences
      detail: Short sentences, active voice and plain words.
    - topic: Structure
      detail: Headings, lists and putting the answer first.
    - topic: Document types
      detail: Tutorials, how-to guides, reference and explanations.
    - topic: Docs as code
      detail: Markdown, Git and review.
    - topic: API documentation
      detail: Endpoints, examples and errors.
  resources:
    - resource: github-markdown
      locator: For writing docs in Markdown
      role: alternative
      verified: true
    - resource: google-tech-writing
      locator: "Technical Writing One, then Two"
      verified: true
    - resource: fcc-tech-writing
      locator: "The whole video"
      verified: true

- id: project-product-teardown
  title: 'Project: take a product apart and spec its next feature'
  area: product
  kind: project
  summary: User research on an app people use, the problem it leaves unsolved, and a spec for the fix.
  hours: 20
  requires: [product-management]
  recommends: [ux-design, experiments, sql]
  brief:
    build: Choose an app many people around you use, such as a food delivery, payments or ticketing app. Find out who uses it and where it frustrates them, and write the spec for one feature that would help.
    shows:
    - Five or more conversations with users, and what you learned
    - The problem stated with evidence, before any solution
    - 'A spec: user stories, scope, what''s left out, and rough wireframes'
    - Success metrics, and the experiment you'd run to check
    stretch:
    - A clickable Figma prototype tested with three people
    - A rough estimate of the business impact
    present: A short document or deck like a product review, and a five-minute walk-through.
  resources:
    - resource: shape-up
      locator: Part One, Shaping, ending with Write the Pitch
      role: primary
      verified: true

- id: project-design-case-study
  title: 'Project: a design case study'
  area: product
  kind: project
  summary: One flow redesigned from research to a tested prototype, written up as a portfolio case study.
  hours: 30
  requires: [ux-design, figma]
  recommends: [web-accessibility]
  brief:
    build: Redesign one flow that frustrates people, such as booking a doctor's appointment or paying college fees, from research to a tested prototype in Figma.
    shows:
    - 'Research: who you talked to and what you found'
    - The problem, and the options you explored, not only the final screens
    - A prototype tested with at least five people, and what you changed after
    - Consistent components, colours and type
    stretch:
    - An accessibility check of your design
    - A second, shorter case study on a different kind of product
    present: 'A case study page or PDF that tells the story: problem, process, decisions, result. Recruiters skim, so put the outcome and the final screens near the top.'
  resources:
    - resource: nngroup
      locator: The Qualitative Usability Testing study guide, for testing your prototype
      role: primary
      verified: true
    - resource: laws-of-ux
      locator: To name the principles behind your decisions
      role: alternative
      verified: true

- id: project-requirements
  title: 'Project: document a process and the system it needs'
  area: product
  kind: project
  summary: A real process mapped, its pain points found, and the requirements written for the team that will build the fix.
  hours: 20
  requires: [product-management, technical-writing]
  recommends: [sql, bi-tools, agile-scrum]
  brief:
    build: Pick a real process with paperwork in it, such as hostel allotment or a small shop's purchasing, and document it as a business analyst would for a team about to build software.
    shows:
    - The current process as a flow diagram, with the pain points marked
    - 'A business requirements document: goals, scope and stakeholders'
    - User stories with acceptance criteria
    - The data the system needs, and the reports people want from it
    stretch:
    - A dashboard of the process's numbers from sample data
    - A wireframe of the main screen
    present: The requirements and stories as a clean document with the diagram, and a five-minute walk-through as if to a client.
  resources:
    - resource: atlassian-agile
      locator: The pages on user stories, and on stories, epics and initiatives
      role: primary
      verified: true
    - resource: google-tech-writing
      locator: Technical Writing One, for the writing itself
      role: alternative
      verified: true

- id: project-docs-portfolio
  title: 'Project: write the docs an open-source project is missing'
  area: product
  kind: project
  summary: Real documentation, reviewed by a project's maintainers, and a portfolio that shows it.
  hours: 25
  requires: [technical-writing, git]
  recommends: [rest-apis]
  brief:
    build: 'Find an open-source project with thin docs (look for issues labelled documentation), ask the maintainers what they need, and write it: a getting-started guide, a tutorial or an API reference.'
    shows:
    - A merged pull request, or at least one a maintainer has reviewed
    - A tutorial a newcomer can follow start to finish, tested by you on a clean machine
    - Reference pages with a consistent structure
    - Before and after, so readers see what you changed
    stretch:
    - Apply to Google Season of Docs or a similar programme
    - A docs site built with a static site generator
    present: A portfolio page with three samples, a tutorial, a reference page and an explainer, each linking to where it lives.
  resources:
    - resource: google-tech-writing
      locator: Technical Writing One and Two
      role: primary
      verified: true
    - resource: gh-pages-start
      locator: To publish your portfolio
      role: alternative
      verified: true

- id: project-run-a-sprint
  title: 'Project: run a team through three sprints'
  area: product
  kind: project
  summary: Scrum run for a real team, with the board, the charts and what changed because of the retrospectives.
  hours: 20
  requires: [agile-scrum, jira]
  recommends: []
  brief:
    build: Volunteer to run Scrum for a real team, such as a college project group, a hackathon team or a club building its website. Set up the board in Jira and run three short sprints.
    shows:
    - A backlog of clear stories, ordered with whoever plays product owner
    - Planning, stand-ups, a review and a retrospective in every sprint
    - A burndown chart and velocity across the three sprints
    - Two improvements from retrospectives, and whether they worked
    stretch:
    - Try Kanban for one sprint and compare
    - A short handbook for the next scrum master
    present: A short case study with the board, the charts and what you'd do differently. In interviews, the story of clearing a real blocker matters more than the charts.
  resources:
    - resource: scrum-guide
      locator: 'The whole guide: the rules you will run by'
      role: primary
      verified: true
    - resource: atlassian-agile
      locator: The Scrum pages on sprint planning, stand-ups and retrospectives
      role: alternative
      verified: true

- id: project-prd
  title: 'Project: a one-page product spec'
  area: product
  kind: project
  summary: A short, sharp spec for one feature in an app you use, with the problem, the users and how you'd measure it.
  hours: 8
  requires: [product-management]
  recommends: [ux-design]
  brief:
    build: 'Pick an app you use every day and one problem with it. Write a one-page spec: the problem, who has it, the proposed feature, what''s out of scope, and how you''d know it worked.'
    shows:
      - A problem statement with evidence, even if it's three conversations
      - Users and their goal
      - The feature, with what's deliberately left out
      - One success metric and one guardrail metric
    stretch:
      - Rough wireframes
      - A list of risks and open questions
    present: The spec as a one-page PDF.
  resources:
    - resource: shape-up
      locator: Write the Pitch, in Part One
      role: primary
      verified: true

- id: project-ship-feature
  title: 'Project: take a feature from idea to launch'
  area: product
  kind: project
  summary: A real feature discovered, specified, built with a team and launched, with the results measured.
  hours: 60
  requires: [product-management, experiments]
  recommends: [sql, ux-design, agile-scrum]
  brief:
    build: 'Work with a real product, such as an open-source project, a college app or a small startup, and own one feature from discovery to launch: research, spec, working with whoever builds it, launch and measuring the result.'
    shows:
      - Research notes and the decision they led to
      - A spec the team actually built from
      - Launch plan and what happened
      - Results against the success metric, honestly reported
    stretch:
      - An A/B test of two versions
      - A retrospective with the team
    present: 'A case study: problem, process, decisions, results and what you''d do next.'
  resources:
    - resource: shape-up
      locator: The whole book
      role: primary
      verified: true
    - resource: exponent-questions
      locator: Product sense questions, to practise explaining your decisions
      role: alternative
      verified: true

- id: project-redesign-screen
  title: 'Project: redesign one screen and test it'
  area: product
  kind: project
  summary: One confusing screen redesigned in Figma and tested with three people.
  hours: 10
  requires: [ux-design]
  recommends: [figma]
  brief:
    build: Find a confusing screen in an app or website, such as a railway booking form or a college portal, redesign it, and test both versions with three people.
    shows:
      - The problems with the current screen, with evidence
      - Two or three sketches before the final design
      - A clickable prototype
      - What the three tests showed, and what you changed
    stretch:
      - A mobile and a desktop version
      - An accessibility check of colours and text size
    present: A short case study with before and after screens.
  resources:
    - resource: laws-of-ux
      locator: The laws that explain the problems you found
      role: alternative
      verified: true
    - resource: nngroup
      locator: The Qualitative Usability Testing study guide
      role: primary
      verified: true

- id: project-product-design
  title: 'Project: design a complete app'
  area: product
  kind: project
  summary: A whole product designed from research to a tested high-fidelity prototype, with its own design system.
  hours: 70
  requires: [ux-design, figma]
  recommends: [web-accessibility, product-management]
  brief:
    build: 'Design a full app for a real need, such as a community clinic''s appointments or a farmer''s crop-price app: research, information architecture, flows, a design system and a high-fidelity prototype, tested twice.'
    shows:
      - Research with real users and what you learned
      - Flows and information architecture
      - 'A design system: colours, type, components and states'
      - Two rounds of testing and the changes between them
      - Accessibility checked throughout
    stretch:
      - Handoff specs a developer could build from
      - A coded prototype of one flow
    present: A detailed case study and the Figma file.
  resources:
    - resource: nngroup
      locator: The study guides on research methods and information architecture
      role: primary
      verified: true
    - resource: figma-learn
      locator: The courses and tutorials for the parts you need
      role: alternative
      verified: true

- id: project-process-map
  title: 'Project: map a real business process'
  area: product
  kind: project
  summary: One real process mapped step by step, with who does what, the documents involved and where it goes wrong.
  hours: 8
  requires: [business-processes]
  recommends: [technical-writing]
  brief:
    build: Pick a process you can see, such as how a shop orders stock, how a college issues certificates, or how a small company pays suppliers. Interview the people involved and map it.
    shows:
      - A flow diagram with swimlanes for each role
      - The documents and systems used at each step
      - Pain points and delays, marked
      - Two improvements with their expected effect
    stretch:
      - Draw it in BPMN notation
      - Time each step and add the numbers
    present: The diagram and a one-page summary.
  resources:
    - resource: lean-vsm
      locator: The whole article
      role: primary
      verified: true
    - resource: sap-erp-processes
      locator: The whole journey, for comparison with how SAP models it
      role: alternative
      verified: true

- id: project-uat
  title: 'Project: run requirements through to user testing'
  area: product
  kind: project
  summary: Requirements written, a system built by a team from them, and user acceptance testing run and signed off.
  hours: 50
  requires: [product-management, technical-writing]
  recommends: [agile-scrum, sql, testing-debugging]
  brief:
    build: Work with a small team building a real system, such as a club's membership tool or a small business's order tracker. Write the requirements, stay with the team through the build, then plan and run user acceptance testing with the real users.
    shows:
      - Requirements with acceptance criteria the team built from
      - A traceability table from requirement to test
      - UAT plan, test cases and results
      - Defects found, fixed and retested, and the sign-off
    stretch:
      - A training guide for users
      - A change request handled mid-build
    present: The full document set and a short case study.
  resources:
    - resource: atlassian-agile
      locator: The user stories page
      role: primary
      verified: true
    - resource: istqb-ctfl-syllabus
      locator: Section 2.2 on test levels, including acceptance testing
      role: alternative
      verified: true

- id: project-readme-rewrite
  title: 'Project: rewrite an open-source project''s README'
  area: product
  kind: project
  summary: A confusing README rewritten so a newcomer can install and use the project, submitted as a pull request.
  hours: 6
  requires: [technical-writing]
  recommends: [git]
  brief:
    build: Find an open-source project whose README makes it hard to get started. Follow it on a clean machine, note where you got stuck, rewrite it, and open a pull request.
    shows:
      - Notes from following the old README
      - 'A new README: what it is, install, first use, where to get help'
      - Every command tested
      - A pull request to the project
    stretch:
      - Add a troubleshooting section
      - A short getting-started tutorial
    present: The pull request link and a before-and-after comparison.
  resources:
    - resource: google-tech-writing
      locator: Technical Writing One
      role: primary
      verified: true

- id: project-docs-site
  title: 'Project: own the docs for a project'
  area: product
  kind: project
  summary: 'A complete docs site: tutorials, how-to guides, reference generated from code, and a style guide, all as code.'
  hours: 60
  requires: [technical-writing, git]
  recommends: [rest-apis, web-http]
  brief:
    build: Take charge of documentation for an open-source project or a product of your own. Build a docs-as-code site with tutorials, how-to guides, concept pages and reference generated from code or an OpenAPI spec.
    shows:
      - 'A clear structure: tutorials, how-to guides, reference and explanation'
      - Reference generated from the source, not typed by hand
      - A style guide and a linter that enforces it
      - Docs built and checked for broken links in CI
      - Feedback from real readers and the changes it led to
    stretch:
      - Versioned docs for two releases
      - Analytics on which pages people need
    present: The live site, the repo, and a short write-up of how you planned it.
  resources:
    - resource: google-tech-writing
      locator: Technical Writing Two
      role: primary
      verified: true
    - resource: gh-pages-start
      locator: To publish the site
      role: alternative
      verified: true

- id: project-agile-board
  title: 'Project: set up and run one sprint'
  area: product
  kind: project
  summary: A Jira board set up for a real team project, a backlog written, and one sprint planned and reviewed.
  hours: 8
  requires: [agile-scrum, jira]
  brief:
    build: For a college or side project with at least three people, set up a Scrum board in Jira, write the backlog as user stories, and run one two-week sprint.
    shows:
      - A backlog of user stories with acceptance criteria
      - Sprint planning with a sprint goal
      - The board kept up to date during the sprint
      - A review and a short retrospective
    stretch:
      - Story points and a burndown chart
      - A definition of done the team agreed
    present: Screenshots of the board and a one-page summary.
  resources:
    - resource: scrum-guide
      locator: The whole guide
      role: primary
      verified: true
    - resource: jira-guide
      locator: The guides on Scrum boards and sprints
      role: alternative
      verified: true

- id: project-agile-coaching
  title: 'Project: coach two teams through a quarter'
  area: product
  kind: project
  summary: Two real teams helped over three months, with the problems you found, what you changed and what it did.
  hours: 60
  requires: [agile-scrum]
  recommends: [jira, product-management]
  brief:
    build: Support two teams, such as two student project teams or volunteer teams, for a quarter. Run their events, watch how they work, and help them fix their biggest problems, measuring the effect.
    shows:
      - A starting assessment of each team
      - Changes you introduced and why
      - 'Flow metrics over time: cycle time, throughput, predictability'
      - What worked, what didn't, and the teams' own feedback
    stretch:
      - A shared planning session across both teams
      - A short guide the teams can use without you
    present: A case study with the metrics and the teams' feedback.
  resources:
    - resource: scrum-guide
      locator: The whole guide, especially the accountabilities
      role: primary
      verified: true
    - resource: atlassian-agile
      locator: The Kanban and agile metrics pages
      role: alternative
      verified: true
