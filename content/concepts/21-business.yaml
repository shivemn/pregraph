# Business and consulting: what commerce, BBA and economics graduates need for
# analyst jobs in consulting, marketing, HR, operations and sales.

- id: problem-structuring
  title: Structured problem solving and cases
  area: business
  summary: Breaking a vague business question into parts, estimating sizes, testing hypotheses with numbers, and ending with a clear recommendation. What case interviews test.
  hours: 30
  recommends: [spreadsheets, statistics]
  resources:
    - resource: mckinsey-interviewing
      locator: "Sample cases, worked through on paper first"
      verified: true
    - resource: bain-case-interview
      locator: "Coffee Shop Co. and FashionCo. practice cases"
      verified: true

