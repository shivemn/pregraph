    - topic: The funnel
      detail: Awareness, consideration, conversion and retention.
    - topic: Brand
      detail: What people think and feel about you.
    - topic: Metrics
      detail: CAC, LTV, conversion and retention.
  resources:
    - resource: mit-15810
      locator: "Lecture notes"
      verified: true

