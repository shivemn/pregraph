- id: project-business-case
  title: 'Project: solve a real business problem and present it'
  area: business
  kind: project
  summary: A real problem broken down, checked against facts you collected, and a recommendation with numbers.
  hours: 20
  requires: [problem-structuring, spreadsheets]
  recommends: [accounting, data-visualization]
  brief:
    build: Pick a real problem at a business you can get close to, such as a family shop losing customers, the canteen's lunch queue or a gym's members leaving. Gather facts and numbers, and recommend what to do.
    shows:
    - The problem as one clear question, and an issue tree that breaks it down
    - 'Hypotheses tested with data you collected: interviews, counts, sales records'
    - 'The numbers: what fixing it is worth and what your fix costs'
    - A recommendation with next steps and risks
    stretch:
    - Put one recommendation into practice and measure what changed
    - A version for the owner in the language they work in
    present: A deck of about ten slides where every title is a full-sentence finding, and a two-minute spoken summary.
  resources:
    - resource: mckinsey-interviewing
      locator: The sample cases, for how a problem gets broken down
      role: primary
      verified: true
    - resource: bain-case-interview
      locator: The sample cases
      role: alternative
      verified: true

- id: project-marketing-analysis
  title: 'Project: find where a funnel leaks'
  area: business
  kind: project
  summary: A real shop's analytics, the steps where buyers drop out, and a test to fix one.
  hours: 20
  requires: [web-analytics, spreadsheets]
  recommends: [marketing-fundamentals, statistics]
  brief:
    build: Use Google's free Analytics demo account for the Google Merchandise Store to find where shoppers drop out between arriving and buying, and what to do about it.
    shows:
    - The funnel built step by step, with conversion at each step
    - 'Segments compared: device, channel, new and returning visitors'
    - Three findings, each with a number and a likely reason
    - A test you'd run to check one fix, with the metric and sample size
    stretch:
    - Export the data and redo one analysis in a spreadsheet or SQL
    - A Looker Studio dashboard
    present: 'A short report or deck for a marketing manager: findings first, then the evidence, then the test.'
  resources:
    - resource: ga4-demo
      locator: How to get into the demo account, and what data it holds
      role: primary
      verified: true
    - resource: skillshop-ga4
      locator: The reports and explorations modules
      role: alternative
      verified: true

- id: project-campaign
  title: 'Project: run a small campaign and report on it'
  area: business
  kind: project
  summary: A real month-long campaign with a goal, tracked links and an honest report of what worked.
  hours: 20
  requires: [digital-marketing, web-analytics]
  recommends: [experiments]
  brief:
    build: Promote something real for a month, such as a friend's home bakery, a college fest or an NGO's donation drive. Set a goal, plan the channels and content, run it on a tiny budget or none, and measure it.
    shows:
    - A goal and audience written down before you start
    - Content for at least two channels, such as Instagram and email
    - Tagged links so you know which channel worked
    - Results against the goal, including what didn't work
    stretch:
    - A small paid campaign with two versions of the ad
    - Search optimisation for one page, with its ranking before and after
    present: 'A campaign report: goal, plan, samples of the content, numbers by channel, and what you''d change. Real results, even small ones, beat a polished mock campaign.'
  resources:
    - resource: ga4-url-builder
      locator: 'The whole article: tag the links for each channel before you post'
      role: primary
      verified: true
    - resource: hubspot-inbound
      locator: The lessons on content and social
      role: alternative
      verified: true

- id: project-people-analytics
  title: 'Project: explain why people leave'
  area: business
  kind: project
  summary: An attrition analysis an HR head could act on, with charts and costed recommendations.
  hours: 20
  requires: [hr-fundamentals, spreadsheets]
  recommends: [statistics, data-visualization]
  brief:
    build: Take an HR dataset (IBM's attrition dataset on Kaggle is made up but realistic) and find what goes with people leaving, then recommend what HR should do.
    shows:
    - Attrition by department, role, tenure, pay band and overtime
    - Charts a manager can read in a minute
    - What's linked to leaving, without claiming it's the cause
    - Recommendations with a cost and an expected effect
    stretch:
    - A simple model that flags who might leave, and how accurate it is
    - A Power BI or Tableau dashboard
    present: 'A short report for an HR head and the workbook behind it. Say how you''d protect privacy: real HR data is confidential.'
  resources:
    - resource: islp
      locator: Chapter 4, Classification, if you build a model
      role: primary
      verified: true
    - resource: kaggle-datasets
      locator: Search for IBM HR Analytics Employee Attrition
      role: alternative
      verified: true

- id: project-operations
  title: 'Project: find and fix a bottleneck'
  area: business
  kind: project
  summary: A process you watched and timed, its bottleneck found with numbers, and a fix you can measure.
  hours: 20
  requires: [spreadsheets, data-visualization]
  recommends: [process-improvement]
  brief:
    build: Study a process you can watch, such as a canteen at lunch, a clinic's queue or a shop packing orders. Time each step, find the bottleneck and propose a fix.
    shows:
    - A process or value-stream map with times at each step
    - Data you collected over a few days
    - The bottleneck shown with numbers, not opinion
    - A fix, its expected effect, and how you'd measure it
    stretch:
    - Try the fix and measure before and after
    - A simple queue simulation in a spreadsheet
    present: A one-page summary, the map and the data in a workbook. A real before-and-after is worth more than any template.
  resources:
    - resource: lean-vsm
      locator: The whole article, then map your own process
      role: primary
      verified: true
    - resource: mit-16660
      locator: As background on lean methods
      role: alternative
      verified: false

- id: project-market-sizing
  title: 'Project: size a market'
  area: business
  kind: project
  summary: A real Indian market sized top-down and bottom-up, with the two estimates reconciled.
  hours: 8
  requires: [problem-structuring, spreadsheets]
  brief:
    build: Estimate the size of a real market, such as electric two-wheelers in Pune or coaching classes in Kota, both top-down (from population) and bottom-up (from customers and prices), and reconcile the two.
    shows:
      - Both estimates with every assumption written down
      - Sources for the key numbers
      - Why the two differ, and your final range
      - Which assumption matters most
    stretch:
      - Check one assumption with a quick survey
      - A five-year projection
    present: A one-page summary and the workbook.
  resources:
    - resource: mckinsey-interviewing
      locator: The sample cases with market sizing
      role: primary
      verified: true

- id: project-strategy-engagement
  title: 'Project: a consulting engagement for a real organisation'
  area: business
  kind: project
  summary: 'Four to six weeks with a real small business or NGO: diagnosis, recommendations, and help putting them in place.'
  hours: 60
  requires: [problem-structuring, spreadsheets]
  recommends: [accounting, data-visualization, process-improvement]
  brief:
    build: Take on a real problem for a small business or NGO for four to six weeks, with a clear question agreed with the owner. Diagnose it with data and interviews, recommend what to do, and help put the first change in place.
    shows:
      - An agreed problem statement and workplan
      - Interviews and data analysis
      - Recommendations with costs, benefits and risks
      - The first change put in place, and its early effect
      - The owner's feedback
    stretch:
      - A financial model of the recommendation
      - A follow-up after three months
    present: A final deck and a case study.
  resources:
    - resource: mckinsey-interviewing
      locator: The sample cases, for structuring
      role: primary
      verified: true
    - resource: mit-15810
      locator: For the marketing parts, if the problem is about customers
      role: alternative
      verified: true

- id: project-marketing-metrics
  title: 'Project: a marketing KPI sheet'
  area: business
  kind: project
  summary: CAC, conversion rates, LTV and ROAS worked out from sample campaign data, with a simple dashboard.
  hours: 8
  requires: [spreadsheets]
  recommends: [marketing-fundamentals]
  brief:
    build: 'Using sample or public campaign data, build a sheet that works out the main marketing numbers by channel: spend, clicks, conversion rate, cost per acquisition, customer lifetime value and return on ad spend.'
    shows:
      - Each metric defined in words and in a formula
      - Results by channel and month
      - A small dashboard
      - One recommendation from the numbers
    stretch:
      - A cohort view of retention
      - Pull data from the GA4 demo account
    present: The workbook and a short note.
  resources:
    - resource: ga4-demo
      locator: For real data to practise on
      role: primary
      verified: true

- id: project-attribution
  title: 'Project: a marketing mix or attribution model'
  area: business
  kind: project
  summary: Which channels really drive sales, estimated with a marketing mix model or attribution model on public data.
  hours: 60
  requires: [statistics, web-analytics]
  recommends: [linear-models, experiments]
  brief:
    build: On a public marketing dataset with spend by channel over time, build a marketing mix model with regression, including carry-over and saturation effects. Compare it with simple last-click attribution.
    shows:
      - Adstock and saturation in the model, explained
      - Each channel's contribution and return
      - Validation on held-out weeks
      - Budget recommendations and their uncertainty
    stretch:
      - A Bayesian version
      - Check against an experiment if your data has one
    present: A report for a marketing head and the notebook.
  resources:
    - resource: psu-stat501
      locator: The lessons on multiple regression
      role: primary
      verified: true
    - resource: causal-handbook
      locator: The early chapters, on why correlation misleads
      role: alternative
      verified: true

- id: project-seo-audit
  title: 'Project: an SEO audit of a small site'
  area: business
  kind: project
  summary: A small business's website checked for search problems, with a ranked list of fixes.
  hours: 8
