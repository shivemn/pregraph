- id: project-growth-experiments
  title: 'Project: run growth experiments for a real product'
  area: business
  kind: project
  summary: Five experiments run over two months for a real product, each with a hypothesis, a result and a decision.
  hours: 60
  requires: [digital-marketing, experiments]
  recommends: [web-analytics, statistics]
  brief:
    build: 'Work with a real product, such as a startup, a creator or an app you built, and run at least five growth experiments over two months: landing pages, onboarding, referral, pricing pages or channels.'
    shows:
      - A hypothesis and success metric for each experiment, written first
      - Enough traffic or a clear statement of what you can't conclude
      - Results analysed correctly
      - A decision after each one, and what happened next
    stretch:
      - A referral loop
      - An experiment-prioritisation scoring sheet
    present: An experiment log and a case study.
  resources:
    - resource: ga4-url-builder
      locator: Tag every channel you test
      role: primary
      verified: true
    - resource: openintro
      locator: The chapters on comparing two proportions
      role: alternative
      verified: true

- id: project-hr-dashboard
  title: 'Project: a headcount and attrition dashboard'
  area: business
  kind: project
  summary: Monthly headcount, joiners, leavers and attrition rate in one sheet, from sample employee data.
  hours: 8
  requires: [spreadsheets, hr-fundamentals]
  recommends: [data-visualization]
  brief:
    build: From a sample employee dataset, build a dashboard with monthly headcount, joiners, leavers and attrition rate by department, using formulas and pivot tables.
    shows:
      - Attrition worked out with the standard formula
      - Monthly trend and department split
      - Charts a manager can read quickly
      - No personal details shown
    stretch:
      - Time-to-hire if your data has it
      - The same in Power BI
    present: The workbook and a screenshot.
  resources:
    - resource: gcf-excel
      locator: The lessons on pivot tables and charts
      role: primary
      verified: true

- id: project-pay-equity
  title: 'Project: a pay equity analysis'
  area: business
  kind: project
  summary: Pay differences between groups analysed properly, controlling for role, level and experience.
  hours: 50
  requires: [hr-fundamentals, statistics]
  recommends: [linear-models, data-visualization]
  brief:
    build: On a public or synthetic HR dataset with pay, role, level, experience and gender, measure the raw pay gap and the gap that remains after accounting for legitimate factors, using regression.
    shows:
      - The raw gap and the adjusted gap
      - Which factors explain the difference
      - Individual cases flagged for review
      - Recommendations, and their cost
    stretch:
      - Check promotion rates, not only pay
      - A dashboard for leadership
    present: A report for an HR head and the analysis code. Treat real pay data as confidential.
  resources:
    - resource: psu-stat501
      locator: The lessons on multiple regression and categorical predictors
      role: primary
      verified: true

- id: project-inventory-sim
  title: 'Project: forecast demand and set inventory policy'
  area: business
  kind: project
  summary: Demand forecast for a set of products and an inventory policy tested by simulation.
  hours: 50
  requires: [spreadsheets, statistics]
  recommends: [time-series, operations-research]
  brief:
    build: Using a public retail sales dataset, forecast demand for a few products, then set reorder points and safety stock, and simulate a year to compare service level and stock cost under different policies.
    shows:
      - Forecasts with their error measured
      - Safety stock and reorder points from the forecast error
      - A simulation of a year, with stock-outs and holding costs
      - A recommended policy and the trade-off
    stretch:
      - ABC classification of the full product list
      - Supplier lead-time variability
    present: A report and the workbook or notebook.
  resources:
    - resource: fpp3
      locator: The chapters on forecasting methods and evaluating accuracy
      role: primary
      verified: true

- id: project-sales-forecast
  title: 'Project: a sales forecast and territory plan'
  area: business
  kind: project
  summary: Next quarter's sales forecast from pipeline and history, and a territory and quota plan built on it.
  hours: 50
  requires: [bi-tools, statistics]
  recommends: [time-series, salesforce]
  brief:
    build: From a sales dataset with history and pipeline, forecast next quarter by region two ways, from the pipeline and from history, then design territories and quotas that are fair.
    shows:
      - Two forecasts, compared and combined
      - Forecast accuracy measured on past quarters
      - Territories balanced by potential, not just past sales
      - Quotas with the reasoning
    stretch:
      - A what-if for losing a big account
      - A dashboard for sales leaders
    present: A planning deck and the model.
  resources:
    - resource: fpp3
      locator: The chapters on forecasting and evaluating accuracy
      role: primary
      verified: true
    - resource: alex-powerbi
      locator: For the dashboard
      role: alternative
      verified: true
