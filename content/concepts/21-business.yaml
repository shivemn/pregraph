# Business and consulting: what commerce, BBA and economics graduates need for
# analyst jobs in consulting, marketing, HR, operations and sales.

- id: problem-structuring
  title: Structured problem solving and cases
  area: business
  summary: Breaking a vague business question into parts, estimating sizes, testing hypotheses with numbers, and ending with a clear recommendation. What case interviews test.
  hours: 30
  recommends: [spreadsheets, statistics]
  covers:
    - topic: Defining the problem
      detail: One clear question with a decision attached.
    - topic: Issue trees
      detail: Breaking a problem into parts that don't overlap and cover everything (MECE).
    - topic: Hypotheses
      detail: Starting with a likely answer and testing it.
    - topic: Market sizing
      detail: Top-down and bottom-up estimates.
    - topic: Frameworks
      detail: Profitability, market entry and others, used as starting points.
    - topic: Communicating
      detail: 'The pyramid principle: answer first, then the support.'
  resources:
    - resource: mckinsey-interviewing
      locator: "Sample cases, worked through on paper first"
      verified: true
    - resource: bain-case-interview
      locator: "Coffee Shop Co. and FashionCo. practice cases"
      verified: true

- id: process-improvement
  title: Process improvement (Lean and Six Sigma)
  area: business
  summary: Mapping how work flows, finding waste and variation, and fixing it with data. The DMAIC steps, value stream maps and control charts.
  hours: 20
  recommends: [statistics]
  covers:
    - topic: Lean
      detail: Value, waste and flow.
    - topic: Value-stream mapping
      detail: Seeing a process end to end with times.
    - topic: Six Sigma basics
      detail: DMAIC and reducing variation.
    - topic: Root cause tools
      detail: Fishbone diagrams and the five whys.
    - topic: Measuring processes
      detail: Cycle time, throughput and bottlenecks.
    - topic: Sustaining change
      detail: Standard work and control charts.
  resources:
    - resource: mit-16660
      locator: "All lectures"
      verified: true

- id: marketing-fundamentals
  title: Marketing fundamentals
  area: business
  summary: Customers, segments and positioning, pricing, channels and how a company decides what to sell to whom.
  hours: 20
  covers:
    - topic: Customers and segments
