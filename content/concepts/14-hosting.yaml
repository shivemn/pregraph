# Where to put your projects online, mostly on free tiers. Free tiers change
# often, so the summaries say what each is for, not the exact limits.

- id: github-pages
  title: GitHub Pages
  area: infra
  kind: tool
  summary: Free hosting for static sites straight from a GitHub repository. The simplest place for a portfolio.
  hours: 2
  requires: [git, html-css]
  covers:
    - topic: Publishing a site
      detail: From a repository branch or a GitHub Actions workflow.
    - topic: Static site generators
      detail: Jekyll, Astro or plain HTML.
    - topic: Custom domains
      detail: DNS records and HTTPS.
    - topic: Limits
      detail: Static files only, and size and bandwidth limits.
  resources:
    - resource: gh-pages-start
      locator: "The quickstart"
      verified: true
    - resource: gh-pages-video
      locator: "The whole video"
      verified: true

- id: cloudflare
  title: Cloudflare Pages and Workers
  area: infra
  kind: tool
  summary: Static sites on Pages and small serverless functions on Workers, served from Cloudflare's network, with a generous free tier.
  hours: 6
  requires: [git]
  recommends: [web-http, javascript]
  covers:
    - topic: DNS and proxy
      detail: Putting a domain behind Cloudflare.
    - topic: Pages
      detail: Deploying static and full-stack sites from Git.
    - topic: Workers
      detail: Running code at the edge.
    - topic: Storage
      detail: KV, R2 and D1.
    - topic: Security
      detail: HTTPS, caching rules and basic protection.
  resources:
    - resource: cf-pages-start
      locator: "Getting started, then the Workers docs when you need a backend"
      verified: true
    - resource: cf-workers-course
      locator: "The whole course"
      verified: true

- id: vercel
  title: Vercel
  area: infra
  kind: tool
  summary: Deploy frontends and Next.js apps from a Git repository, with a preview link for every branch.
  hours: 3
  requires: [git]
  recommends: [react, nextjs]
  covers:
    - topic: Deploying from Git
      detail: Preview deployments for every pull request.
    - topic: Frameworks
      detail: Next.js and other frameworks out of the box.
    - topic: Serverless and edge functions
      detail: Back-end code without servers.
    - topic: Environment variables
      detail: Secrets per environment.
    - topic: Limits
      detail: What the free plan allows.
  resources:
    - resource: vercel-start
      locator: "Getting started with Vercel"
      verified: true
    - resource: vercel-walkthrough
      locator: "The whole video"
      verified: true

- id: netlify
  title: Netlify
  area: infra
  kind: tool
  summary: Deploy static sites and frontends from a Git repository, with forms and serverless functions built in.
  hours: 3
  requires: [git]
  covers:
    - topic: Deploying from Git
      detail: Builds and deploy previews.
    - topic: Functions
      detail: Serverless back-end code.
    - topic: Forms and redirects
      detail: Built-in features for static sites.
    - topic: Custom domains
      detail: DNS and HTTPS.
  resources:
    - resource: netlify-start
      locator: "Deploy from your repository"
      verified: true

- id: render
  title: Render
  area: infra
  kind: tool
  summary: Hosting for backends, APIs and background workers, deployed from Git or a Dockerfile. Free instances sleep when idle.
  hours: 4
  requires: [git, rest-apis]
  recommends: [docker]
  covers:
    - topic: Web services
      detail: Deploying an API from a Git repository.
    - topic: Databases
      detail: Managed PostgreSQL and key-value stores.
    - topic: Environment and secrets
      detail: Configuration per service.
    - topic: Free tier limits
      detail: Sleeping services and what that means for users.
  resources:
    - resource: render-start
      locator: "Your First Render Deploy"
      verified: true

- id: neon
  title: Neon
  area: data
  kind: tool
  summary: Serverless Postgres with a free tier, and database branches you can make like Git branches.
  hours: 3
  requires: [sql]
  covers:
    - topic: Serverless Postgres
      detail: A Postgres database that scales to zero.
    - topic: Branching
      detail: Copies of a database for development and previews.
    - topic: Connecting
      detail: Connection strings and pooling.
    - topic: Limits
      detail: Free-tier storage and compute.
  resources:
    - resource: neon-start
      locator: "The Getting started section"
      verified: true

- id: supabase
  title: Supabase
  area: data
  kind: tool
  summary: A Postgres database with sign-in, file storage and an API generated for you. A quick backend for side projects.
  hours: 8
  requires: [sql]
  recommends: [rest-apis, javascript]
  covers:
    - topic: Postgres database
      detail: Tables, SQL and the dashboard.
    - topic: Auth
      detail: Sign-in with email and social providers.
    - topic: Row-level security
      detail: Policies so users only see their own data.
    - topic: Storage and functions
      detail: Files and edge functions.
    - topic: Client libraries
      detail: Calling it from a web or mobile app.
  resources:
    - resource: supabase-start
      locator: "Getting Started, then the quickstart for your framework"
      verified: true
    - resource: pedrotech-supabase
      locator: "The whole video"
      verified: true

- id: firebase
  title: Firebase
  area: web
  kind: tool
  summary: Google's app backend. Sign-in, a NoSQL database, hosting and functions, common in mobile apps.
  hours: 8
  requires: [javascript]
  covers:
    - topic: Firestore
      detail: A document database with real-time updates.
    - topic: Authentication
      detail: Sign-in methods.
    - topic: Security rules
      detail: Who can read and write what.
    - topic: Hosting and functions
      detail: Static hosting and serverless back ends.
    - topic: Cloud Messaging
      detail: Push notifications.
  resources:
    - resource: firebase-start
      locator: "Add Firebase to your JavaScript project, then Authentication and Cloud Firestore"
      verified: true
    - resource: fcc-firebase
      locator: "The whole video"
      verified: true

- id: databricks
  title: Databricks
  area: data
  kind: tool
  summary: The data and AI platform built around Spark. Notebooks, Delta tables, jobs and SQL warehouses in one place.
  hours: 15
  requires: [sql]
  recommends: [spark, programming-basics]
  covers:
    - topic: Workspace and clusters
      detail: Notebooks, compute and jobs.
    - topic: Delta Lake
      detail: ACID tables on object storage, and time travel.
    - topic: Spark on Databricks
      detail: DataFrames and SQL at scale.
    - topic: Unity Catalog
      detail: Governance and permissions.
    - topic: Workflows
      detail: Scheduling pipelines.
  resources:
    - resource: databricks-start
      locator: "The Get started tutorials"
      verified: true
    - resource: codebasics-databricks
      locator: "The whole video, on the free edition"
      verified: true

- id: hugging-face
  title: Hugging Face
  area: ai
  kind: tool
  summary: The Hub for open models and datasets, and the Transformers library for using and fine-tuning them.
  hours: 10
  requires: [programming-basics]
  recommends: [transformers, pytorch]
  covers:
    - topic: The Hub
      detail: Find models and datasets, read model cards and licences, and download weights.
    - topic: pipeline()
      detail: Run a task such as classification or summarisation in three lines.
    - topic: Tokenizers
      detail: Load the right tokenizer, and see how text becomes input IDs and attention masks.
    - topic: AutoModel classes
      detail: Load a model for a task and run it yourself.
    - topic: Datasets
      detail: Load, slice, map and stream datasets too big for memory.
    - topic: Fine-tuning
      detail: Trainer and TRL's SFTTrainer for adapting a model to your data.
    - topic: Sharing
      detail: Push a model or dataset to the Hub with a model card.
    - topic: Accelerate
      detail: Run the same training script on CPU, one GPU or several.
  resources:
    - resource: hf-llm-course
      locator: "Chapters 1–4: using Transformers, fine-tuning, sharing on the Hub"
      verified: true
    - resource: assemblyai-hf
      locator: "The whole video"
      verified: true
