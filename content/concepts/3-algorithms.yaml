- id: complexity-analysis
  title: Big-O and running time
  area: algorithms
  summary: How running time and memory grow with input size, and how to argue about it.
  hours: 6
  requires: [discrete-math]
  resources:
    - resource: mit-6006
      locator: "Lecture 1 and Recitation 1"
    - resource: cses-book
      locator: "Chapter 2, Time complexity"
      role: alternative

- id: linear-structures
  title: Arrays, lists, stacks and queues
  area: algorithms
  summary: The basic containers, what each operation costs, and dynamic arrays.
  hours: 10
  requires: [programming-basics]
  recommends: [complexity-analysis]
  resources:
    - resource: mit-6006
      locator: "Lecture 2, Data structures and dynamic arrays"
    - resource: ods
      locator: "Chapters 2–3"
      role: alternative

- id: hash-tables
  title: Hash tables
  area: algorithms
  summary: Constant-time lookup on average, why it works, and when it doesn't.
  hours: 8
  requires: [linear-structures]
  recommends: [probability]
  resources:
    - resource: mit-6006
      locator: "Lecture 4, Hashing"
    - resource: ods
      locator: "Chapter 5"
      role: alternative

- id: sorting-searching
  title: Sorting and searching
  area: algorithms
  summary: Merge sort, quicksort, binary search, lower bounds and linear-time sorting.
  hours: 12
  requires: [linear-structures, recursion]
  resources:
    - resource: mit-6006
      locator: "Lectures 3 and 5"
    - resource: algs4
      locator: "Chapter 2"
      role: alternative

- id: trees-heaps
  title: Trees and heaps
  area: algorithms
  summary: Binary search trees, keeping them balanced, and priority queues.
  hours: 15
  requires: [linear-structures, recursion]
  resources:
    - resource: mit-6006
      locator: "Lectures 6–8"
    - resource: ods
      locator: "Chapters 6, 9 and 10"
      role: alternative

- id: graph-algorithms
  title: Graph algorithms
  area: algorithms
  summary: Breadth- and depth-first search, topological order and shortest paths. Pregraph itself is built on these.
  hours: 25
  requires: [linear-structures, complexity-analysis]
  recommends: [trees-heaps]
  resources:
    - resource: mit-6006
      locator: "Lectures 9–14"
    - resource: algs4
      locator: "Chapter 4"
      role: alternative
    - resource: clrs
      locator: "Part VI, Graph algorithms"
      role: deep-dive

- id: greedy-algorithms
  title: Greedy algorithms
  area: algorithms
  summary: Making the locally best choice, and proving when that gives the best answer overall.
  hours: 10
  requires: [sorting-searching]
  recommends: [graph-algorithms]
  resources:
    - resource: cses-book
      locator: "Chapter 6, Greedy algorithms"
    - resource: clrs
      locator: "The chapter on greedy algorithms"
      role: deep-dive

- id: dynamic-programming
  title: Dynamic programming
  area: algorithms
  summary: Breaking a problem into overlapping subproblems and solving each once.
  hours: 20
  requires: [recursion, complexity-analysis]
  resources:
    - resource: mit-6006
      locator: "Lectures 15–18"
    - resource: cses-book
      locator: "Chapter 7, Dynamic programming"
      role: alternative

- id: algorithm-practice
  title: Solving problems under pressure
  area: algorithms
  summary: Turning the theory into working code quickly. This is what coding interviews test.
  hours: 40
  requires: [dynamic-programming, graph-algorithms, hash-tables]
  recommends: [testing-debugging]
  resources:
    - resource: cses-problemset
      locator: "Introductory, then Sorting and Searching, Dynamic Programming and Graph Algorithms"
    - resource: cses-book
      locator: "Use as a reference while solving"
      role: alternative
