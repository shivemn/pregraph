# More mathematics: the GATE Mathematics syllabus beyond the core courses,
# plus operations research and actuarial work, which are built on it.

- id: complex-analysis
  title: Complex analysis
  area: foundations
  summary: Analytic functions, Cauchy's theorems, Taylor and Laurent series, residues, and conformal maps.
  hours: 35
  requires: [calculus]
  recommends: [real-analysis]
  resources:
    - resource: mit-1804
      locator: "Lecture notes, topics 1–10, with the problem sets"
      verified: true

- id: ordinary-differential-equations
  title: Ordinary differential equations
  area: foundations
  summary: First- and second-order equations, linear systems, Laplace transforms, series solutions and stability.
  hours: 40
  requires: [calculus]
  recommends: [linear-algebra]
  resources:
    - resource: mit-1803sc
      locator: "Units I–IV"
      verified: true
    - resource: diffyqs
      locator: "Chapters 0–3, 6 and 7"
      verified: true

- id: partial-differential-equations
  title: Partial differential equations
  area: foundations
  summary: The heat, wave and Laplace equations, characteristics, separation of variables and transform methods.
  hours: 30
  requires: [ordinary-differential-equations, multivariable-calculus]
  resources:
    - resource: mit-18152
      locator: "Lecture notes and problem sets"
      verified: true

- id: abstract-algebra
  title: Abstract algebra
  area: foundations
  summary: Groups, subgroups and the Sylow theorems, rings and ideals, and fields and their extensions.
  hours: 45
  requires: [proofs]
  resources:
    - resource: judson-aata
      locator: "Chapters 1–6, 9–11, 13, 16–18, 21"
      why: "A free, complete textbook with exercises."
      verified: true
    - resource: mit-18701
      locator: "Lecture notes and problem sets"
      role: alternative
      verified: true

- id: numerical-analysis
  title: Numerical analysis
  area: foundations
  summary: Solving equations and linear systems on a computer, interpolation, numerical integration, and methods for differential equations, with their errors.
  hours: 30
  requires: [calculus, linear-algebra]
  recommends: [programming-basics]
  resources:
    - resource: mit-18330
      locator: "Lecture notes and homework"
      verified: true

- id: topology
  title: Topology
  area: foundations
  summary: Open sets, bases, product and quotient topologies, connectedness, compactness and the separation axioms.
  hours: 30
  requires: [real-analysis]
  resources:
    - resource: mit-18901
      locator: "Lecture notes and problem sets"
      verified: true

- id: functional-analysis
  title: Functional analysis
  area: foundations
  summary: Normed, Banach and Hilbert spaces, the big theorems (Hahn–Banach, open mapping, uniform boundedness) and compact operators.
  hours: 35
  requires: [real-analysis, linear-algebra]
  recommends: [topology]
  resources:
    - resource: mit-18102
      locator: "All lectures"
      verified: true

- id: linear-programming
  title: Linear programming
  area: foundations
  summary: Writing a decision as an objective and constraints, the simplex method, duality, and transportation and assignment problems.
  hours: 25
  requires: [linear-algebra]
  resources:
    - resource: mit-15053
      locator: "Lectures 1–12"
      verified: true
    - resource: or-tools
      locator: "Linear optimization, then assignment"
      role: alternative
      verified: true

- id: operations-research
  title: Operations research in practice
  area: data
  summary: Integer programming, scheduling, routing and inventory problems, solved with real solvers and explained to the people who'll use the answer.
  hours: 35
  requires: [linear-programming, programming-basics]
  recommends: [statistics]
  resources:
    - resource: mit-15053
      locator: "Integer programming and network lectures"
      verified: true
    - resource: or-tools
      locator: "Routing, scheduling and integer optimization guides"
      verified: true
    - resource: mit-15071
      locator: "Unit 9: Integer optimization"
      role: deep-dive
      verified: true

- id: project-optimization
  title: "Project: optimise a real decision"
  area: data
  kind: project
  summary: Take a real problem, like delivery routes, shift rosters or a diet plan, model it, solve it with OR-Tools or PuLP, and write up what the answer saves.
  hours: 20
  requires: [operations-research]
  brief:
    build: Take a real decision with numbers behind it, such as delivery routes for a local shop, shift rosters for a clinic or a hostel menu that meets a budget and nutrition targets. Model it as a linear or integer program and solve it with OR-Tools or PuLP.
    shows:
    - 'The model written out: decision variables, objective and constraints, in words and in maths'
    - Real or realistic data, and where it came from
    - 'The answer against what people do now: what it saves'
    - What happens when you change one constraint
    stretch:
    - A simple spreadsheet or web front end someone could use
    - A heuristic for when the exact solver is too slow
    present: A short report or notebook that opens with the saving in rupees or hours, then the model, then the details.
  resources:
    - resource: or-tools
      locator: "Start from the closest example"
      verified: true
    - resource: mit-15053
      locator: "Lecture examples for modelling ideas"
      verified: true

- id: actuarial-maths
  title: Actuarial mathematics
  area: finance
  summary: Interest and annuities, survival models, life insurance and annuity values, premiums and reserves. The core of the actuarial exams.
  hours: 60
  requires: [probability, calculus]
  recommends: [corporate-finance]
  resources:
    - resource: life-contingencies-open
      locator: "Chapters 1–4"
      verified: true
    - resource: soa-exam-fm
      locator: "Sample questions and solutions"
      verified: true
    - resource: soa-exam-p
      locator: "Sample questions and solutions"
      role: alternative
      verified: true

- id: loss-models
  title: Loss models and insurance data
  area: finance
  summary: Modelling how often claims happen and how big they are, deductibles and limits, credibility, and pricing from claims data.
  hours: 40
  requires: [statistics, probability]
  recommends: [r-lang]
  resources:
    - resource: loss-data-analytics
      locator: "Chapters 1–7"
      verified: true

- id: project-pricing-model
  title: 'Project: price an insurance product'
  area: finance
  kind: project
  summary: A premium worked out from stated assumptions, with the sensitivities and a profit test.
  hours: 25
  requires: [actuarial-maths, spreadsheets]
  recommends: [loss-models, r-lang]
  brief:
    build: 'Price a simple product in a spreadsheet: a term life policy using the Indian mortality table (IALM 2012–14), or a motor or health cover from a public claims dataset.'
    shows:
    - 'Assumptions written down: mortality or claim frequency, claim size, interest and expenses'
    - The premium worked out from them, with formulas you can explain
    - What each assumption does to the premium
    - A reserve or profit test over the policy's life
    stretch:
    - Fit frequency and severity distributions in R
    - Compare your premium with what insurers charge
    present: 'The workbook and a one-page pricing memo: the premium, the key assumptions and the risks.'
  resources:
    - resource: loss-data-analytics
      locator: 'Chapters 3, 4, 7 and 10: frequency, severity, aggregate loss models and premium foundations'
      role: primary
      verified: true
    - resource: soa-exam-fm
      locator: For the interest calculations behind the premium
      role: alternative
      verified: true

- id: project-life-table
  title: 'Project: life tables and annuity values'
  area: finance
  kind: project
  summary: A life table built from an Indian mortality table, and annuity and insurance values worked out from it.
  hours: 10
  requires: [actuarial-maths, spreadsheets]
  brief:
    build: Take the IALM 2012–14 mortality rates and build a life table in a spreadsheet, then compute the present value of a life annuity and a term insurance for a few ages and interest rates.
    shows:
      - Survival probabilities and life expectancy by age
      - Annuity and insurance values with your formulas visible
      - How the values change with age and interest rate
      - Checks against a known textbook example
    stretch:
      - Commutation functions
      - Compare male and female or different tables
    present: The workbook with a short note on what you found.
  resources:
    - resource: life-contingencies-open
      locator: 'Chapters 2 and 3: Modeling Lifetimes and Basic Life Contingent Benefits'
      role: primary
      verified: true
    - resource: soa-exam-fm
      locator: Interest theory practice, for the discounting
      role: alternative
      verified: true

- id: project-reserving
  title: 'Project: claims reserving with chain ladder'
  area: finance
  kind: project
  summary: Outstanding claims estimated from public loss triangles, with uncertainty, as a reserving actuary would.
  hours: 40
  requires: [loss-models, r-lang]
  recommends: [statistics]
  brief:
    build: Using public loss triangles, such as the Casualty Actuarial Society's reserving database, estimate outstanding claims with chain ladder and Bornhuetter-Ferguson, then put a range around them with bootstrapping.
    shows:
      - Development factors chosen with reasons
      - Chain ladder and Bornhuetter-Ferguson results compared
      - A bootstrap distribution of reserves
      - Back-testing against later diagonals
    stretch:
      - Mack's method for the standard error
      - Look at more than one line of business
    present: A reserving report with the triangles, results and ranges, and the R code.
  resources:
    - resource: loss-data-analytics
      locator: Chapter 14, Loss Reserving
      role: primary
      verified: true

- id: project-lp-spreadsheet
  title: 'Project: optimise a small decision in Excel Solver'
  area: finance
  kind: project
  summary: A real small decision written as a linear program and solved in a spreadsheet, with sensitivity analysis.
  hours: 8
  requires: [linear-programming, spreadsheets]
  brief:
    build: Write a small real decision as a linear program, such as a canteen's menu, a workshop's production mix or a diet within a budget, and solve it with Excel Solver or LibreOffice.
    shows:
      - Variables, objective and constraints written out in words
      - The model set up clearly in the sheet
      - The optimal answer and what it means
      - 'Sensitivity: which constraints bind and what relaxing them is worth'
    stretch:
      - An integer version, and how the answer changes
      - The same model in Python with PuLP
    present: The workbook and a half-page explanation.
  resources:
    - resource: mit-15053
      locator: The lecture notes on formulating linear programs and sensitivity analysis
      role: primary
      verified: true

- id: project-vehicle-routing
  title: 'Project: a delivery routing system'
  area: finance
  kind: project
  summary: Vehicle routing with time windows on real map data, solved exactly and by heuristic, with the trade-off measured.
  hours: 60
  requires: [operations-research, programming-basics]
  recommends: [graph-algorithms, data-visualization]
  brief:
    build: Plan delivery routes for a realistic case, such as a grocery service with 100 orders a day in one city. Use real road distances from OpenStreetMap, add vehicle capacities and delivery windows, and compare an exact solver with a heuristic.
    shows:
      - Real distances, and how you got them
      - Capacity and time-window constraints handled
      - OR-Tools results compared with your own heuristic on cost and time
      - A map of the routes
    stretch:
      - Re-plan when a new order arrives mid-day
      - A small web page to upload orders and see routes
    present: A report with route maps and results tables, and the code.
  resources:
    - resource: or-tools
      locator: The vehicle routing guides
      role: primary
      verified: true
