- id: project-order-book
  title: 'Project: build an order book in C++'
  area: programming
  kind: project
  summary: A limit order book that matches buy and sell orders correctly and quickly, with tests and benchmarks.
  hours: 30
  requires: [cpp, hash-tables, trees-heaps]
  recommends: [financial-markets, concurrency]
  brief:
    build: Write a limit order book in modern C++. It takes add, cancel and modify messages, matches orders by price and then time, and reports trades. Drive it from a file of generated messages.
    shows:
    - Price-time priority, partial fills and cancels all correct
    - The data structures you chose, and the cost of each operation
    - Unit tests for the tricky cases, like cancelling a partly filled order
    - 'A benchmark: messages per second and time per message'
    stretch:
    - Swap std::map for something faster and measure the difference
    - A second thread reading market data while the book updates
    present: A repo with a README on the design and the benchmark numbers, with the machine they ran on. Interviewers will ask why you picked each structure.
  resources:
    - resource: ods
      locator: 'Chapter 5, Hash Tables, and chapter 9, Red-Black Trees: what unordered_map and map are doing inside your book'
      role: primary
      verified: true
    - resource: learncpp
      locator: As a reference while you build
      role: alternative
      verified: true

- id: project-manual-testing
  title: 'Project: test a real app by hand'
  area: programming
  kind: project
  summary: A test plan, test cases and bug reports for a real app, written the way a QA team writes them.
  hours: 15
  requires: [testing-debugging]
  recommends: [jira, sql]
  brief:
    build: 'Pick a real app or website with a public bug tracker, or a demo shop built for testers, and test one feature area thoroughly by hand: plan it, design the cases, run them and report what breaks.'
    shows:
    - 'A short test plan: scope, what''s out of scope, environments and risks'
    - Test cases designed with techniques such as equivalence partitions, boundary values and decision tables
    - 'Clear bug reports: steps, expected and actual results, severity, screenshots'
    - A summary of what was tested, what passed, and what's still risky
    stretch:
    - Automate your three most repeated cases with Playwright or Selenium
    - Report a real bug upstream and follow it through
    present: The plan, a spreadsheet of cases and results, and your three best bug reports. A bug a real project accepted is the strongest thing you can show.
  resources:
    - resource: istqb-ctfl-syllabus
      locator: Chapter 4, Test Analysis and Design, and section 5.5, Defect Management
      role: primary
      verified: true

- id: python-depth
  title: Python in depth
  area: programming
  summary: 'The parts of Python that separate scripts from software: generators, decorators, context managers, type hints, Pydantic, asyncio and packaging.'
  hours: 25
  requires: [programming-basics]
  recommends: [oop-design, testing-debugging]
  covers:
    - topic: Comprehensions
      detail: List, dict and set comprehensions, and when a loop is clearer.
    - topic: Iterators and generators
      detail: The iterator protocol, yield, generator expressions and lazy pipelines.
    - topic: Decorators
      detail: Functions that wrap functions, functools.wraps, and decorators with arguments.
    - topic: Context managers
      detail: with blocks, __enter__ and __exit__, and contextlib.contextmanager.
    - topic: Exceptions done well
      detail: Specific exceptions, custom exception classes, and cleaning up with finally.
    - topic: Type hints
      detail: Annotations, generics, Optional and Union, Protocols, and checking with mypy.
    - topic: Pydantic
      detail: 'Models that validate data at the edges of your program: API inputs, configs and LLM output.'
    - topic: asyncio
      detail: async and await, the event loop, gather, timeouts and when async helps (I/O) or doesn't (CPU).
    - topic: Concurrency choices
      detail: Threads, processes and async, and what the GIL means for each.
    - topic: Environments and packaging
      detail: venv or uv, pyproject.toml, pinning dependencies and publishing a package.
    - topic: Tooling
      detail: pytest, a formatter, a linter and profiling with cProfile.
  resources:
    - resource: python-tutorial
      locator: Chapter 9, Classes, through 9.8 Iterators, 9.9 Generators and 9.10 Generator Expressions
      role: primary
      verified: true
    - resource: python-functional-howto
      locator: Iterators, generators, and the itertools and functools sections
      role: primary
      verified: true
    - resource: realpython-decorators
      locator: The whole article
      role: alternative
      verified: true
    - resource: python-asyncio-docs
      locator: 'The high-level API: coroutines and tasks, then synchronisation and queues'
      role: deep-dive
      verified: true
    - resource: pydantic-docs
      locator: Models, then validators
      role: primary
      verified: true
    - resource: mypy-cheatsheet
      locator: Keep it open while you add type hints
      role: alternative
      verified: true
    - resource: python-packaging-guide
      locator: The whole tutorial, publishing to TestPyPI
      role: primary
      verified: true

