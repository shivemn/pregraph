  brief:
    build: 'Pick a real app or website with a public bug tracker, or a demo shop built for testers, and test one feature area thoroughly by hand: plan it, design the cases, run them and report what breaks.'
    shows:
    - 'A short test plan: scope, what''s out of scope, environments and risks'
    - Test cases designed with techniques such as equivalence partitions, boundary values and decision tables
    - 'Clear bug reports: steps, expected and actual results, severity, screenshots'
