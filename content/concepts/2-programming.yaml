      locator: "Version Control and Git"
      verified: true
      role: alternative
    - resource: learn-git-branching
      locator: "Main and Remote sequences"
      verified: true
    - resource: github-skills
      locator: "Introduction to GitHub"
      role: alternative
      verified: true

- id: oop-design
  title: Objects and design
  area: programming
  summary: Classes, inheritance and when not to use it, and the common design patterns you'll meet in real code.
  hours: 20
  requires: [higher-order-programming]
  covers:
    - topic: Classes and objects
      detail: State and behaviour together, constructors and methods.
    - topic: Encapsulation
      detail: Hiding internal state behind a small public interface.
    - topic: Inheritance and interfaces
      detail: Sharing behaviour, and why composition is often better.
    - topic: Polymorphism
      detail: Calling the same method on different types and getting the right behaviour.
    - topic: SOLID principles
      detail: Five rules of thumb for classes that are easy to change.
    - topic: Design patterns
      detail: Factory, strategy, observer, adapter, decorator and singleton, and the problem each solves.
    - topic: UML
      detail: Class and sequence diagrams for explaining a design to others.
    - topic: Low-level design interviews
      detail: Designing classes for a parking lot or a library system out loud.
  resources:
    - resource: think-python
      locator: "Chapters 14–17"
      verified: true
    - resource: refactoring-guru
      locator: "Creational, structural and behavioural patterns"
      role: deep-dive
      verified: true
    - resource: mit-60001
      locator: "Lectures 8–9, Object oriented programming"
      verified: true
    - resource: exercism
      locator: "Python track: the Classes concept and its exercise"
      verified: true

- id: testing-debugging
  title: Testing and debugging
  area: programming
  summary: Unit tests, test doubles, debuggers and profilers. How to find out why your program is wrong.
  hours: 12
  requires: [programming-basics]
  recommends: [shell-tools]
  covers:
    - topic: Reading errors
      detail: Stack traces, error messages and finding where it really went wrong.
    - topic: Debuggers
      detail: Breakpoints, stepping and inspecting variables in an IDE or pdb.
    - topic: Logging
      detail: Useful log messages and levels, instead of print statements everywhere.
    - topic: Unit tests
      detail: Testing one function at a time with a framework like pytest or JUnit.
    - topic: What to test
      detail: Normal cases, edge cases and error cases.
    - topic: Test doubles
      detail: Mocks, stubs and fakes for code that talks to the outside world.
    - topic: Test-driven development
      detail: Writing the test first, and when it helps.
    - topic: Systematic debugging
      detail: Reproduce, narrow down, form a hypothesis, test it.
  resources:
    - resource: missing-semester
      locator: "Debugging and Profiling"
      verified: true
    - resource: swe-at-google
      locator: "Chapters 11–14 on testing"
      verified: true
      role: alternative
    - resource: mit-60001
      locator: "Lecture 7, Testing, debugging, exceptions and assertions"
      role: alternative
      verified: true

- id: c-and-memory
  title: C and memory
  area: programming
  summary: Pointers, the stack and the heap, and managing memory by hand. Why programs crash.
  hours: 25
  requires: [programming-basics]
  recommends: [git, shell-tools]
  covers:
    - topic: C basics
      detail: Types, functions, control flow and compiling with gcc or clang.
    - topic: Pointers
      detail: Addresses, dereferencing, pointer arithmetic and arrays as pointers.
    - topic: Memory layout
      detail: The stack, the heap, static data, and where each variable lives.
    - topic: Manual memory management
      detail: malloc and free, and leaks, double frees and use-after-free.
    - topic: Strings and buffers
      detail: Null-terminated strings and buffer overflows.
    - topic: Structs
      detail: Grouping data, padding and alignment.
    - topic: Tools
      detail: Make, gdb and Valgrind or AddressSanitizer for finding memory bugs.
  resources:
    - resource: cs50x
      locator: "Weeks 1–5"
      verified: true
    - resource: beej-c
      locator: "The chapters on pointers, arrays, strings, structs and memory allocation"
