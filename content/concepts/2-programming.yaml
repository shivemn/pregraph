- id: programming-basics
  title: Programming in Python
  area: programming
  summary: Variables, conditions, loops, functions, lists and dictionaries. Enough to write small programs on your own.
  hours: 40
  resources:
    - resource: think-python
      locator: "Chapters 1–11"
    - resource: cs50x
      locator: "Weeks 0–3, then Week 6 for Python"
      role: alternative
    - resource: cs50p
      locator: "Lectures 0–6"
      why: "Short, clear lectures with problem sets that check your code."
    - resource: exercism
      locator: "Python track"

- id: recursion
  title: Recursion
  area: programming
  summary: Functions that call themselves. If you know induction, you already know the idea; this is the practice.
  hours: 8
  requires: [programming-basics]
  recommends: [proofs]
  resources:
    - resource: think-python
      locator: "Chapters 5–6"
    - resource: composing-programs
      locator: "Section 1.7, Recursive functions"
      role: alternative
    - resource: mit-60001
      locator: "Lecture 6, Recursion and dictionaries"

- id: higher-order-programming
  title: Functions and abstraction
  area: programming
  summary: Functions as values, closures and data abstraction. How to keep a growing program understandable.
  hours: 20
  requires: [recursion]
  resources:
    - resource: composing-programs
      locator: "Chapters 1–2"
    - resource: mit-60001
      locator: "Lecture 4, Decomposition, abstraction and functions"

- id: shell-tools
  title: The shell and command-line tools
  area: programming
  summary: Moving around files, pipes, small scripts and an editor you're fast in. Nobody teaches this, everybody expects it.
  hours: 8
  resources:
    - resource: missing-semester
      locator: "The Shell; Shell Tools and Scripting; Editors"
    - resource: tlcl
      locator: "Part 1, Learning the shell"
      why: "Free, patient and complete. Read it with a terminal open."
    - resource: overthewire
      locator: "Bandit, levels 0–15"

- id: git
  title: Git
  area: programming
  summary: Commits, branches, merging, remotes, and how to get out of trouble.
  hours: 6
  recommends: [shell-tools]
  resources:
    - resource: pro-git
      locator: "Chapters 1–3"
    - resource: missing-semester
      locator: "Version Control (Git)"
      role: alternative
    - resource: learn-git-branching
      locator: "Main and Remote sequences"

- id: oop-design
  title: Objects and design
  area: programming
  summary: Classes, inheritance and when not to use it, and the common design patterns you'll meet in real code.
  hours: 20
  requires: [higher-order-programming]
  resources:
    - resource: think-python
      locator: "Chapters 14–17"
    - resource: refactoring-guru
      locator: "Creational, structural and behavioural patterns"
      role: deep-dive
    - resource: mit-60001
      locator: "Lectures 8–9, Object oriented programming"

- id: testing-debugging
  title: Testing and debugging
  area: programming
  summary: Unit tests, test doubles, debuggers and profilers. How to find out why your program is wrong.
  hours: 12
  requires: [programming-basics]
  recommends: [shell-tools]
  resources:
    - resource: missing-semester
      locator: "Debugging and Profiling"
    - resource: swe-at-google
      locator: "Chapters 11–14 on testing"
      role: alternative

- id: c-and-memory
  title: C and memory
  area: programming
  summary: Pointers, the stack and the heap, and managing memory by hand. Why programs crash.
  hours: 25
  requires: [programming-basics]
  recommends: [git, shell-tools]
  resources:
    - resource: cs50x
      locator: "Weeks 1–5"
    - resource: beej-c
      locator: "The chapters on pointers, arrays, strings, structs and memory allocation"
      why: "Friendly and precise. Pairs well with the CS50 lectures."
    - resource: exercism
      locator: "C track"

- id: software-engineering
  title: Working in a codebase
  area: programming
  summary: Code review, style, documentation and keeping a project healthy as more people touch it.
  hours: 15
  requires: [git, testing-debugging]
  recommends: [oop-design]
  resources:
    - resource: swe-at-google
      locator: "Part I, then the chapters on style, code review and documentation"

- id: java
  title: Java
  area: programming
  summary: A typed, compiled language and still the most common choice for backend jobs in India.
  hours: 30
  requires: [programming-basics]
  recommends: [oop-design]
  resources:
    - resource: dev-java
      locator: "Getting started, Language basics, Classes and objects"
      role: alternative
    - resource: mooc-java
      locator: "Java Programming I, parts 1–7"
      why: "Hundreds of small graded exercises. The best free way to actually get fluent."
    - resource: nptel-java
      locator: "The full course"
    - resource: exercism
      locator: "Java track"

- id: test-automation
  title: Test automation
  area: programming
  summary: Tests that drive a real browser or API, run on every change, and fail for the right reasons.
  hours: 15
  kind: tool
  requires: [testing-debugging]
  recommends: [web-http, javascript]
  resources:
    - resource: playwright-docs
      locator: "Getting started, Writing tests, Locators, Fixtures"

- id: project-test-suite
  title: "Project: automate the tests for a real web app"
  area: programming
  summary: Pick an open-source web app, write end-to-end tests for its main flows, and run them in CI.
  hours: 25
  kind: project
  requires: [test-automation, ci-cd]
  resources:
    - resource: playwright-docs
      locator: "Use the guides on API testing and CI as you go"
