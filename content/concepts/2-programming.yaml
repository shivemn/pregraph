  recommends: [oop-design]
  covers:
    - topic: Readable code
      detail: Naming, small functions and comments that explain why.
    - topic: Code review
      detail: Giving and taking useful feedback.
    - topic: Refactoring
      detail: Improving structure without changing behaviour, backed by tests.
    - topic: Dependencies
      detail: Package managers, versioning and keeping them up to date.
    - topic: Working in large codebases
      detail: Finding your way around, and making safe changes.
    - topic: Design docs
      detail: Writing down a plan and its trade-offs before building.
    - topic: Technical debt
      detail: Recognising it and deciding when to pay it down.
  resources:
    - resource: swe-at-google
      locator: "Chapters 1–3, then 8–10 (style guides, code review, documentation)"
