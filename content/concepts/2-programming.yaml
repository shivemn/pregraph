- id: project-order-book
  title: 'Project: build an order book in C++'
  area: programming
  kind: project
  summary: A limit order book that matches buy and sell orders correctly and quickly, with tests and benchmarks.
  hours: 30
  requires: [cpp, hash-tables, trees-heaps]
  recommends: [financial-markets, concurrency]
  brief:
    build: Write a limit order book in modern C++. It takes add, cancel and modify messages, matches orders by price and then time, and reports trades. Drive it from a file of generated messages.
    shows:
    - Price-time priority, partial fills and cancels all correct
    - The data structures you chose, and the cost of each operation
    - Unit tests for the tricky cases, like cancelling a partly filled order
    - 'A benchmark: messages per second and time per message'
    stretch:
    - Swap std::map for something faster and measure the difference
    - A second thread reading market data while the book updates
    present: A repo with a README on the design and the benchmark numbers, with the machine they ran on. Interviewers will ask why you picked each structure.
  resources:
    - resource: ods
      locator: 'Chapter 5, Hash Tables, and chapter 9, Red-Black Trees: what unordered_map and map are doing inside your book'
      role: primary
      verified: true
    - resource: learncpp
      locator: As a reference while you build
      role: alternative
      verified: true

- id: project-manual-testing
  title: 'Project: test a real app by hand'
  area: programming
  kind: project
  summary: A test plan, test cases and bug reports for a real app, written the way a QA team writes them.
  hours: 15
  requires: [testing-debugging]
