- id: programming-basics
  title: Programming basics
  area: programming
  summary: "Variables, conditions, loops, functions, lists and dictionaries, in one language, enough to write small programs on your own. Any language teaches this. The main picks use Python, the easiest to start with; Java, C, C++ and C# courses are under more options. If you already write code in any language, skip this stop."
  skipLabel: I already code in another language
  hours: 40
  covers:
    - topic: Values, variables and types
      detail: Numbers, strings, booleans, and what happens when types mix.
    - topic: Control flow
      detail: Conditions and loops, and tracing a program by hand.
    - topic: Functions
      detail: Parameters, return values, scope, and splitting a problem into functions.
    - topic: Collections
      detail: Lists, dictionaries, sets and tuples, and choosing between them.
    - topic: Strings and files
      detail: Formatting, slicing, reading and writing text and CSV files.
    - topic: Errors
      detail: Reading tracebacks, raising and catching exceptions.
    - topic: Modules and libraries
      detail: Importing code, installing packages and reading their docs.
    - topic: Small programs
      detail: Writing complete scripts that take input, do something useful and report results.
  resources:
    - resource: think-python
      locator: "Chapters 1–11"
      verified: true
    - resource: cs50x
      locator: "Weeks 0–3, then Week 6 for Python"
      verified: true
      role: alternative
    - resource: cs50p
      locator: "Lectures 0–6"
      verified: true
      why: "Short, clear lectures with problem sets that check your code."
    - resource: exercism
      locator: "Python track"
      verified: true
    - resource: mooc-java
      locator: "Java Programming I, parts 1–7"
      role: alternative
      why: "If your first language will be Java: the same basics, with exercises checked as you go."
      verified: true
    - resource: learncpp
      locator: "Chapters 0–8"
      role: alternative
      why: "If you'd rather start in C++."
      verified: true
    - resource: ms-csharp
      locator: "A tour of C#, then the tutorials it links to"
      role: alternative
      why: "If you'd rather start in C#."
      verified: true

- id: recursion
  title: Recursion
  area: programming
  summary: Functions that call themselves. If you know induction, you already know the idea; this is the practice.
  hours: 8
  requires: [programming-basics]
  recommends: [proofs]
  covers:
    - topic: Thinking recursively
      detail: A base case, a smaller subproblem and trusting the recursive call.
    - topic: The call stack
      detail: What happens in memory when functions call themselves, and stack overflows.
    - topic: Recursion on lists and trees
      detail: Processing structures that are defined recursively.
    - topic: Divide and conquer
      detail: 'Splitting, solving and combining: merge sort and binary search.'
    - topic: Backtracking
      detail: 'Trying choices and undoing them: permutations, subsets and N-queens.'
    - topic: Recursion to iteration
      detail: Rewriting with an explicit stack, and tail calls.
  resources:
    - resource: think-python
      locator: "Chapters 5–6"
      verified: true
    - resource: composing-programs
      locator: "Section 1.7, Recursive functions"
      role: alternative
      verified: true
    - resource: mit-60001
      locator: "Lecture 6, Recursion and dictionaries"
      verified: true
    - resource: leetcode-150
      locator: "Top Interview 150: Backtracking"
      verified: true

- id: higher-order-programming
  title: Functions and abstraction
  area: programming
  summary: Functions as values, closures and data abstraction. How to keep a growing program understandable.
  hours: 20
  requires: [recursion]
  covers:
    - topic: Functions as values
      detail: Passing functions as arguments and returning them.
    - topic: map, filter and reduce
      detail: Transforming collections without explicit loops.
    - topic: Closures
      detail: Functions that remember the variables around them.
    - topic: Lambdas
      detail: Small anonymous functions, and when a named one is clearer.
    - topic: Abstraction
      detail: Spotting a repeated pattern and turning it into a function that takes behaviour as input.
    - topic: Immutability
      detail: Avoiding shared mutable state, and why it makes code easier to reason about.
  resources:
    - resource: composing-programs
      locator: "Chapters 1–2"
      verified: true
    - resource: mit-60001
      locator: "Lecture 4, Decomposition, abstraction and functions"
      verified: true
    - resource: exercism
      locator: "Python track"
      verified: true

- id: shell-tools
  title: The shell and command-line tools
  area: programming
  summary: Moving around files, pipes, small scripts and an editor you're fast in. Nobody teaches this, everybody expects it.
  hours: 8
  covers:
    - topic: Navigating the shell
      detail: Paths, listing, moving, copying and permissions.
    - topic: Pipes and redirection
      detail: Chaining small tools with |, >, >> and 2>&1.
    - topic: Text tools
      detail: grep, sed, awk, cut, sort, uniq and wc for slicing data and logs.
    - topic: Finding things
      detail: find and xargs, and searching code with ripgrep or grep -r.
    - topic: Shell scripts
      detail: Variables, conditionals, loops, exit codes and 'set -euo pipefail'.
    - topic: Processes and jobs
      detail: ps, top, kill, background jobs and nohup.
    - topic: Remote work
      detail: ssh, keys, scp and rsync.
    - topic: PowerShell
      detail: 'The equivalents on Windows: objects in the pipeline instead of text.'
  resources:
    - resource: missing-semester
      locator: "Course Overview + Introduction to the Shell; Command-line Environment; Development Environment and Tools"
      verified: true
    - resource: tlcl
      locator: "Part 1, Learning the shell"
      why: "Free, patient and complete. Read it with a terminal open."
      verified: true
    - resource: overthewire
      locator: "Bandit, levels 0–15"
      verified: true

- id: git
  title: Git
  area: programming
  summary: Commits, branches, merging, remotes, and how to get out of trouble.
  hours: 6
  recommends: [shell-tools]
  covers:
    - topic: The model
      detail: Commits as snapshots, the staging area, and what a branch really is.
    - topic: Everyday commands
      detail: status, add, commit, log, diff, restore.
    - topic: Branching and merging
      detail: Creating branches, merging, and resolving conflicts.
    - topic: Rebasing
      detail: Rewriting your branch on top of another, and when not to.
    - topic: Remotes
      detail: clone, fetch, pull, push, and tracking branches.
    - topic: Collaboration
      detail: Pull requests, code review and keeping a clean history.
    - topic: Undoing things
      detail: revert, reset, reflog, and recovering 'lost' work.
    - topic: Good commits
      detail: Small, focused commits with messages that explain why.
  resources:
    - resource: git-cheatsheet
      locator: Keep it open while you work
