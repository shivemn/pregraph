- id: project-test-suite
  title: "Project: automate the tests for a real web app"
  area: programming
  summary: Pick an open-source web app, write end-to-end tests for its main flows, and run them in CI.
  hours: 25
  kind: project
  requires: [test-automation, ci-cd]
  brief:
    build: Pick an open-source web app with a public demo, or run one locally, and write end-to-end tests for its main flows with Playwright or Selenium, running on every push in GitHub Actions.
    shows:
    - 'Tests for the flows that matter most: sign-up, log-in, the main task, and a failure case'
    - Page objects or another structure that keeps tests readable
    - 'Stable tests: no fixed sleeps, and they pass ten runs in a row'
    - A CI run with a report, and screenshots when a test fails
    stretch:
    - API tests alongside the UI tests
    - Runs in two browsers in parallel
    present: The repo with a README listing what's covered and what isn't, and a link to a green CI run. A real bug you found and reported upstream counts for a lot.
  resources:
    - resource: playwright-docs
      locator: "Use the guides on API testing and CI as you go"
      verified: true

