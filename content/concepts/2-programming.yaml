- id: python-depth
  title: Python in depth
  area: programming
  summary: 'The parts of Python that separate scripts from software: generators, decorators, context managers, type hints, Pydantic, asyncio and packaging.'
  hours: 25
  requires: [programming-basics]
  recommends: [oop-design, testing-debugging]
  covers:
    - topic: Comprehensions
      detail: List, dict and set comprehensions, and when a loop is clearer.
