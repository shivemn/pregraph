- id: test-automation
  title: Test automation
  area: programming
  summary: Tests that drive a real browser or API, run on every change, and fail for the right reasons.
  hours: 15
  kind: tool
  requires: [testing-debugging]
  recommends: [web-http, javascript]
  covers:
    - topic: The test pyramid
      detail: Many unit tests, fewer integration tests, few end-to-end tests.
    - topic: UI automation
      detail: Locators, waits and assertions with Selenium or Playwright.
    - topic: Page objects
      detail: Keeping tests readable when the UI changes.
    - topic: API automation
      detail: Testing endpoints directly, faster and more stable than through the UI.
    - topic: Test data
      detail: Creating and cleaning up data so tests don't depend on each other.
    - topic: Flaky tests
      detail: Why tests fail randomly, and fixing them instead of re-running.
    - topic: Running in CI
      detail: Parallel runs, reports and screenshots on failure.
    - topic: BDD
      detail: Gherkin and Cucumber, and when they're worth the overhead.
  resources:
