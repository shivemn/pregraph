    build: 'Pick one classic game and build it to run in the terminal: tic-tac-toe against a simple computer player, 2048, or hangman with a word list. Keep the game rules separate from the code that prints the board and reads keys.'
    shows:
      - The rules in their own functions or class, with no printing inside them
      - 'Tests for the rules: a win, a draw, an illegal move'
      - Input checked, so a typo doesn't crash it
      - The code on GitHub with a README that says how to run it
    stretch:
      - A computer player that never loses at tic-tac-toe (minimax)
      - Save and load a game in progress
    present: A short GIF of a game being played, and the repo. Small, finished and tested beats big and half-done.
  resources:
    - resource: think-python
      locator: As a reference for functions, lists and classes while you build
      role: primary
      verified: true
    - resource: exercism
      locator: Solve a few exercises in your language first to warm up
      role: alternative
      verified: true

- id: project-build-your-own
  title: 'Project: build your own Git, Redis or interpreter'
  area: programming
  kind: project
  summary: Rebuild a well-known tool from scratch to understand how it works inside, and show it with tests and benchmarks.
  hours: 60
  requires: [programming-basics, hash-tables, testing-debugging]
  recommends: [c-and-memory, networking, interpreters]
  brief:
    build: 'Rebuild a real tool small enough to finish: a Redis server that speaks its wire protocol, a Git that can commit and show history, an interpreter for a small language, or an HTTP server. Follow a guide for the outline, then do the work yourself.'
    shows:
      - 'It works with the real client where one exists: redis-cli, git or curl'
      - Tests for each command or feature you support
      - 'A design note: the data structures and why'
      - Measured performance against the real tool, with honest numbers
    stretch:
      - Add persistence or concurrency the guide leaves out
      - Write a blog post explaining one hard part
    present: A repo with a README that lists what's supported and what isn't, the design note, and a short demo recording.
  resources:
    - resource: crafting-interpreters
      locator: The whole book, if you build an interpreter
      role: primary
      verified: true
    - resource: build-your-own-x
      locator: Pick a guide for the tool you are rebuilding
      role: alternative
      verified: true

- id: project-api-tests
  title: 'Project: an API test collection'
  area: programming
  kind: project
  summary: A Postman collection that tests a real API's endpoints, edge cases and errors, and runs from the command line.
  hours: 12
  requires: [postman]
  recommends: [rest-apis, test-automation]
  brief:
    build: 'Pick a public API with documentation, such as a demo store API, and write a Postman collection that tests its main endpoints: happy paths, bad inputs, missing auth and limits. Run it with Newman from the command line.'
    shows:
      - Tests for status codes, response bodies and response times
      - Environments and variables, with no secrets in the collection
      - 'Negative tests: bad input, missing fields, wrong auth'
      - A command-line run with a report
    stretch:
      - Run it in GitHub Actions on a schedule
      - Contract tests against the API's OpenAPI spec
    present: The exported collection in a repo, the report, and a list of any real bugs you found.
  resources:
    - resource: postman-start
      locator: Writing tests and using the collection runner
      role: primary
      verified: true
    - resource: istqb-ctfl-syllabus
      locator: Chapter 4, Test Analysis and Design, for choosing test cases
      role: alternative
      verified: true

- id: project-test-platform
  title: 'Project: a full test framework with CI'
  area: programming
  kind: project
  summary: UI, API and performance tests for one app, in one framework, running in CI with reports and flaky-test tracking.
  hours: 50
  requires: [test-automation, ci-cd]
  recommends: [postman, docker]
  brief:
    build: 'Build a test framework for a real open-source app: UI tests with Playwright or Selenium, API tests, and a performance test with k6 or JMeter. Run everything in CI on every pull request, in parallel, with reports.'
    shows:
      - One framework that runs UI, API and performance tests
      - Parallel runs, and tests that clean up after themselves
      - Test data created through the API, not clicked through the UI
      - Reports with screenshots and traces, and flaky tests tracked over time
      - Performance results against a target you set
    stretch:
      - Run in two browsers and a mobile viewport
      - Containers for the app and the tests, so anyone can run them
    present: The repo, a link to a CI run, and a page on how you decided what to test at which level.
  resources:
    - resource: playwright-docs
      locator: Fixtures, parallelism, the trace viewer and CI
      role: primary
      verified: true
    - resource: swe-at-google
      locator: Chapter 14, Larger Testing
      role: alternative
      verified: true

- id: regex
  title: Regular expressions
  area: programming
  kind: tool
  summary: 'Patterns for finding, checking and pulling apart text: log lines, form inputs, data cleaning and search-and-replace.'
  hours: 6
  requires: [programming-basics]
  recommends: [shell-tools]
  covers:
    - topic: Literals and character classes
      detail: Matching exact text, [abc], ranges and \d, \w, \s.
    - topic: Quantifiers
      detail: '*, +, ?, {n,m}, and greedy versus lazy matching.'
    - topic: Anchors and boundaries
      detail: ^, $ and \b, so a pattern matches whole words or lines.
    - topic: Groups and alternation
      detail: Capturing groups, named groups and a|b.
    - topic: Lookarounds
      detail: Matching only when something comes before or after.
    - topic: Using regex in code
      detail: Python's re, JavaScript and grep, and flags like case-insensitive.
    - topic: When not to
      detail: Why HTML, email addresses and nested structures need real parsers.
  resources:
    - resource: python-regex-howto
      locator: The whole HOWTO
      role: primary
      verified: true
    - resource: mdn-regex
      locator: The guide, if you work in JavaScript
      role: alternative
      verified: true
    - resource: regexone
      locator: All lessons, then the practice problems
      role: primary
      verified: true
    - resource: mdn-regex-cheatsheet
      locator: Keep it open while you work
      role: alternative
      verified: true

- id: vim
  title: Vim
  area: programming
  kind: tool
  summary: The editor on every server. Enough Vim to edit config files over SSH without panic, and modal editing if you want more.
  hours: 6
  requires: [shell-tools]
  covers:
    - topic: Modes
      detail: Normal, insert, visual and command-line mode, and getting back to normal with Esc.
    - topic: Saving and quitting
      detail: :w, :q, :wq and :q! without having to search the web.
    - topic: Moving
      detail: Words, lines, searching with / and jumping to line numbers.
    - topic: Editing
      detail: Delete, change, yank and put, combined with motions (dw, ci", yy).
    - topic: Undo, repeat and search-replace
      detail: u, Ctrl-R, the dot command and :%s/old/new/g.
    - topic: A minimal config
      detail: A short .vimrc with line numbers and sensible defaults.
  resources:
    - resource: missing-semester
      locator: Lecture 3, Editors (Vim)
      role: primary
      verified: true
    - resource: vim-user-manual
      locator: Chapters 1 to 4, after running vimtutor
      role: primary
      verified: true
    - resource: vim-quickref
      locator: Keep it open while you learn
      role: alternative
      verified: true

