- id: proofs
  title: Mathematical proof
  area: foundations
  summary: Direct proof, contradiction and induction, plus the habit of writing precise definitions.
  hours: 20
  resources:
    - resource: mit-6042
      locator: "Part I: Proofs"
      verified: true
    - resource: mit-6042-2010
      locator: "Lectures 1–3: proofs, induction, strong induction"
      verified: true
    - resource: mit-6042-psets
      locator: "Problem sets 1–2, on proofs and induction"
      verified: true

- id: discrete-math
  title: Discrete maths
  area: foundations
  summary: Logic, sets, relations, counting, graphs and recurrences. Most of algorithms rests on this.
  hours: 40
  requires: [proofs]
  resources:
    - resource: mit-6042
      locator: "Parts II and III: Structures, Counting"
      verified: true
    - resource: mit-6042-2010
      locator: "Lectures 4–17: number theory, graphs, relations, sums, recurrences, counting"
      verified: true
    - resource: mit-6042-psets
      locator: "Problem sets 3–9"
      verified: true
    - resource: project-euler
      locator: "Problems 1–50"
      role: alternative
      verified: true

- id: linear-algebra
  title: Linear algebra
  area: foundations
  summary: Vectors, matrices, eigenvalues and least squares. Essential for machine learning and graphics.
  hours: 40
  resources:
    - resource: mit-1806
      locator: "Video lectures, in order"
      verified: true
    - resource: mml-book
      locator: "Chapters 2–4"
      role: alternative
      verified: true
    - resource: three-blue-one-brown-la
      locator: "The whole series, before or alongside 18.06"
      role: alternative
      why: "Builds the geometric picture in about three hours."
      verified: true
    - resource: mit-1806sc
      locator: "The Check Yourself problems at the end of each session"
      why: "Every session has problems with worked solutions, so you can check yourself."
      verified: true

- id: probability
  title: Probability
  area: foundations
  summary: Random variables, conditioning, expectation and the common distributions.
  hours: 40
  recommends: [discrete-math]
  resources:
    - resource: stat110
      locator: "Lecture videos and the strategic practice sets"
      verified: true
    - resource: mit-6042
      locator: "Part IV: Probability"
      role: alternative
      verified: true
    - resource: probability-book
      locator: "Chapters 1–7"
      why: "The textbook that goes with Stat 110, free from the authors."
      verified: true
    - resource: mit-6042-psets
      locator: "Problem sets 10–12"
      role: alternative
      verified: true
    - resource: brainstellar
      locator: "The easy and medium puzzles"
      verified: true

- id: calculus
  title: Calculus
  area: foundations
  summary: Limits, derivatives, integrals and series, and what they say about change and accumulation.
  hours: 40
  resources:
    - resource: openstax-calculus
      locator: "Volumes 1 and 2"
      verified: true
    - resource: tbob-calculus
      locator: "The whole series, first, for the pictures"
      verified: true
    - resource: khan-math
      locator: "Calculus 1, then Calculus 2"
      verified: true

- id: multivariable-calculus
  title: Multivariable calculus
  area: foundations
  summary: Partial derivatives, gradients, multiple integrals and the vector calculus that optimisation and physics lean on.
  hours: 30
  requires: [calculus]
  recommends: [linear-algebra]
  resources:
    - resource: openstax-calculus
      locator: "Volume 3"
      verified: true
    - resource: mit-1802
      locator: "The whole course"
      verified: true

- id: optimization
  title: Optimisation
  area: foundations
  summary: Convex sets and functions, duality, and the algorithms that find minima, from least squares to portfolio choice.
  hours: 30
  requires: [multivariable-calculus, linear-algebra]
  resources:
    - resource: boyd-cvx
      locator: "Chapters 1–5, then the applications you need"
      verified: true
    - resource: ee364a
      locator: "The whole course"
      verified: true

- id: stochastic-processes
  title: Stochastic processes
  area: foundations
  summary: Random walks, Markov chains, Poisson processes and Brownian motion.
  hours: 25
  requires: [probability, calculus]
  resources:
    - resource: probability-book
      locator: "The chapters on Markov chains and Poisson processes"
      verified: true
    - resource: mit-18s096
      locator: "Lectures 5 and 17, Stochastic Processes I and II"
      verified: true

- id: stochastic-calculus
  title: Stochastic calculus
  area: foundations
  summary: Itô's lemma and stochastic differential equations, the maths under option pricing and interest-rate models.
  hours: 30
  requires: [stochastic-processes, multivariable-calculus]
  resources:
    - resource: mit-18s096
      locator: "Lectures 18 and 21: Itô calculus, stochastic differential equations"
      verified: true

- id: real-analysis
  title: Real analysis
