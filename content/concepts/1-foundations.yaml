  resources:
    - resource: mit-6042
      locator: "Parts II and III: Structures, Counting"
    - resource: mit-6042-2010
      locator: "Lectures 4–17: number theory, graphs, relations, sums, recurrences, counting"
      verified: true
    - resource: mit-6042-psets
      locator: "Problem sets 3–9"
      verified: true

- id: linear-algebra
  title: Linear algebra
  area: foundations
  summary: Vectors, matrices, eigenvalues and least squares. Essential for machine learning and graphics.
  hours: 40
  resources:
    - resource: mit-1806
      locator: "Video lectures, in order"
    - resource: mml-book
      locator: "Chapters 2–4"
      role: alternative
    - resource: three-blue-one-brown-la
      locator: "The whole series, before or alongside 18.06"
