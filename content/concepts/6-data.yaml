- id: project-dbt-models
  title: 'Project: model a business''s data with dbt'
  area: data
  kind: project
  summary: Raw tables turned into tested, documented models that a dashboard can sit on.
  hours: 25
  requires: [dbt, sql]
  recommends: [data-warehousing, testing-debugging]
  brief:
    build: Load a realistic dataset with orders, customers and products (the dbt quickstart's data or a public e-commerce dataset) into a warehouse, and build staging, intermediate and mart models in dbt.
    shows:
    - 'Layers with clear names: staging, intermediate, marts'
    - Tests on keys and relationships, plus one custom test
    - Docs and the lineage graph
    - A fact table and dimensions a dashboard could use
    stretch:
    - Incremental models for the biggest table
    - CI that runs dbt build on every pull request
    present: The repo, the generated docs site, and one dashboard or query built on your marts.
  resources:
    - resource: dbt-guides
      locator: The quickstart for your warehouse, then grow its project into your own
      role: primary
      verified: true
    - resource: kimball
      locator: The fact table and dimension table techniques, for the shape of your marts
      role: alternative
      verified: true

- id: project-sales-dashboard
  title: 'Project: build a sales dashboard'
