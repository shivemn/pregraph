      role: primary
      verified: true

- id: project-sql-etl
  title: 'Project: load and model a dataset in Postgres'
  area: data
  kind: project
  summary: A public dataset loaded into PostgreSQL, cleaned, split into proper tables and queried.
  hours: 10
  requires: [sql]
  recommends: [programming-basics, data-warehousing]
  brief:
    build: Pick a public dataset in CSV, load it into PostgreSQL with a script you can re-run, split it into well-designed tables with keys, and write ten queries that answer real questions.
    shows:
      - A schema with primary and foreign keys, and the reasons for it
      - A load script you can run twice without duplicating data
      - Constraints that catch bad data
      - Ten queries, including joins, grouping and window functions
    stretch:
      - Indexes, with before-and-after timings
      - A small Python script that pulls fresh data daily
    present: The repo with the schema diagram, the scripts and the queries with their results.
  resources:
    - resource: postgres-tutorial
      locator: The whole tutorial, then the chapters on data definition
      role: primary
      verified: true
    - resource: pgexercises
      locator: Every section, as practice for your queries
      role: alternative
      verified: true

- id: project-streaming-pipeline
  title: 'Project: a streaming data pipeline'
  area: data
  kind: project
  summary: Events flowing through Kafka into a lakehouse in near real time, with data-quality checks and a live dashboard.
  hours: 60
  requires: [spark, messaging, data-warehousing]
  recommends: [orchestration, docker, infrastructure-as-code]
  brief:
    build: Produce a realistic stream of events, such as ride requests, payments or sensor readings, into Kafka. Process it with Spark Structured Streaming or Flink, land it in a lakehouse table format, and serve a dashboard that updates every minute.
    shows:
      - Kafka topics with partitions and keys you can justify
      - Streaming jobs with windows, late data and checkpoints
      - Exactly-once or idempotent writes, and how you tested them
      - Data-quality checks with alerts
      - Everything started with one command, such as Docker Compose
    stretch:
      - Change data capture from a Postgres database
      - Backfill and replay from Kafka
    present: An architecture diagram, a short demo video and a write-up of the failure cases you tested.
  resources:
    - resource: spark-docs
      locator: The Structured Streaming programming guide
      role: primary
      verified: true
    - resource: kafka-docs
      locator: Introduction, Design, then the Streams and Connect sections
      role: alternative
      verified: true
    - resource: de-zoomcamp
      locator: The streaming module
      role: alternative
      verified: true

- id: scala
  title: Scala
  area: data
  kind: tool
  summary: The JVM language Spark is written in, still common in data engineering teams. Functional and object-oriented at once.
  hours: 15
  requires: [programming-basics]
  recommends: [java, spark, higher-order-programming]
  covers:
    - topic: Basics
      detail: val and var, types, functions and expressions.
    - topic: Case classes and pattern matching
      detail: Modelling data and matching on its shape.
    - topic: Collections
      detail: Immutable collections with map, filter, fold and flatMap.
    - topic: Option and Either
      detail: Handling missing values and errors without nulls.
    - topic: Traits
      detail: Sharing behaviour between classes.
    - topic: Scala for Spark
      detail: Datasets and DataFrames in Scala, and when teams choose it over Python.
  resources:
    - resource: scala-tour
      locator: The whole tour
      role: primary
      verified: true
    - resource: scala3-book
      locator: The chapters on domain modelling and collections
      role: alternative
      verified: true
