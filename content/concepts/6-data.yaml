- id: database-internals
  title: How databases work
  area: data
  summary: Storage, indexes, query plans, transactions and recovery.
  hours: 40
  requires: [sql, trees-heaps, hash-tables]
  recommends: [file-systems, concurrency]
  covers:
    - topic: Storage
      detail: Pages, heap files and how rows are laid out on disk.
    - topic: Buffer pool
      detail: Caching pages in memory, and eviction.
    - topic: B+ tree indexes
      detail: How they stay balanced, and why they suit range queries.
    - topic: Hash and LSM indexes
      detail: Hash indexes for lookups, and LSM trees (used by Cassandra and RocksDB) for heavy writes.
    - topic: Query processing
      detail: Parsing, planning, join algorithms and reading an EXPLAIN plan.
    - topic: Transactions and ACID
      detail: Atomicity, consistency, isolation and durability, and what each costs.
    - topic: Isolation levels
      detail: Read committed, repeatable read and serializable, and the anomalies each allows.
    - topic: Concurrency control
      detail: Two-phase locking and MVCC.
    - topic: Recovery
      detail: Write-ahead logging, checkpoints, and recovering after a crash.
  resources:
    - resource: cmu-15445
      locator: "The full lecture series"
      verified: true
    - resource: db-architecture
      locator: "The whole paper"
      why: "How a real database is put together, by people who built them."
      verified: true
    - resource: nptel-dbms
      locator: "The full course"
      role: alternative
      verified: true
    - resource: bustub
      locator: "The course projects: buffer pool, B+ tree index, query execution"
      verified: true

