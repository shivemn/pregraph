- id: sql
  title: SQL
  area: data
  summary: Querying, joining and aggregating tables. The most useful language you'll learn in a weekend.
  hours: 10
  recommends: [discrete-math]
  resources:
    - resource: sqlbolt
      locator: "All lessons"
    - resource: cs50x
      locator: "Week 7, SQL"
      verified: true
      role: alternative
    - resource: postgres-tutorial
      locator: "Part I, Tutorial"
    - resource: kaggle-learn
      locator: "Intro to SQL, then Advanced SQL"
      verified: true
    - resource: leetcode-sql50
      locator: "SQL 50, every section"
      role: alternative
      verified: true
    - resource: pgexercises
      locator: "Every section, in order"
      role: alternative
      verified: true

- id: database-internals
  title: How databases work
  area: data
  summary: Storage, indexes, query plans, transactions and recovery.
  hours: 40
  requires: [sql, trees-heaps, hash-tables]
  recommends: [file-systems, concurrency]
  resources:
    - resource: cmu-15445
      locator: "The full lecture series"
    - resource: db-architecture
      locator: "The whole paper"
      why: "How a real database is put together, by people who built them."
    - resource: nptel-dbms
      locator: "The full course"
      role: alternative
    - resource: bustub
      locator: "The course projects: buffer pool, B+ tree index, query execution"

- id: statistics
  title: Statistics
  area: data
  summary: Summarising data, sampling, confidence intervals, hypothesis tests and regression, and how each one gets misused.
  hours: 30
  recommends: [probability]
  resources:
    - resource: openintro
      locator: "Chapters 1–9"
    - resource: khan-statistics
      locator: "Units on study design through inference for regression"
    - resource: khan-math
      locator: "Statistics and probability"

- id: spreadsheets
