- id: project-analytics-case
  title: 'Project: a full analytics case study'
  area: data
  kind: project
  summary: 'A business question answered end to end: SQL on many tables, a dashboard, an experiment readout and recommendations.'
  hours: 50
  requires: [sql, bi-tools, statistics]
  recommends: [experiments, pandas]
  brief:
    build: 'Take a realistic multi-table dataset, such as an e-commerce or ride-hailing dataset with orders, users and events, and run the analysis a company would ask a senior analyst for: metric definitions, a dashboard, a deep dive into one drop, and an A/B test readout.'
    shows:
      - Metric definitions written down, with the SQL behind each
      - A dashboard someone else could use without you
      - A deep dive that explains a change with evidence
      - 'An experiment analysed properly: sample size, significance and what to ship'
      - Recommendations ranked by value
    stretch:
      - Automate the refresh
      - A cohort or retention analysis
    present: A short deck for a manager, the dashboard, and the SQL in a repo.
  resources:
    - resource: datalemur
      locator: The SQL questions, to sharpen the queries you will need
      role: alternative
