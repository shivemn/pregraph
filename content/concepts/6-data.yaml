- id: redis
  title: Redis
  area: data
  kind: tool
  summary: An in-memory data store used for caching, sessions, rate limits, leaderboards and simple queues.
  hours: 8
  requires: [programming-basics]
  recommends: [hash-tables, sql]
  covers:
    - topic: Data types
      detail: Strings, hashes, lists, sets, sorted sets and streams, and a use for each.
    - topic: Caching
      detail: TTLs, eviction policies and the cache-aside pattern.
    - topic: Counters and rate limits
      detail: INCR with expiry, and sliding-window limits with sorted sets.
    - topic: Leaderboards
      detail: Sorted sets for rankings with fast updates.
    - topic: Sessions and locks
      detail: Storing sessions, and simple locks with SET NX and an expiry.
    - topic: Pub/sub and streams
      detail: Fire-and-forget messages versus streams with consumer groups.
    - topic: Persistence
      detail: RDB snapshots versus append-only files, and what you can lose.
    - topic: Scaling
      detail: Replication, Sentinel for failover, and Redis Cluster for sharding.
  resources:
    - resource: redis-data-types
      locator: "Strings, Hashes, Lists, Sets, Sorted sets and Streams"
      verified: true
    - resource: wds-redis
      locator: "The whole video"
      verified: true

