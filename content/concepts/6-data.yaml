- id: sql
  title: SQL
  area: data
  summary: Querying, joining and aggregating tables. The most useful language you'll learn in a weekend.
  hours: 10
  recommends: [discrete-math]
  resources:
    - resource: sqlbolt
      locator: "All lessons"
    - resource: cs50x
      locator: "Week 7, SQL"
      role: alternative
    - resource: postgres-tutorial
      locator: "Part I, Tutorial"
    - resource: kaggle-learn
      locator: "Intro to SQL, then Advanced SQL"

- id: database-internals
  title: How databases work
  area: data
  summary: Storage, indexes, query plans, transactions and recovery.
  hours: 40
  requires: [sql, trees-heaps, hash-tables]
  recommends: [file-systems, concurrency]
  resources:
    - resource: cmu-15445
      locator: "The full lecture series"
    - resource: db-architecture
      locator: "The whole paper"
      why: "How a real database is put together, by people who built them."
    - resource: nptel-dbms
      locator: "The full course"
      role: alternative

- id: statistics
  title: Statistics
  area: data
  summary: Summarising data, sampling, confidence intervals, hypothesis tests and regression, and how each one gets misused.
  hours: 30
  recommends: [probability]
  resources:
    - resource: openintro
      locator: "Chapters 1–9"
    - resource: khan-statistics
      locator: "Units on study design through inference for regression"

- id: spreadsheets
  title: Spreadsheets
  area: data
  summary: Formulas, lookups, pivot tables and charts. Still where most business data gets looked at first.
  hours: 10
  kind: tool
  resources:
    - resource: gcf-excel
      locator: "Formulas and functions, then the data analysis lessons"

- id: pandas
  title: Data wrangling with pandas
  area: data
  summary: Loading, cleaning, joining, reshaping and summarising tables in Python.
  hours: 25
  kind: tool
  requires: [programming-basics]
  resources:
    - resource: py4da
      locator: "Chapters 4–10"
    - resource: kaggle-learn
      locator: "Pandas course"

- id: data-visualization
  title: Data visualisation
  area: data
  summary: Choosing the right chart, and the small decisions that make a chart honest and readable.
  hours: 12
  recommends: [statistics]
  resources:
    - resource: dataviz-wilke
      locator: "Parts I and II"
    - resource: py4da
      locator: "Chapter 9, Plotting and visualization"
      role: alternative
    - resource: kaggle-learn
      locator: "Data Visualization course"

- id: bi-tools
  title: Dashboards and BI tools
  area: data
  summary: Building dashboards other people use to make decisions, in tools like Power BI.
  hours: 15
  kind: tool
  requires: [sql]
  recommends: [data-visualization, spreadsheets]
  resources:
    - resource: powerbi-learn
      locator: "The data analyst learning paths"

- id: data-warehousing
  title: Data modelling for analytics
  area: data
  summary: Fact and dimension tables, star schemas and slowly changing dimensions. How warehouses are organised.
  hours: 15
  requires: [sql]
  recommends: [database-internals]
  resources:
    - resource: kimball
      locator: "Fundamental concepts, then fact and dimension table techniques"
    - resource: de-zoomcamp
      locator: "Module on data warehousing"

- id: spark
  title: Large-scale processing with Spark
  area: data
  summary: Processing data that doesn't fit on one machine, with DataFrames that look a lot like pandas.
  hours: 20
  kind: tool
  requires: [pandas, sql]
  resources:
    - resource: spark-docs
      locator: "Quick start, then the SQL and DataFrames guide"
    - resource: de-zoomcamp
      locator: "Module on batch processing"
      role: alternative

- id: orchestration
  title: Pipelines and scheduling
  area: data
  summary: Running data jobs in the right order, on a schedule, with retries when they fail.
  hours: 10
  kind: tool
  requires: [programming-basics]
  recommends: [sql]
  resources:
    - resource: airflow-docs
      locator: "Fundamental concepts, then Working with TaskFlow"
    - resource: de-zoomcamp
      locator: "Module on workflow orchestration"
      role: alternative

- id: project-data-analysis
  title: "Project: analyse a public dataset"
  area: data
  summary: Pick a question, find data that answers it, clean it, analyse it, and publish what you found with charts.
  hours: 25
  kind: project
  requires: [pandas, data-visualization]
  recommends: [sql, statistics]
  resources:
    - resource: kaggle-datasets
      locator: "Pick a dataset with a question you care about"
    - resource: py4da
      locator: "Chapter 13, Data analysis examples"
      role: alternative

- id: project-data-pipeline
  title: "Project: build a data pipeline"
  area: data
  summary: Pull data from a public source on a schedule, load it into a warehouse and model it for analysis.
  hours: 35
  kind: project
  requires: [data-warehousing, pandas]
  recommends: [orchestration, spark]
  resources:
    - resource: de-zoomcamp
      locator: "Follow the course project brief"

- id: experiments
  title: Experiments and causal inference
  area: data
  summary: A/B tests, why correlation isn't enough, and the tools for estimating cause and effect when you can't run an experiment.
  hours: 25
  requires: [statistics]
  recommends: [probability]
  resources:
    - resource: causal-handbook
      locator: "Part I, chapters 1–12"
      why: "Practical, funny and written in Python."

- id: feature-engineering
  title: Feature engineering
  area: data
  summary: Turning raw columns into inputs a model can use. Encoding, scaling, missing values and leakage.
  hours: 12
  requires: [pandas]
  recommends: [machine-learning]
  resources:
    - resource: feat-engineering
      locator: "Chapters 1–8"
    - resource: kaggle-learn
      locator: "Feature Engineering course"

- id: project-data-science
  title: "Project: answer a business question with data and a model"
  area: data
  summary: Frame a question, explore the data, build a model or run an analysis, and explain the result to someone who isn't technical.
  hours: 35
  kind: project
  requires: [machine-learning, data-visualization]
  recommends: [experiments, feature-engineering]
  resources:
    - resource: kaggle-datasets
      locator: "Pick a dataset with a decision attached to it"
