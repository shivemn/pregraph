- id: sql
  title: SQL
  area: data
  summary: Querying, joining and aggregating tables. The most useful language you'll learn in a weekend.
  hours: 10
  recommends: [discrete-math]
  covers:
    - topic: SELECT basics
      detail: Filtering, sorting and limiting rows.
    - topic: Joins
      detail: Inner, left and full joins, and getting the join condition right.
    - topic: Aggregation
      detail: GROUP BY, HAVING and aggregate functions.
    - topic: Subqueries and CTEs
      detail: Breaking a query into readable steps.
    - topic: Window functions
      detail: Running totals, ranks and comparing rows with their neighbours.
    - topic: NULLs
      detail: Three-valued logic and the bugs it causes.
    - topic: Changing data
      detail: INSERT, UPDATE, DELETE and transactions.
    - topic: Schema design
      detail: Keys, constraints and normalisation.
    - topic: Indexes
      detail: What they speed up and what they cost.
