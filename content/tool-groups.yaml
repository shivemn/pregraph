# The tools page. Each group is a shelf; order here is the order on the page.
# A "tool" is anything people come to learn on its own: a language, a
# database, a framework. Any concept can go on a shelf.

- id: languages
  title: Languages
  tools: [programming-basics, java, javascript, typescript, csharp, go, cpp, c-and-memory, rust, kotlin, swift, php, r-lang]

- id: web
  title: Web frameworks
  tools: [react, angular, vue, nextjs, spring-boot, nodejs, django, fastapi, aspnet-core]

- id: mobile
  title: Mobile
  tools: [android, flutter, react-native]

- id: ml
  title: Data science and machine learning libraries
  tools: [pandas, scikit-learn, pytorch, tensorflow, hugging-face]

- id: databases
  title: Databases, search and streaming
  tools: [sql, redis, mongodb, elasticsearch, messaging]

- id: data
  title: Spreadsheets, BI and data engineering
  tools: [spreadsheets, bi-tools, tableau, dbt, snowflake, databricks, spark, orchestration]

- id: devops
  title: Developer tools and DevOps
  tools: [git, shell-tools, linux-admin, docker, kubernetes, ci-cd, jenkins, ansible, nginx, observability]

- id: cloud
  title: Cloud
  tools: [cloud-basics, azure, gcp, infrastructure-as-code]

- id: hosting
  title: Hosting and deployment (free tiers)
  tools: [github-pages, cloudflare, vercel, netlify, render, neon, supabase, firebase]

- id: testing
  title: Testing
  tools: [test-automation, selenium, postman, junit, pytest]

- id: security
  title: Security
  tools: [wireshark, nmap, burp-suite, splunk]

- id: workplace
  title: Workplace platforms
  tools: [jira, figma, salesforce, servicenow]
