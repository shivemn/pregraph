- id: data-analyst
  title: Data analyst
  family: data
  summary: Turns business questions into queries, numbers and charts that someone can act on.
  tiers:
    hire: [spreadsheets, sql, programming-basics, pandas, bi-tools, data-visualization, statistics, project-data-analysis]
    firstYear: [data-warehousing, probability, git]
    extra: [machine-learning]
  evidence:
    postings: 30
    region: India, entry level
    collected: 2026-11
    note: "Power BI or Tableau (90%) and SQL (87%) lead, then dashboards (73%), Python (70%) and Excel (63%), so Python and a BI tool are now on the hiring list. Statistics (27%) stays: interviews ask it even when listings don't."
  search: data analyst
  posting:
    source: Naukri
    listings: 40
    collected: 2026-11
    method: "The first 40 listings for \"data analyst\" with 0 years' experience, India."
    tagged: 38
    titles: [Data analyst, Junior data analyst, Data analyst (apprentice), Data governance analyst]
    experience: "Most ask for 0–1 or 0–3 years. This is one of the most common first jobs for freshers from any degree."
    doing:
      - Pull data with SQL, clean it and check that it's right.
      - Build and keep up dashboards and regular reports, usually in Power BI or Excel.
      - Answer questions from managers with numbers and a short explanation.
      - Spot problems in data quality and get them fixed at the source.
    asks:
      - { skill: "Python", listings: 17 }
      - { skill: "SQL", listings: 16 }
      - { skill: "Power BI or other BI tools", listings: 14 }
      - { skill: "Data cleaning and validation", listings: 10 }
      - { skill: "Dashboards and reporting", listings: 7 }
      - { skill: "Cloud (AWS, Azure)", listings: 7 }
      - { skill: "Excel and Google Sheets", listings: 5 }
      - { skill: "Machine learning", listings: 5 }
