# Roles and what they need, in three tiers. These lists are drafts until each
# role has an `evidence` block from real job postings (see docs/ROLES.md).

- id: software-engineer
  title: Software engineer (SDE)
  family: software
  summary: Writes and maintains the code behind products. Entry-level hiring in India mostly tests data structures and algorithms first, then how you write and reason about code.
  tiers:
    hire: [programming-basics, oop-design, git, linear-structures, hash-tables, trees-heaps, sorting-searching, graph-algorithms, dynamic-programming, algorithm-practice, sql, testing-debugging, project-software]
    firstYear: [rest-apis, web-http, cloud-basics, os-processes-memory, networking, system-design, software-engineering]
    extra: [concurrency, ci-cd, distributed-systems, database-internals, docker, project-portfolio-api]
  evidence:
    postings: 30
    region: India, entry level
    collected: 2026-11
    note: "Listings split by language (JavaScript 40%, Java 30%, C++ 30%), so the route lets you pick one. Data structures and algorithms stay on the hiring list though few listings name them: SDE interviews test them first."
  search: software engineer fresher
  posting:
    source: Naukri
    listings: 40
    collected: 2026-11
    method: "The first 40 listings for \"software engineer\" with 0 years' experience, India."
    tagged: 40
    titles: [Software engineer, Graduate software engineer, AI software engineer, Software engineer (fresher)]
    experience: "Most say 0–5 years or 0–1 year. Large companies (Capgemini, Cisco, Qualcomm, Google) post one opening for a wide range of experience."
    doing:
      - Write and fix code for one part of a larger product, usually in a team with a senior reviewing your work.
      - Read existing code, find bugs and fix them. Freshers spend more time here than writing new code.
      - Write tests, use Git and code review, and follow the team's process (often Agile).
      - "At product and chip companies, work closer to the system: C++, Linux, embedded or performance work."
    asks:
      - { skill: "JavaScript and web basics", listings: 12 }
      - { skill: "C++", listings: 8 }
      - { skill: "Machine learning and AI", listings: 8 }
      - { skill: "SQL and databases", listings: 6 }
      - { skill: "Docker and cloud", listings: 6 }
      - { skill: "C# and .NET", listings: 5 }
      - { skill: "Embedded systems", listings: 5 }
      - { skill: "Git and version control", listings: 5 }
  reference: { title: "Software Developers (O*NET 15-1252.00)", url: "https://www.onetonline.org/link/summary/15-1252.00" }


- id: backend-engineer
  title: Backend engineer
  family: software
  summary: Builds the services, APIs and data storage behind an app. Most of the job is correctness, performance and keeping things running.
  tiers:
    hire: [java, oop-design, git, sql, rest-apis, backend-framework, hash-tables, trees-heaps, algorithm-practice, testing-debugging, project-portfolio-api]
    firstYear: [mongodb, cloud-basics, database-internals, concurrency, docker, shell-tools]
    extra: [system-design, ci-cd, web-security, messaging, distributed-systems, kubernetes, observability, redis]
  evidence:
    postings: 30
    region: India, entry level
    collected: 2026-11
    note: "SQL (87%), APIs (70%), a framework and Git lead. Half the listings want Java and half Python or Node, which have their own job titles. OOP and data structures stay on the list because interviews test them."
  search: backend developer
  posting:
    source: Naukri
    listings: 40
    collected: 2026-11
    method: "The first 40 listings for \"backend developer\" with 0 years' experience, India."
    tagged: 37
    titles: [Backend developer, Junior backend developer, Backend developer intern, Java backend developer, Node.js backend developer]
    experience: "24 of 40 ask for 0–2 years or less. Most of the rest say 0–3 to 0–5 years."
    doing:
      - Build the APIs an app or website calls, and the code behind them.
      - Design database tables and write the queries that read and write them.
      - Debug problems in a running system, from a slow query to a failed request.
      - Agree with frontend and mobile developers on what each API takes and returns.
      - Write tests and work in Git with code review.
    asks:
      - { skill: "SQL and databases (MySQL, PostgreSQL, MongoDB)", listings: 22 }
      - { skill: "Web basics (HTML, CSS, JavaScript, jQuery)", listings: 11 }
      - { skill: "Python (Django, Flask)", listings: 10 }
      - { skill: "JavaScript or Node.js", listings: 9 }
      - { skill: "REST APIs", listings: 8 }
      - { skill: "Git and version control", listings: 8 }
      - { skill: "Java and Spring", listings: 7 }
      - { skill: "Debugging and testing", listings: 6 }
  reference: { title: "Software Developers (O*NET 15-1252.00)", url: "https://www.onetonline.org/link/summary/15-1252.00" }


