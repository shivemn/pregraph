# Hardware
- id: verification-engineer
  title: "Design verification engineer"
  extends: vlsi-engineer
  summary: "Writes the SystemVerilog and UVM testbenches that prove a chip design works. The biggest share of VLSI fresher hiring in India."
- id: rtl-design-engineer
  title: "RTL design engineer"
  extends: vlsi-engineer
  summary: "Writes the Verilog for a chip's blocks to a specification and hands it to verification and physical design."
- id: asic-design-engineer
  title: "ASIC design engineer"
  extends: vlsi-engineer
  adds: [asic-flow]
  summary: "Designs custom chips from RTL through synthesis and timing, working with the verification and layout teams."
- id: physical-design-engineer
