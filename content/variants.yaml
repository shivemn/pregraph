- id: electronics-engineer
  title: "Electronics engineer"
  extends: embedded-engineer
  adds: [analog-electronics, circuit-analysis]
  summary: "Tests, repairs and improves electronic products and the equipment that makes them."
- id: avionics-engineer
  title: "Avionics engineer"
  extends: embedded-engineer
  adds: [communication-systems]
  summary: "Works on the electronics in aircraft and drones: navigation, communication and flight-control systems, under strict safety rules."
- id: post-silicon-validation-engineer
  title: "Post-silicon validation engineer"
  extends: vlsi-engineer
  drops: [design-verification]
  adds: [c-and-memory, programming-basics]
  summary: "Tests real chips once they come back from the factory, with lab equipment and scripts, to find what simulation missed."

# Business, consulting and marketing
- id: associate-consultant
  title: "Associate consultant"
  extends: management-consultant
  summary: "The usual graduate title at consulting firms: research, analysis and slides for client projects, under a manager."
- id: business-consultant
  title: "Business consultant"
  extends: management-consultant
  adds: [business-processes]
  summary: "Advises clients on processes and operations, often alongside a technology rollout."
- id: strategy-analyst
  title: "Strategy analyst"
  extends: management-consultant
  summary: "Works in a company's own strategy team on market sizing, competitors and new business plans."
- id: consulting-analyst
  title: "Consulting analyst"
  extends: management-consultant
  summary: "Builds the analysis behind consulting projects: data gathering, models in Excel and the charts that go into the deck."
- id: management-trainee
  title: "Management trainee"
  extends: management-consultant
  drops: [corporate-finance]
  summary: "A rotation programme at large companies that moves graduates through sales, operations and finance before placing them."
- id: digital-marketing-analyst
  title: "Digital marketing analyst"
  extends: marketing-analyst
  adds: [digital-marketing]
  summary: "Measures ad and campaign performance across search, social and email, and moves budget to what works."
- id: performance-marketing-analyst
  title: "Performance marketing analyst"
  extends: marketing-analyst
  adds: [digital-marketing]
  summary: "Runs and tunes paid ads on Google and Meta against targets like cost per sale, testing creatives and audiences."
- id: growth-analyst
  title: "Growth analyst"
  extends: marketing-analyst
  adds: [pandas]
  summary: "Finds what makes users sign up, stay and pay at a startup, and tests ideas to improve each step."
- id: crm-analyst
  title: "CRM analyst"
  extends: marketing-analyst
  adds: [digital-marketing]
  summary: "Plans email, SMS and app campaigns to existing customers and measures what brings them back."
- id: web-analyst
  title: "Web analyst"
  extends: marketing-analyst
  adds: [html-css]
  summary: "Sets up website tracking, keeps the data clean and reports how people use the site."
- id: campaign-analyst
  title: "Campaign analyst"
  extends: marketing-analyst
  summary: "Sets up, tracks and reports on marketing campaigns, and works out which ones paid off."
- id: seo-analyst
  title: "SEO analyst"
  extends: digital-marketing-executive
  adds: [html-css]
  summary: "Gets a site to rank higher in search: keywords, content, technical fixes and links, measured month by month."
- id: seo-executive
  title: "SEO executive"
  extends: digital-marketing-executive
  adds: [html-css]
  summary: "Does the day-to-day SEO work on a site: keyword research, page changes and reports."
- id: social-media-executive
  title: "Social media executive"
  extends: digital-marketing-executive
  drops: [web-analytics]
  summary: "Plans and posts a brand's social content, replies to people, and reports what grew."
- id: content-marketing-executive
  title: "Content marketing executive"
  extends: digital-marketing-executive
  summary: "Writes and plans blogs, emails and social posts that bring in customers, and tracks which ones do."
- id: email-marketing-executive
  title: "Email marketing executive"
  extends: digital-marketing-executive
  summary: "Builds and sends email campaigns, manages lists, and tests subject lines and timing."
- id: marketing-executive
  title: "Marketing executive"
  extends: digital-marketing-executive
  summary: "Helps run a brand's marketing, online and offline, from campaigns and events to reports."
- id: brand-executive
  title: "Brand executive"
  extends: digital-marketing-executive
  drops: [web-analytics]
  summary: "Supports a brand manager on campaigns, packaging, agencies and market research."
- id: hr-executive
  title: "HR executive"
  extends: hr-analyst
  drops: [statistics, bi-tools]
  summary: "Handles day-to-day HR: onboarding, records, attendance, payroll inputs and employee questions."
- id: hr-generalist
  title: "HR generalist"
  extends: hr-analyst
  drops: [bi-tools]
  summary: "Covers a bit of everything in HR for a team or site: hiring, policies, performance reviews and employee relations."
- id: talent-acquisition-executive
  title: "Talent acquisition executive"
  extends: hr-analyst
  drops: [statistics, bi-tools]
  summary: "Finds and screens candidates, schedules interviews and tracks hiring numbers. A common first HR job."
- id: payroll-executive
  title: "Payroll executive"
  extends: hr-analyst
  adds: [accounting]
  drops: [bi-tools]
  summary: "Runs monthly payroll: attendance, deductions, PF, ESI and TDS, and the reports that go with it."
- id: business-operations-analyst
  title: "Business operations analyst"
  extends: operations-analyst
  summary: "Tracks a business's key numbers and runs the reviews and fixes that keep them on target."
- id: operations-executive
  title: "Operations executive"
  extends: operations-analyst
  drops: [sql]
  summary: "Keeps daily operations running, like orders, vendors and deliveries, and reports on them in Excel."
- id: process-excellence-analyst
  title: "Process excellence analyst"
  extends: operations-analyst
  summary: "Runs Lean and Six Sigma projects that cut errors, waiting and cost in a company's processes."
- id: mis-executive
  title: "MIS executive"
  extends: operations-analyst
  drops: [process-improvement, statistics]
  summary: "Builds and sends the daily, weekly and monthly reports a business runs on, mostly in Excel."
- id: mis-analyst
  title: "MIS analyst"
  extends: operations-analyst
  drops: [process-improvement]
  summary: "Owns a team's reporting: pulls data, automates reports and dashboards, and answers questions from them."
- id: revenue-operations-analyst
  title: "Revenue operations analyst"
  extends: sales-operations-analyst
  adds: [marketing-fundamentals]
  summary: "Joins up sales, marketing and customer data so the whole funnel from lead to renewal can be measured."
- id: sales-analyst
  title: "Sales analyst"
  extends: sales-operations-analyst
  adds: [statistics]
  summary: "Reports and forecasts sales by region, product and rep, and explains why numbers moved."
- id: marketing-operations-analyst
  title: "Marketing operations analyst"
  extends: sales-operations-analyst
  adds: [web-analytics, marketing-fundamentals]
  summary: "Runs the tools and data behind marketing, like campaign tracking, lead scoring and reports."
