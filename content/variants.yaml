# Job titles that are a route plus a few specific skills. Each one gets its
# own role page, planner and job searches. Its route is the one it `extends`,
# with `adds` put on the hiring list and `drops` taken off every tier.
# Titles are ones Indian employers actually post; keep summaries to what the
# job is, in one or two sentences.

# Software: backend
- id: java-developer
  title: "Java developer"
  extends: backend-engineer
  adds: [spring-boot]
  summary: "Builds server-side applications in Java, usually with Spring Boot. The most common developer opening in Indian IT services and banks."
- id: spring-boot-developer
  title: "Spring Boot developer"
  extends: backend-engineer
  adds: [spring-boot, messaging]
  summary: "Builds REST services and microservices on Spring Boot, the default Java framework for new backend work."
- id: python-developer
  title: "Python developer"
  extends: backend-engineer
  drops: [java]
  adds: [programming-basics, django]
  summary: "Writes backend services, scripts and automation in Python, most often with Django or FastAPI."
- id: django-developer
  title: "Django developer"
  extends: backend-engineer
  drops: [java]
  adds: [programming-basics, django]
  summary: "Builds web applications and APIs on Django, Python's batteries-included framework."
- id: fastapi-developer
  title: "FastAPI developer"
  extends: backend-engineer
  drops: [java]
  adds: [programming-basics, fastapi]
  summary: "Builds fast, typed Python APIs with FastAPI, common at startups and for serving ML models."
- id: nodejs-developer
  title: "Node.js developer"
  extends: backend-engineer
  drops: [java]
  adds: [javascript, nodejs, typescript]
  summary: "Writes backend services in JavaScript or TypeScript on Node.js, often alongside a React frontend."
- id: php-developer
  title: "PHP developer"
  extends: backend-engineer
  drops: [java]
  adds: [php, html-css]
  summary: "Builds and maintains websites and web applications in PHP, from WordPress sites to Laravel apps."
- id: dotnet-developer
  title: ".NET developer"
  extends: backend-engineer
  drops: [java]
  adds: [csharp, aspnet-core]
  summary: "Builds business applications and APIs in C# on .NET, common in enterprise IT and product companies."
- id: csharp-developer
  title: "C# developer"
  extends: backend-engineer
  drops: [java]
  adds: [csharp, aspnet-core]
  search: "c# developer"
  summary: "Writes applications in C#, mostly web APIs on ASP.NET Core and Windows or enterprise software."
- id: golang-developer
  title: "Go developer"
  extends: backend-engineer
  drops: [java]
  adds: [go, concurrency]
  search: "golang developer"
  summary: "Builds fast backend services and infrastructure tools in Go, popular at fintechs and cloud companies."
- id: rust-developer
  title: "Rust developer"
  extends: backend-engineer
  drops: [java]
  adds: [rust, concurrency]
  summary: "Writes performance-critical and safe systems code in Rust, in blockchain, infrastructure and systems companies."
- id: api-developer
  title: "API developer"
  extends: backend-engineer
  adds: [web-security, testing-debugging]
  summary: "Designs, builds and documents the APIs other teams and partners call."
- id: microservices-developer
  title: "Microservices developer"
  extends: backend-engineer
  adds: [spring-boot, docker, messaging, distributed-systems]
  summary: "Builds systems as many small services that talk over APIs and queues, and keeps them running together."
- id: kafka-developer
  title: "Kafka developer"
  extends: backend-engineer
  adds: [messaging, distributed-systems]
  summary: "Builds event-driven systems on Apache Kafka, where services publish and consume streams of events."
- id: java-microservices-developer
  title: "Java microservices developer"
  extends: backend-engineer
  adds: [spring-boot, messaging, docker, kubernetes]
  summary: "Builds Java services on Spring Boot that run in containers on Kubernetes and talk through Kafka."
- id: graduate-engineer-trainee-it
  title: "Graduate engineer trainee (IT)"
  extends: software-engineer
  search: "graduate engineer trainee"
  summary: "The fresher entry role at Indian IT services firms. Training first, then a project; the test is aptitude, coding and basics."
- id: associate-software-engineer
  title: "Associate software engineer"
  extends: software-engineer
  summary: "The first title at many product and services companies. Fixing bugs and building small features with a senior's review."
- id: systems-engineer-it
  title: "Systems engineer (IT services)"
  extends: software-engineer
  search: "systems engineer"
  summary: "The fresher title at TCS, Infosys and similar firms, covering development, testing and application support."
- id: c-plus-plus-developer
  title: "C++ developer"
  extends: software-engineer
  adds: [cpp, concurrency, os-processes-memory]
  search: "c++ developer"
  summary: "Writes performance-critical software in C++, from trading systems and games to browsers and embedded products."
- id: c-developer
  title: "C developer"
  extends: software-engineer
  adds: [c-and-memory, os-processes-memory]
  summary: "Writes low-level software in C: operating systems, networking stacks, drivers and embedded code."
- id: systems-programmer
  title: "Systems programmer"
  extends: software-engineer
  adds: [c-and-memory, os-processes-memory, concurrency, file-systems]
