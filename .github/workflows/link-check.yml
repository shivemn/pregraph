# Once a month, open every resource and certificate link. If any are broken,
# open (or update) one issue listing them, so dead links get fixed before
# anyone hits them. Run it by hand from the Actions tab at any time.
name: Monthly link check

on:
  schedule:
    - cron: '30 3 1 * *' # 03:30 UTC on the 1st of each month (9:00 in India)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check every link
        id: check
        continue-on-error: true
        run: npx tsx scripts/check-links.ts --markdown link-report.md
      - name: Report on the run page
        run: cat link-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the link-check issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Broken links found by the monthly check"
          gh label create links --color d93f0b --description "Dead or moved links" 2>/dev/null || true
          number=$(gh issue list --state open --label links --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file link-report.md
          else
            gh issue create --title "$title" --label links --body-file link-report.md
          fi
